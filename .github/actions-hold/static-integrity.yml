name: 静的整合性検証

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v6
      - name: Node.jsをセットアップ
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: ローカルリンク・サイトマップ・モデル参照を検証
        run: node scripts/validate-static-site.js
      - name: Live2Dランタイム契約とライフサイクルを検証
        run: npm run check:runtime
