name: KYRON Actions History Cleaner

on:
  push:
    branches: [main]
    paths: ['.github/workflows/actions-history-cleaner.yml']
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: pantry-actions-history-cleaner
  cancel-in-progress: false

jobs:
  clean:
    if: github.repository == 'pvtkyron/pantry-core'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Prune expired runs and strip retained-run logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_LIMIT: ${{ github.event_name == 'push' && '15' || '100' }}
          LOG_LIMIT: ${{ github.event_name == 'push' && '15' || '60' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, time, urllib.error, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          if repo != 'pvtkyron/pantry-core': raise SystemExit('Repository guard failed')
          token = os.environ['GH_TOKEN']
          base = f'https://api.github.com/repos/{repo}'
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def api(path, method='GET'):
              req = urllib.request.Request(base + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      body = response.read()
                      return (response.status, json.loads(body) if body else None)
              except urllib.error.HTTPError as exc:
                  if method == 'DELETE' and exc.code == 404: return (404, None)
                  raise RuntimeError(f'GitHub API {method} {path} failed: HTTP {exc.code}') from None

          rows = []
          for page in range(1, 101):
              _, data = api(f'/actions/runs?per_page=100&page={page}')
              current = data.get('workflow_runs', [])
              if not current: break
              rows.extend(current)
              if len(current) < 100: break
          else: raise RuntimeError('Pagination guard: over 100 pages')

          runs = sorted(rows, key=lambda r: (r.get('created_at') or '', int(r['id'])), reverse=True)
          critical = re.compile(r'^(patisserie|pantry-mirror|pantry-delta|launcher-publish|kyron-coherent-updater|component-.*|workspace-.*|source-pin.*|source-watch|pantry-watch|box|doctor.*|headless)\.ya?ml$')
          latest, successes = {}, {}
          for run in runs:
              key = run.get('path', '').rsplit('/', 1)[-1]
              latest.setdefault(key, int(run['id']))
              if run.get('conclusion') == 'success':
                  quota = 3 if critical.fullmatch(key) else 1
                  kept = successes.setdefault(key, [])
                  if len(kept) < quota: kept.append(int(run['id']))
          keep = set(latest.values()) | {ident for ids in successes.values() for ident in ids}
          now = time.time()
          from datetime import datetime
          def age(run):
              stamp = datetime.fromisoformat(run['created_at'].replace('Z', '+00:00'))
              return now - stamp.timestamp()
          completed = [r for r in runs if r['status'] == 'completed' and int(r['id']) != int(os.environ['GITHUB_RUN_ID'])]
          deletable = []
          for run in reversed(completed):
              path = run.get('path', '').rsplit('/', 1)[-1]
              hours = 72 if critical.fullmatch(path) else 2
              if int(run['id']) not in keep and age(run) >= hours * 3600: deletable.append(run)
          removed = 0
          for run in deletable[:int(os.environ['RUN_LIMIT'])]:
              code, _ = api(f"/actions/runs/{int(run['id'])}", 'DELETE')
              if code == 204: removed += 1
              time.sleep(.8)

          cleaned = 0
          remaining = [r for r in completed if int(r['id']) in keep and age(r) >= 900]
          for run in remaining[:int(os.environ['LOG_LIMIT'])]:
              code, _ = api(f"/actions/runs/{int(run['id'])}/logs", 'DELETE')
              if code == 204: cleaned += 1
              time.sleep(.8)
          print(f'[KYRON/ACTIONS/CLEAN] scanned={len(runs)} protected={len(keep)} removed_runs={removed} stripped_logs={cleaned} pending_run_candidates={max(0,len(deletable)-int(os.environ["RUN_LIMIT"]))}')
          PY
