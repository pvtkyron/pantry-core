name: KYRON Fast Source and Build Gates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-fast-path-smoke.yml'
      - '.github/workflows/source-pin.yml'
      - '.github/workflows/patisserie.yml'
      - '.github/workflows/project-sdk.yml'
      - '.github/workflows/project-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyron-fast-source-gates
  cancel-in-progress: false

jobs:
  sources:
    name: Sparse source pin and contracts
    uses: ./.github/workflows/source-pin.yml
    secrets: inherit

  sdk:
    name: SDK verification in parallel
    needs: sources
    if: ${{ needs.sources.result == 'success' }}
    uses: ./.github/workflows/project-sdk.yml
    with:
      capsule: ${{ needs.sources.outputs.capsule }}
    secrets: inherit

  web:
    name: Web verification in parallel
    needs: sources
    if: ${{ needs.sources.result == 'success' }}
    uses: ./.github/workflows/project-web.yml
    with:
      capsule: ${{ needs.sources.outputs.capsule }}
    secrets: inherit

  verified:
    name: Guard both source gates
    needs: [sources, sdk, web]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require both independent checks
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.sources.result }}
          SDK_RESULT: ${{ needs.sdk.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$SDK_RESULT" = success
          test "$WEB_RESULT" = success
          printf '[KYRON][FAST-GATES][OK] sources=%s sdk=%s web=%s\n' "$SOURCE_RESULT" "$SDK_RESULT" "$WEB_RESULT"
