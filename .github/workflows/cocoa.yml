name: Cocoa Shell

on:
  workflow_call:
    inputs:
      fold:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      fold:
        description: Fold fresh cream
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cocoa-shell
  cancel-in-progress: false

jobs:
  bake:
    name: Bake cocoa
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Set table
        shell: pwsh
        env:
          MIX: ${{ secrets.MIX_REPO }}
          MIX_KEY: ${{ secrets[vars.MIX_KEY_NAME] }}
          FILL: ${{ secrets.FILL_REPO }}
          FILL_KEY: ${{ secrets[vars.FILL_KEY_NAME] }}
        run: |
          $u="https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/.github/table.ps1"
          $p=Join-Path $env:RUNNER_TEMP 'table.ps1'
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri $u -OutFile $p -UseBasicParsing -TimeoutSec 20
          & $p
          exit $LASTEXITCODE

      - name: Chill oven
        uses: actions/cache@v4
        with:
          path: '*-sdk/Android/ndk'
          key: oven-android-${{ runner.os }}-${{ hashFiles('mix/toolchains.lock.json') }}

      - name: Chill crumbs
        uses: actions/cache@v4
        with:
          path: |
            mix/*/obj

          key: cocoa-${{ runner.os }}-${{ hashFiles('mix/toolchains.lock.json') }}-${{ github.run_id }}
          restore-keys: |
            cocoa-${{ runner.os }}-${{ hashFiles('mix/toolchains.lock.json') }}-
      - name: Bake
        shell: pwsh
        env:
          CREAM_A: ${{ secrets[vars.CREAM_A_NAME] }}
          CREAM_B: ${{ secrets[vars.CREAM_B_NAME] }}
          JAM_A: ${{ secrets[vars.JAM_A_NAME] }}
          JAM_B: ${{ secrets[vars.JAM_B_NAME] }}
          TIN: ${{ secrets[vars.TIN_NAME] }}
          PIN: ${{ secrets[vars.PIN_NAME] }}
        run: |
          $a=@{Fill=(Join-Path $PWD.Path 'filling');Slice='Cocoa'}
          if('${{ inputs.fold }}'-eq'true'){$a.Fold=$true}
          & ./mix/Tools/BakeSlice.ps1 @a
          exit $LASTEXITCODE
