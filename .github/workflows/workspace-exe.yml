name: Workspace Windows executable lane
'on':
  workflow_call:
    outputs:
      delivery_pending:
        description: Approved native delivery has not arrived yet
        value: ${{ jobs.exe.outputs.delivery_pending }}
      superseded:
        description: This source was superseded and must not be published
        value: ${{ jobs.exe.outputs.superseded }}
    inputs:
      capsule:
        required: true
        type: string
      direct_publish:
        required: false
        default: false
        type: boolean
      minimum_launch_epoch:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      capsule:
        required: true
        type: string
      direct_publish:
        required: false
        default: false
        type: boolean
      minimum_launch_epoch:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  exe:
    outputs:
      delivery_pending: ${{ steps.native.outputs.pending }}
      superseded: ${{ steps.build.outputs.superseded == 'true' || steps.direct_promotion.outputs.superseded == 'true' }}
    permissions:
      contents: read
      actions: write
    name: Compile signed Windows launcher
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      KYRON_SERIAL_BUILD: '1'
      KYRON_CANONICAL_SDK_ROOT: D:\kyron-sdk
      KYRON_SDK_ROOT: D:\kyron-sdk
      KYRON_BUILD_JOBS: '2'
      KYRON_MSBUILD_TIMEOUT_SECONDS: '1200'
      KYRON_SLICE_TIMEOUT_SECONDS: '3600'
      KYRON_HEARTBEAT_SECONDS: '30'
      KYRON_DISCORD_CLIENT_ID: ${{ secrets.KYRON_DISCORD_CLIENT_ID || vars.KYRON_DISCORD_CLIENT_ID || '1548955594143178762' }}
      ANDROID_HOME: ''
      ANDROID_SDK_ROOT: ''
      ANDROID_NDK_HOME: ''
      ANDROID_NDK_ROOT: ''
      NDK_ROOT: ''
      JAVA_HOME: ''
      KYRON_PANTRY_ROOT: ${{ github.workspace }}\source\Distribution
    steps:
    - name: Enable Git long paths before checkout
      shell: pwsh
      run: '$ErrorActionPreference=''Stop''

        & git config --global core.longpaths true

        if($LASTEXITCODE-ne0){throw ''Git long-path setup failed''}

        '
    - name: Bind ephemeral hosted data root
      shell: pwsh
      run: $root=Join-Path $env:RUNNER_TEMP ('kyron-state-exe-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT);"KYRON_WORKSPACE_DATA_ROOT=$root" >> $env:GITHUB_ENV
    - name: Open lane recipe
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        path: recipe
        fetch-depth: 1
        persist-credentials: false
        show-progress: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github
    - name: Open private source state
      id: state
      uses: ./recipe/.github/actions/private-capsule
      with:
        mode: open
        key: ${{ secrets[vars.MIX_KEY_NAME] }}
        capsule: ${{ inputs.capsule }}
        project: workspace
    - name: Open pinned Workspace and integrated distribution
      uses: actions/checkout@v5
      with:
        repository: ${{ secrets.MIX_REPO }}
        token: ${{ secrets[vars.MIX_KEY_NAME] }}
        ref: ${{ steps.state.outputs.workspace_ref }}
        path: source
        fetch-depth: 1
        fetch-tags: false
        persist-credentials: true
        show-progress: false
        sparse-checkout: '.gitattributes

          .gitignore

          AGENTS.md

          Directory.Build.props

          Kyron.sln

          etc

          Shared

          Launcher

          Bootstrap

          VeraInternal

          /Distribution/.gitattributes

          /Distribution/.gitignore

          /Distribution/SrcVersion.ini

          /Distribution/client

          /Distribution/release

          /Distribution/lib

          /Distribution/security

          /Distribution/tools

          '
        sparse-checkout-cone-mode: false
    - name: Bind exact release source pins
      shell: pwsh
      env:
        WORKSPACE_REF: ${{ steps.state.outputs.workspace_ref }}
        PANTRY_REF: ${{ steps.state.outputs.pantry_ref }}
      run: "$ErrorActionPreference='Stop'\nforeach($row in @(@('source',$env:WORKSPACE_REF),@('source/Distribution',$env:PANTRY_REF))){\n  $actual=(& git -C $row[0] rev-parse HEAD).Trim().ToLowerInvariant()\n\
        \  if($LASTEXITCODE-or$actual-ne$row[1]){throw 'Pinned release source mismatch'}\n  & git -C $row[0] checkout -q -B main HEAD\n  if($LASTEXITCODE){throw 'Release main binding\
        \ rejected'}\n}\n"
    - name: Validate pinned source delivery boundary before toolchain
      shell: pwsh
      run: '$ErrorActionPreference=''Stop''

        & ./source/etc/devtools/ValidatePantryContract.ps1

        if(!$?){throw ''Pinned Workspace/Pantry source contract rejected before toolchain provisioning''}

        $nativeStage=Get-Content -LiteralPath ''./source/Launcher/jni/Tools/native/PantryStage.inl'' -Raw

        if($nativeStage -notmatch ''workspace=launcher\.parent_path\(\)(?!\s*\.parent_path\(\))''){throw ''Native Launcher staging escaped canonical Workspace root''}

        Write-Host ''[PROJECT/WORKSPACE/EXE/NATIVE-ROOT][OK]''

        Write-Host ''[PROJECT/WORKSPACE/EXE/SOURCE-BOUNDARY][OK]''

        '
    - name: Audit SharedCore translation unit inventory
      shell: pwsh
      run: "$ErrorActionPreference='Stop'\n$root=Join-Path $PWD.Path 'source/Launcher/jni/SharedCore'\n$project=Join-Path $root 'SharedCore.vcxproj'\n[xml]$doc=Get-Content -LiteralPath\
        \ $project -Raw\n$ns=[Xml.XmlNamespaceManager]::new($doc.NameTable)\n$ns.AddNamespace('m','http://schemas.microsoft.com/developer/msbuild/2003')\n$sources=@(foreach($item in\
        \ $doc.SelectNodes('//m:ClCompile[@Include]',$ns)){\n  foreach($rel in ([string]$item.GetAttribute('Include')).Split(';')){\n    if($rel){$rel}\n  }\n})\nif($sources.Count -lt\
        \ 10){throw 'SharedCore source inventory unexpectedly small'}\n$missing=@($sources | Where-Object {!(Test-Path -LiteralPath (Join-Path $root $_) -PathType Leaf)})\nif($missing.Count){throw\
        \ \"Missing required SharedCore source: $($missing -join ', ')\"}\nif(!($sources -contains 'security\\hyper_encrypt.cpp')){throw 'SharedCore secure string decoder not compiled'}\n\
        Write-Host \"[PROJECT/WORKSPACE/EXE/SHAREDCORE][OK] sources=$($sources.Count)\"\n"
    - name: Materialize canonical Pantry signer
      shell: pwsh
      env:
        CREAM_A: ${{ secrets.KYRON_PANTRY_LOCAL_BOOTSTRAP_PRIVATE_PEM }}
        CREAM_B: ${{ secrets.KYRON_PANTRY_LOCAL_BOOTSTRAP_PUBLIC_PEM }}
        JAM_A: ${{ secrets.KYRON_PANTRY_LOCAL_CONTENT_PRIVATE_PEM }}
        JAM_B: ${{ secrets.KYRON_PANTRY_LOCAL_CONTENT_PUBLIC_PEM }}
      run: '$ErrorActionPreference=''Stop''

        foreach($n in @(''CREAM_A'',''CREAM_B'',''JAM_A'',''JAM_B'')){if([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($n))){throw "canonical local Pantry signer
        input missing: $n"}}

        . .\source\etc\build\workspace-common.ps1

        $root=Join-Path (Get-WorkspaceDataRoot) ''SigningKeys\PantryLocal\v1'';New-Item -ItemType Directory -Force -Path $root|Out-Null;$utf8=[Text.UTF8Encoding]::new($false)

        foreach($x in @(@(''bootstrap_root_private.pem'',''CREAM_A''),@(''bootstrap_root_public.pem'',''CREAM_B''),@(''content_private.pem'',''JAM_A''),@(''content_public.pem'',''JAM_B''))){[IO.File]::WriteAllText((Join-Path
        $root $x[0]),([Environment]::GetEnvironmentVariable($x[1])).Trim()+"`n",$utf8)}

        & .\source\etc\publishing\Initialize-LocalPantrySigner.ps1 -PantryPath (Join-Path $PWD.Path ''source/Distribution'') -Workspace (Join-Path $PWD.Path ''source'') -ExpectedProfile
        local-machine-v1 -Ephemeral -RequireExistingIdentity|Out-Null

        if(!$?){throw ''Canonical local Pantry signer validation failed''}

        '
    - name: Materialize and prove canonical Windows code signer
      shell: pwsh
      timeout-minutes: 5
      env:
        PFX_B64: ${{ secrets.KYRON_CODESIGN_PFX_B64 }}
        PFX_PASS: ${{ secrets.KYRON_CODESIGN_PASSWORD }}
      run: "$ErrorActionPreference='Stop'\nforeach($n in @('PFX_B64','PFX_PASS')){if([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($n))){throw 'Canonical Windows\
        \ signer input missing'}}\n$meta=Get-Content -LiteralPath 'source/etc/security/signing/canonical-signer.json' -Raw|ConvertFrom-Json\n$root=Join-Path $env:RUNNER_TEMP 'kyron-exe-codesign';New-Item\
        \ -ItemType Directory -Force -Path $root|Out-Null\n$pfx=Join-Path $root 'canonical.pfx';$raw=[Convert]::FromBase64String($env:PFX_B64)\ntry{[IO.File]::WriteAllBytes($pfx,$raw)}finally{[Array]::Clear($raw,0,$raw.Length)}\n\
        $password=$env:PFX_PASS.TrimEnd([char[]]\"`r`n\")\n$probe=[Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx,$password,[Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)\n\
        try{\n  $sha=[Security.Cryptography.SHA256]::Create()\n  try{$actual=([BitConverter]::ToString($sha.ComputeHash($probe.RawData))).Replace('-','').ToLowerInvariant()}finally{$sha.Dispose()}\n\
        \  if($actual-ne([string]$meta.certificate_sha256).ToLowerInvariant()-or!$probe.HasPrivateKey-or$probe.Thumbprint-ne$meta.thumbprint_sha1){throw 'Canonical Windows signer pin/private-key\
        \ mismatch'}\n  Write-Host '[PROJECT/WORKSPACE/EXE/CODESIGN] PFX identity pinned'\n  $public=[Security.Cryptography.X509Certificates.X509Certificate2]::new($probe.RawData)\n\
        \  foreach($name in @('Root','TrustedPublisher')){\n    $store=[Security.Cryptography.X509Certificates.X509Store]::new($name,'LocalMachine')\n    try{$store.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite);$store.Add($public)}finally{$store.Dispose()}\n\
        \  }\n  $public.Dispose()\n}finally{$probe.Dispose()}\nWrite-Host '[PROJECT/WORKSPACE/EXE/CODESIGN] ephemeral machine trust installed'\n$secure=ConvertTo-SecureString $password\
        \ -AsPlainText -Force\nImport-PfxCertificate -FilePath $pfx -CertStoreLocation 'Cert:\\CurrentUser\\My' -Password $secure|Out-Null\nWrite-Host '[PROJECT/WORKSPACE/EXE/CODESIGN]\
        \ current-user private signer imported'\n\"KYRON_CODESIGN_PFX=$pfx\" >> $env:GITHUB_ENV\n\"KYRON_CODESIGN_PASSWORD=$password\" >> $env:GITHUB_ENV\n$env:KYRON_CODESIGN_PFX=$pfx;$env:KYRON_CODESIGN_PASSWORD=$password\n\
        & .\\source\\etc\\security\\AndroidSigning\\validate-signing-contract.ps1\nif(!$?){throw 'Canonical Windows signer contract failed'}\n& .\\source\\etc\\security\\signing\\Assert-PreBuildSigner.ps1\
        \ -Workspace (Join-Path $PWD.Path 'source') -StateRoot $env:KYRON_WORKSPACE_DATA_ROOT\nif(!$?){throw 'Canonical Windows signer private-key challenge failed'}\nWrite-Host '[PROJECT/WORKSPACE/EXE/CODESIGN][OK]\
        \ canonical pinned signer proved on ephemeral hosted runner'\n"
    - name: Install managed .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Verify strict signed Launcher input identity regression
      shell: pwsh
      run: '$ErrorActionPreference=''Stop''

        & python ./source/etc/devtools/test_kyron_release_gate_identity.py

        if($LASTEXITCODE-ne0){throw ''Launcher signed input identity regression failed''}

        '
    - name: Bind managed SDK and tools
      shell: pwsh
      run: "$ErrorActionPreference='Stop';. .\\source\\etc\\build\\workspace-common.ps1\n$sdk=Resolve-WorkspaceSdkRoot\nforeach($row in @(@('dotnet','dotnet.exe'),@('Python','python.exe'))){\n\
        \  $tool=(Get-Command $row[1] -ErrorAction Stop).Source;$target=Join-Path $sdk ($row[0]+'\\current')\n  New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent)|Out-Null\n\
        \  if(!(Test-Path -LiteralPath $target)){New-Item -ItemType Junction -Path $target -Target (Split-Path $tool -Parent)|Out-Null}\n  if(!(Test-Path -LiteralPath (Join-Path $target\
        \ $row[1]))){throw 'Managed tool binding unavailable'}\n}\n$versions=@(& dotnet --list-sdks|ForEach-Object{if($_-match '^(8\\.0\\.[0-9]+)\\s'){[version]$matches[1]}}|Sort-Object\
        \ -Descending)\nif(!$versions.Count){throw 'Canonical .NET 8 SDK unavailable'}\n@{sdk=@{version=$versions[0].ToString();rollForward='latestPatch'}}|ConvertTo-Json -Depth 3|Set-Content\
        \ -LiteralPath (Join-Path $PWD.Path 'global.json') -Encoding UTF8\n$git=(Get-Command git.exe -ErrorAction Stop).Source;$python=Join-Path $sdk 'Python\\current\\python.exe'\n\"\
        KYRON_GIT=$git\" >> $env:GITHUB_ENV\n\"KYRON_PYTHON=$python\" >> $env:GITHUB_ENV\n\"KYRON_DOTNET=$(Join-Path $sdk 'dotnet\\current\\dotnet.exe')\" >> $env:GITHUB_ENV\n# Upstream\
        \ tools are immutable build dependencies, outside the private source tree.\n$androidRoot=Join-Path $env:RUNNER_TEMP 'android-platform-tools-r37.0.1'\n$archive=Join-Path $env:RUNNER_TEMP\
        \ 'platform-tools_r37.0.1-win.zip'\nInvoke-WebRequest -Uri 'https://dl.google.com/android/repository/platform-tools_r37.0.1-win.zip' -OutFile $archive -TimeoutSec 120\nif((Get-FileHash\
        \ -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()-cne'45f4d63113e895ebde0c90f194099a4676b6ac653bd28d54314a9e022bbc1a99'){throw 'Android platform-tools archive\
        \ digest rejected'}\nExpand-Archive -LiteralPath $archive -DestinationPath $androidRoot -Force\n$androidPath=Join-Path $androidRoot 'platform-tools'\n$pinOwner=Get-Content -LiteralPath\
        \ 'source/Launcher/jni/runtime/client/managed/KyronControl.Services/RuntimeToolBootstrapper.cs' -Raw\n$pins=[regex]::Matches($pinOwner,'new\\s*\\(\\s*\"client/tools/android/(?<name>[^\"\
        ]+)\"\\s*,\\s*\"(?<sha>[0-9a-f]{64})\"\\s*\\)')\nif($pins.Count-ne3){throw 'Canonical Android tool pin set is incomplete'}\nforeach($pin in $pins){\n  $name=$pin.Groups['name'].Value\n\
        \  if($name -notin @('adb.exe','AdbWinApi.dll','AdbWinUsbApi.dll')){throw 'Canonical Android tool name rejected'}\n  $path=Join-Path $androidPath $name\n  if(!(Test-Path -LiteralPath\
        \ $path -PathType Leaf)-or(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()-cne$pin.Groups['sha'].Value){throw \"Canonical Android tool digest rejected:\
        \ $name\"}\n}\n& (Join-Path $androidPath 'adb.exe') version\nif($LASTEXITCODE){throw 'Verified Android platform-tools process failed'}\n\"KYRON_ANDROID_PLATFORM_TOOLS_ROOT=$androidPath\"\
        \ >> $env:GITHUB_ENV\nWrite-Host '[PROJECT/WORKSPACE/EXE/ANDROID-TOOLS][OK] immutable upstream archive and canonical file pins verified'\n$divertArchive=Join-Path $env:RUNNER_TEMP\
        \ 'WinDivert-2.2.2-A.zip'\n$divertRoot=Join-Path $env:RUNNER_TEMP 'WinDivert-2.2.2-A'\nInvoke-WebRequest -Uri 'https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip'\
        \ -OutFile $divertArchive -TimeoutSec 120\nExpand-Archive -LiteralPath $divertArchive -DestinationPath $divertRoot -Force\n$divertPath=Join-Path $divertRoot 'WinDivert-2.2.2-A/x64'\n\
        $divertPins=@{'WinDivert.dll'='c1e060ee19444a259b2162f8af0f3fe8c4428a1c6f694dce20de194ac8d7d9a2';'WinDivert64.sys'='8da085332782708d8767bcace5327a6ec7283c17cfb85e40b03cd2323a90ddc2'}\n\
        foreach($name in $divertPins.Keys){\n  $path=Join-Path $divertPath $name\n  if(!(Test-Path -LiteralPath $path -PathType Leaf)-or(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()-cne$divertPins[$name]){throw\
        \ \"Canonical WinDivert digest rejected: $name\"}\n}\n\"KYRON_WINDIVERT_ROOT=$divertPath\" >> $env:GITHUB_ENV\nWrite-Host '[PROJECT/WORKSPACE/EXE/WINDIVERT][OK] immutable official\
        \ dependency; canonical native pins preserved'\n"
    - name: Ensure canonical Workspace toolchain
      shell: pwsh
      run: '$ErrorActionPreference=''Stop'';& .\source\etc\build\ensure-workspace-toolchain.ps1 -WindowsOnly;if(!$?){throw ''Canonical Workspace toolchain bootstrap failed''}

        '
    - name: Restore the exact frozen Bootstrap delivery
      shell: pwsh
      env:
        PRIVATE_SOURCE_REPOSITORY: ${{ secrets.MIX_REPO }}
      run: '& ./recipe/.github/scripts/Restore-FrozenBootstrap.ps1 -SourceRoot ./source -ExpectedRepository $env:PRIVATE_SOURCE_REPOSITORY

        if(!$?){throw ''Frozen Bootstrap delivery restore failed''}

        '
    - name: Restore pinned Commander bundles
      if: ${{ inputs.direct_publish }}
      shell: pwsh
      env:
        PRIVATE_SOURCE_REPOSITORY: ${{ secrets.MIX_REPO }}
      run: '& ./recipe/.github/scripts/Restore-PinnedCommanderBundles.ps1 -SourceRoot ./source -ExpectedRepository $env:PRIVATE_SOURCE_REPOSITORY

        if(!$?){throw ''Pinned Commander bundle restore failed''}

        '
    - name: Restore approved native delivery with original provenance
      id: native
      if: ${{ inputs.direct_publish }}
      shell: pwsh
      env:
        PRIVATE_SOURCE_REPOSITORY: ${{ secrets.MIX_REPO }}
      run: '& ./recipe/.github/scripts/Restore-ApprovedNativeRuntime.ps1 -SourceRoot ./source -ExpectedRepository $env:PRIVATE_SOURCE_REPOSITORY

        if(!$?){throw ''Approved native delivery restore failed''}

        '
    - name: Resolve verified hosted release floor
      id: release_policy
      shell: pwsh
      env:
        REQUESTED_EPOCH: ${{ github.event.client_payload.minimum_launch_epoch || github.event.inputs.minimum_launch_epoch || vars.KYRON_VERIFIED_MINIMUM_LAUNCH_EPOCH || '' }}
      run: '& python ./recipe/.github/scripts/release_policy.py "--requested=$env:REQUESTED_EPOCH"

        if($LASTEXITCODE){throw ''Hosted release floor rejected''}

        '
    - name: Compile and verify signed launcher lane
      if: ${{ steps.native.outputs.pending != 'true' }}
      id: build
      shell: pwsh -NoLogo -NoProfile -NonInteractive -File recipe/.github/scripts/Invoke-HostedReleaseStep.ps1 -Script {0}
      env:
        GITHUB_TOKEN: ${{ github.token }}
        KYRON_PANTRY_SIGNER_PROFILE: local-machine-v1
        KYRON_EXE_DIRECT_PUBLISH: ${{ inputs.direct_publish }}
        KYRON_FAST_COMPILE: '1'
        KYRON_COMPILE_JOBS: '3'
      run: "$ErrorActionPreference='Stop'\n# Reuse the credential proven by actions/checkout rather than re-encoding the raw secret.\n$checkoutHeader=@(& git -C source config --local\
        \ --get-all http.https://github.com/.extraheader 2>$null)\nif($LASTEXITCODE-ne0 -or $checkoutHeader.Count-ne1){throw 'Authenticated private checkout header unavailable'}\n$match=[regex]::Match([string]$checkoutHeader[0],\
        \ '(?i)^AUTHORIZATION:\\s*basic\\s+([A-Za-z0-9+/=]+)$')\nif(!$match.Success){throw 'Private checkout header format rejected'}\n$encoded=$match.Groups[1].Value\nWrite-Host \"\
        ::add-mask::$encoded\"\n$env:GIT_TERMINAL_PROMPT='0'\n$env:GIT_CONFIG_COUNT='2'\n$env:GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'\n$env:GIT_CONFIG_VALUE_0=''\n$env:GIT_CONFIG_KEY_1='http.https://github.com/.extraheader'\n\
        $env:GIT_CONFIG_VALUE_1=$checkoutHeader[0]\n$remote=@(& git -C source ls-remote --heads origin refs/heads/main 2>&1)\n$rc=$LASTEXITCODE\nif($rc-ne0 -or $remote.Count-ne1 -or\
        \ $remote[0]-notmatch '^[0-9a-fA-F]{40}\\s+refs/heads/main$'){\n  $kind=if($rc-eq0){'unexpected-ref'}elseif(($remote-join' | ')-match'(?i)(authentication failed|could not read\
        \ username|401|403|terminal prompts disabled)'){'auth-rejected'}else{'git-transport'}\n  throw \"[CI/AUTH/PRECHECK] private origin rejected rc=$rc category=$kind entries=$($remote.Count)\"\
        \n}\ntry {\n& .\\source\\etc\\devtools\\ValidatePantryContract.ps1;if(!$?){throw 'Canonical Workspace/Pantry contract validation failed'}\n& .\\source\\etc\\publishing\\Assert-FrozenBootstrap.ps1\
        \ -PantryPath (Join-Path $PWD.Path 'source/Distribution');if(!$?){throw 'Frozen Bootstrap verification failed'}\n$cacheGate=Join-Path $PWD.Path 'source/etc/devtools/KyronReleaseGate.py'\n\
        if(!(Test-Path -LiteralPath $cacheGate -PathType Leaf)){throw 'Launcher integrity gate unavailable'}\n$outerAudit=Join-Path $env:RUNNER_TEMP 'kyron-outer-launcher-inputs.json'\n\
        $gateBase=@('--root',(Join-Path $PWD.Path 'source'),'--sdk',$env:KYRON_CANONICAL_SDK_ROOT,'--profile','local-machine-v1','--pantry',(Join-Path $PWD.Path 'source/Distribution'),'--data',$env:KYRON_WORKSPACE_DATA_ROOT)\n\
        $gateArgs=$gateBase+@('--audit-file',$outerAudit,'--trace-file',(Join-Path $env:RUNNER_TEMP 'kyron-launcher-input-trace.json'))\n$key=@(& $env:KYRON_PYTHON $cacheGate key @gateArgs)\n\
        if($LASTEXITCODE-ne0 -or $key.Count-ne1 -or $key[0]-notmatch '^[a-f0-9]{64}$'){throw 'Prebuild source/signer/toolchain identity rejected'}\n$stableKey=@(& $env:KYRON_PYTHON $cacheGate\
        \ key @gateBase)\nif($LASTEXITCODE-ne0 -or $stableKey.Count-ne1 -or $stableKey[0]-cne$key[0]){throw '[CI/GATE/UNSTABLE] source digest changed before compilation'}\nWrite-Host\
        \ '[CI/GATE/STABLE] unchanged source identity in two independent prebuild reads'\n# Preserve the proven prebuild index outside the checkout. Hosted build\n# tools can stage deletions;\
        \ the signed source key must use the same\n# tracked-input inventory both before and after compilation.\n$gitDirs=@(& git -C source rev-parse --absolute-git-dir)\nif($LASTEXITCODE-ne0\
        \ -or $gitDirs.Count-ne1){throw '[CI/GATE/INDEX] Git directory unavailable'}\n$realIndex=Join-Path ([string]$gitDirs[0]) 'index'\n$pinnedIndex=Join-Path $env:RUNNER_TEMP ('kyron-exe-prebuild-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT+'.index')\n\
        if($env:GIT_INDEX_FILE -or !(Test-Path -LiteralPath $realIndex -PathType Leaf) -or (Test-Path -LiteralPath $pinnedIndex)){throw '[CI/GATE/INDEX] prebuild index unsuitable'}\n\
        Copy-Item -LiteralPath $realIndex -Destination $pinnedIndex -ErrorAction Stop\n$env:GIT_INDEX_FILE=$pinnedIndex\ntry {$pinnedKey=@(& $env:KYRON_PYTHON $cacheGate key @gateBase);$pinnedExit=$LASTEXITCODE}\n\
        finally {Remove-Item Env:GIT_INDEX_FILE -ErrorAction SilentlyContinue}\nif($pinnedExit-ne0 -or $pinnedKey.Count-ne1 -or $pinnedKey[0]-cne$key[0]){throw '[CI/GATE/INDEX] pinned\
        \ prebuild identity mismatch'}\nWrite-Host '[CI/GATE/INDEX/PINNED] exact authenticated prebuild tracked files captured'\n$prebuildTrace=Join-Path $env:RUNNER_TEMP ('kyron-exe-inputs-pre-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT+'.json')\n\
        Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'kyron-launcher-input-trace.json') -Destination $prebuildTrace -ErrorAction Stop\n& .\\source\\etc\\devtools\\BuildWindowsSlice.ps1\
        \ -Mode launcher\nif(!$?){throw 'Signed launcher release slice failed'}\nif(!(Test-Path -LiteralPath $outerAudit -PathType Leaf)){throw 'Outer source-input baseline disappeared\
        \ during build'}\nWrite-Host '[PROJECT/WORKSPACE/EXE][OK] signed launcher slice'\n$watched=@('Launcher/jni/runtime/third_party/aicommander-agent/packages/agent/bin/agent.ts','Launcher/jni/runtime/third_party/aicommander-agent/packages/priv-helper/bin/priv-helper.ts','Launcher/jni/security/include/PantryLocalTrust.generated.hpp')\n\
        # An ephemeral Git index is read-only evidence; never rewrite the shared\n# sparse index or mask actual file edits. Only known staged deletions are\n# tolerated here, and the\
        \ signed gate hashes current worktree bytes.\n$stagedChanges=@(& git -C source diff --cached --name-status HEAD -- $watched)\nif($LASTEXITCODE-ne0 -or @($stagedChanges|Where-Object{$_\
        \ -notmatch '^D\\s+'}).Count){throw '[CI/GATE/INDEX] unexpected staged watched input mutation'}\nWrite-Host \"[CI/GATE/INDEX] build-staged deletions=$($stagedChanges.Count);\
        \ prebuild index retained\"\n$env:GIT_INDEX_FILE=$pinnedIndex\n$missing=@($watched | Where-Object { !(Test-Path -LiteralPath (Join-Path $PWD.Path ('source/'+$_)) -PathType Leaf)\
        \ })\nif($missing.Count){\n  Write-Host \"[CI/GATE/SPARSE] restore missing pinned files=$($missing.Count)\"\n  & git -C source checkout-index --force -- $missing\n  if($LASTEXITCODE-ne0){throw\
        \ '[CI/GATE/SPARSE] pinned physical input recovery failed'}\n  foreach($rel in $missing){if(!(Test-Path -LiteralPath (Join-Path $PWD.Path ('source/'+$rel)) -PathType Leaf)){throw\
        \ \"[CI/GATE/SPARSE] pinned input still missing: $rel\"}}\n}\n$trackedDelta=@(& git -C source diff --name-only HEAD -- $watched)\nif($LASTEXITCODE-ne0){throw '[CI/GATE/GIT] source\
        \ status unavailable'}\nWrite-Host \"[CI/GATE/GIT] postbuild tracked-changed=$($trackedDelta.Count) paths=$(($trackedDelta -join ', '))\"\nif($trackedDelta.Count){\n  foreach($rel\
        \ in $watched){\n    $numstat=@(& git -C source diff --numstat HEAD -- $rel)\n    if(!$numstat.Count){continue}\n    $ranges=@(& git -C source diff --no-ext-diff --unified=0\
        \ HEAD -- $rel | Where-Object {$_ -match '^@@'})\n    & git -C source diff --quiet --ignore-space-at-eol HEAD -- $rel\n    $eolOnly=$LASTEXITCODE-eq0\n    Write-Host \"[CI/GATE/DIFF]\
        \ path=$rel numstat=$(($numstat -join ' | ')) ignore-eol-stable=$eolOnly ranges=$(($ranges|Select-Object -First 12)-join ';')\"\n  }\n}\n# Diagnostic only: compare per-input\
        \ hashes on the proven prebuild index.\n# Never accept a changed source/signer/toolchain key; fail explicitly.\n$postbuildTrace=Join-Path $env:RUNNER_TEMP ('kyron-exe-inputs-post-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT+'.json')\n\
        $observedKey=@(& $env:KYRON_PYTHON $cacheGate key @($gateBase+@('--trace-file',$postbuildTrace)))\nif($LASTEXITCODE-ne0 -or $observedKey.Count-ne1 -or $observedKey[0]-notmatch\
        \ '^[a-f0-9]{64}$'){throw '[CI/GATE/TRACE] postbuild source key unavailable'}\n$pre=Get-Content -LiteralPath $prebuildTrace -Raw | ConvertFrom-Json\n$post=Get-Content -LiteralPath\
        \ $postbuildTrace -Raw | ConvertFrom-Json\n$preHashes=@{};$postHashes=@{}\nforeach($f in @($pre.inputs.files)){$preHashes[[string]$f.path]=[string]$f.sha256}\nforeach($f in @($post.inputs.files)){$postHashes[[string]$f.path]=[string]$f.sha256}\n\
        $changed=@(@($preHashes.Keys)+@($postHashes.Keys)|Sort-Object -Unique|Where-Object{$preHashes[$_] -cne $postHashes[$_]})\nforeach($rel in ($changed|Select-Object -First 35)){Write-Host\
        \ \"[CI/GATE/TRACE/DIFF] source=$rel state=$($(if(!$preHashes.ContainsKey($rel)){'added'}elseif(!$postHashes.ContainsKey($rel)){'missing'}else{'hash-changed'}))\"}\nif(($pre.inputs.env|ConvertTo-Json\
        \ -Compress) -cne ($post.inputs.env|ConvertTo-Json -Compress)){Write-Host '[CI/GATE/TRACE/DIFF] signed environment inputs changed'}\nWrite-Host \"[CI/GATE/TRACE] changed_files=$($changed.Count)\
        \ key_equal=$($observedKey[0]-ceq$key[0])\"\nif($changed.Count -or $observedKey[0]-cne$key[0]){throw '[CI/GATE/TRACE] signed prebuild source identity changed'}\n& $env:KYRON_PYTHON\
        \ $cacheGate record --expected-key $key[0] @gateArgs\nif($LASTEXITCODE-ne0){throw 'Signed source/output digest attestation rejected'}\n& $env:KYRON_PYTHON $cacheGate check @gateArgs\n\
        if($LASTEXITCODE-ne0){throw 'Signed artifact repeat verification rejected'}\nRemove-Item Env:GIT_INDEX_FILE -ErrorAction SilentlyContinue\nWrite-Host '[PROJECT/WORKSPACE/EXE][INTEGRITY/PASS]\
        \ verified freshly compiled signed release'\n} finally {\n  foreach($name in @('GIT_TERMINAL_PROMPT','GIT_CONFIG_COUNT','GIT_CONFIG_KEY_0','GIT_CONFIG_VALUE_0','GIT_CONFIG_KEY_1','GIT_CONFIG_VALUE_1','GIT_INDEX_FILE')){Remove-Item\
        \ \"Env:$name\" -ErrorAction SilentlyContinue}\n}\n"
    - name: Seal executable lane
      if: ${{ steps.build.conclusion == 'success' && steps.build.outputs.superseded != 'true' }}
      id: shard
      shell: pwsh
      env:
        KYRON_HANDOFF_SECRET: ${{ secrets[vars.MIX_KEY_NAME] }}
      run: "$ErrorActionPreference='Stop'\n$workspaceSha=(& $env:KYRON_GIT -C source rev-parse HEAD).Trim().ToLowerInvariant();$pantrySha=(& $env:KYRON_GIT -C source/Distribution rev-parse\
        \ HEAD).Trim().ToLowerInvariant();$out=Join-Path $env:RUNNER_TEMP 'workspace-exe-handoff';$root=Join-Path $PWD.Path 'source'\nif(Test-Path -LiteralPath $out){Remove-Item -LiteralPath\
        \ $out -Recurse -Force}\n$bridge=Join-Path $root 'Launcher\\lib\\KyronLauncherRuntime\\Release\\net8.0-windows10.0.19041.0\\native\\GameLoopNativeBridge.exe'\nif(!(Test-Path\
        \ -LiteralPath $bridge -PathType Leaf)){throw 'GameLoop native bridge is missing from the managed runtime handoff'}\n$signature=Get-AuthenticodeSignature -LiteralPath $bridge\n\
        if($signature.Status-ne[Management.Automation.SignatureStatus]::Valid-or!$signature.SignerCertificate){throw \"GameLoop native bridge signature rejected: $($signature.Status)\"\
        }\n$meta=Get-Content -LiteralPath (Join-Path $root 'etc\\security\\signing\\canonical-signer.json') -Raw|ConvertFrom-Json\n$sha=[Security.Cryptography.SHA256]::Create();try{$bridgeSigner=(([BitConverter]::ToString($sha.ComputeHash($signature.SignerCertificate.RawData)))\
        \ -replace '-','').ToLowerInvariant()}finally{$sha.Dispose()}\nif($bridgeSigner-ne([string]$meta.certificate_sha256).ToLowerInvariant()){throw 'GameLoop native bridge signer\
        \ fingerprint mismatch'}\nWrite-Host '[PROJECT/WORKSPACE/EXE][GAMELOOP/OK] packaged bridge signature is canonical'\n$paths=@('Launcher\\lib\\x64\\Release\\local-machine-v1','Launcher\\\
        lib\\KyronLauncherRuntime\\Release\\net8.0-windows10.0.19041.0')\n$nativeToolFound=$false\nforeach($p in @('Launcher\\obj\\Tools','Launcher\\obj\\Launcher\\x64\\Release\\llvm\\\
        tools')){\n  if(Test-Path -LiteralPath (Join-Path $root $p) -PathType Container){$paths+=$p;$nativeToolFound=$true}\n}\nif(!$nativeToolFound){throw 'Native Launcher staging tool\
        \ is missing from the executable lane'}\n& (Join-Path $PWD.Path 'recipe\\.github\\workflows\\workspace-handoff.ps1') -Mode pack -Lane exe -PantryRoot (Join-Path $PWD.Path 'source/Distribution')\
        \ -WorkspaceSha $workspaceSha -PantrySha $pantrySha -Secret $env:KYRON_HANDOFF_SECRET -SourceRoot $root -Paths $paths -OutputRoot $out -Python $env:KYRON_PYTHON\nif(!$?){throw\
        \ 'Executable lane handoff sealing failed'}"
    - name: Upload encrypted executable lane
      if: ${{ steps.build.conclusion == 'success' && steps.build.outputs.superseded != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: kyron-workspace-exe-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.shard.outputs.root }}
        if-no-files-found: error
        retention-days: 1
        compression-level: 0
        overwrite: true
    - name: Promote verified Launcher outputs without recompiling
      id: direct_promotion
      if: ${{ inputs.direct_publish && steps.build.conclusion == 'success' && steps.build.outputs.superseded != 'true' && steps.native.outputs.pending != 'true' }}
      shell: pwsh -NoLogo -NoProfile -NonInteractive -File recipe/.github/scripts/Invoke-HostedReleaseStep.ps1 -Script {0}
      env:
        GITHUB_TOKEN: ${{ github.token }}
        KYRON_MINIMUM_LAUNCH_EPOCH: ${{ steps.release_policy.outputs.minimum_epoch }}
      run: '$ErrorActionPreference=''Stop''

        & ./source/etc/publishing/Update-PantryArtifacts.ps1 -PantryPath (Join-Path $PWD.Path ''source/Distribution'') -ArtifactPlan launcher -IncludeLauncher -SkipBuild -WorkspaceStatePrevalidated
        -PantryStatePrevalidated

        if(!$?){throw ''Launcher direct Pantry promotion failed''}

        Write-Host ''[PROJECT/WORKSPACE/EXE/PUBLISH][OK] verified launcher staged; compilation was already retained''

        '
    - name: Seal prepared generated delivery for canonical publisher
      if: ${{ inputs.direct_publish && steps.direct_promotion.conclusion == 'success' && steps.direct_promotion.outputs.superseded != 'true' }}
      id: prepared
      shell: pwsh
      env:
        KYRON_HANDOFF_SECRET: ${{ secrets[vars.MIX_KEY_NAME] }}
      run: '& ./recipe/.github/scripts/Seal-PreparedDelivery.ps1 -SourceRoot ./source -OutputRoot (Join-Path $env:RUNNER_TEMP ''workspace-prepared-delivery'')

        if(!$?){throw ''Prepared generated delivery sealing failed''}

        '
    - name: Upload encrypted prepared delivery
      if: ${{ inputs.direct_publish && steps.direct_promotion.conclusion == 'success' && steps.direct_promotion.outputs.superseded != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: kyron-workspace-delivery-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.prepared.outputs.root }}
        if-no-files-found: error
        retention-days: 2
    - name: Remove ephemeral signer files
      if: ${{ always() }}
      shell: pwsh
      run: "$pfx=$env:KYRON_CODESIGN_PFX\nif(![string]::IsNullOrWhiteSpace($pfx)-and(Test-Path -LiteralPath $pfx -PathType Leaf)){\n  $len=(Get-Item -LiteralPath $pfx).Length\n  if($len-gt0){[IO.File]::WriteAllBytes($pfx,(New-Object\
        \ byte[] $len))}\n  Remove-Item -LiteralPath $pfx -Force\n}\nif(Test-Path '.\\source\\etc\\build\\workspace-common.ps1'){\n  . .\\source\\etc\\build\\workspace-common.ps1\n \
        \ $root=Join-Path (Get-WorkspaceDataRoot) 'SigningKeys\\PantryLocal\\v1'\n  if(Test-Path -LiteralPath $root){Remove-Item -LiteralPath $root -Recurse -Force}\n}\n"
    if: ${{ github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' }}
