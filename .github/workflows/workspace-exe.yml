name: Workspace Windows executable lane
'on':
  workflow_call:
    outputs:
      superseded:
        description: This source was superseded and must not be published
        value: ${{ jobs.exe.outputs.superseded }}
    inputs:
      capsule:
        required: true
        type: string
      direct_publish:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      capsule:
        required: true
        type: string
      direct_publish:
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  exe:
    outputs:
      superseded: ${{ steps.build.outputs.superseded }}
    permissions:
      contents: read
      actions: write
    name: Compile signed Windows launcher
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      KYRON_SERIAL_BUILD: '1'
      KYRON_CANONICAL_SDK_ROOT: D:\kyron-sdk
      KYRON_SDK_ROOT: D:\kyron-sdk
      KYRON_BUILD_JOBS: '2'
      KYRON_MSBUILD_TIMEOUT_SECONDS: '1200'
      KYRON_SLICE_TIMEOUT_SECONDS: '3600'
      KYRON_HEARTBEAT_SECONDS: '30'
      KYRON_DISCORD_CLIENT_ID: ${{ secrets.KYRON_DISCORD_CLIENT_ID || vars.KYRON_DISCORD_CLIENT_ID || '1548955594143178762'
        }}
      ANDROID_HOME: ''
      ANDROID_SDK_ROOT: ''
      ANDROID_NDK_HOME: ''
      ANDROID_NDK_ROOT: ''
      NDK_ROOT: ''
      JAVA_HOME: ''
      KYRON_PANTRY_ROOT: ${{ github.workspace }}\source\Distribution
    steps:
    - name: Enable Git long paths before checkout
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        & git config --global core.longpaths true
        if($LASTEXITCODE-ne0){throw 'Git long-path setup failed'}
    - name: Bind ephemeral hosted data root
      shell: pwsh
      run: $root=Join-Path $env:RUNNER_TEMP ('kyron-state-exe-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT);"KYRON_WORKSPACE_DATA_ROOT=$root"
        >> $env:GITHUB_ENV
    - name: Open lane recipe
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        path: recipe
        fetch-depth: 1
        persist-credentials: false
        show-progress: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github
    - name: Open private source state
      id: state
      uses: ./recipe/.github/actions/private-capsule
      with:
        mode: open
        key: ${{ secrets[vars.MIX_KEY_NAME] }}
        capsule: ${{ inputs.capsule }}
        project: workspace
    - name: Open pinned Workspace and integrated distribution
      uses: actions/checkout@v5
      with:
        repository: ${{ secrets.MIX_REPO }}
        token: ${{ secrets[vars.MIX_KEY_NAME] }}
        ref: ${{ steps.state.outputs.workspace_ref }}
        path: source
        fetch-depth: 1
        fetch-tags: false
        persist-credentials: true
        show-progress: false
        sparse-checkout: |
          .gitattributes
          .gitignore
          AGENTS.md
          Directory.Build.props
          Kyron.sln
          etc
          Shared
          Launcher
          Bootstrap
          VeraInternal
          /Distribution/.gitattributes
          /Distribution/.gitignore
          /Distribution/SrcVersion.ini
          /Distribution/client
          /Distribution/release
          /Distribution/lib
          /Distribution/security
          /Distribution/tools
        sparse-checkout-cone-mode: false
    - name: Bind exact release source pins
      shell: pwsh
      env:
        WORKSPACE_REF: ${{ steps.state.outputs.workspace_ref }}
        PANTRY_REF: ${{ steps.state.outputs.pantry_ref }}
      run: |
        $ErrorActionPreference='Stop'
        foreach($row in @(@('source',$env:WORKSPACE_REF),@('source/Distribution',$env:PANTRY_REF))){
          $actual=(& git -C $row[0] rev-parse HEAD).Trim().ToLowerInvariant()
          if($LASTEXITCODE-or$actual-ne$row[1]){throw 'Pinned release source mismatch'}
          & git -C $row[0] checkout -q -B main HEAD
          if($LASTEXITCODE){throw 'Release main binding rejected'}
        }
    - name: Validate pinned source delivery boundary before toolchain
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        & ./source/etc/devtools/ValidatePantryContract.ps1
        if(!$?){throw 'Pinned Workspace/Pantry source contract rejected before toolchain provisioning'}
        $nativeStage=Get-Content -LiteralPath './source/Launcher/jni/Tools/native/PantryStage.inl' -Raw
        if($nativeStage -notmatch 'workspace=launcher\.parent_path\(\)(?!\s*\.parent_path\(\))'){throw 'Native Launcher staging escaped canonical Workspace root'}
        Write-Host '[PROJECT/WORKSPACE/EXE/NATIVE-ROOT][OK]'
        Write-Host '[PROJECT/WORKSPACE/EXE/SOURCE-BOUNDARY][OK]'
    - name: Audit SharedCore translation unit inventory
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $root=Join-Path $PWD.Path 'source/Launcher/jni/SharedCore'
        $project=Join-Path $root 'SharedCore.vcxproj'
        [xml]$doc=Get-Content -LiteralPath $project -Raw
        $ns=[Xml.XmlNamespaceManager]::new($doc.NameTable)
        $ns.AddNamespace('m','http://schemas.microsoft.com/developer/msbuild/2003')
        $sources=@(foreach($item in $doc.SelectNodes('//m:ClCompile[@Include]',$ns)){
          foreach($rel in ([string]$item.GetAttribute('Include')).Split(';')){
            if($rel){$rel}
          }
        })
        if($sources.Count -lt 10){throw 'SharedCore source inventory unexpectedly small'}
        $missing=@($sources | Where-Object {!(Test-Path -LiteralPath (Join-Path $root $_) -PathType Leaf)})
        if($missing.Count){throw "Missing required SharedCore source: $($missing -join ', ')"}
        if(!($sources -contains 'security\hyper_encrypt.cpp')){throw 'SharedCore secure string decoder not compiled'}
        Write-Host "[PROJECT/WORKSPACE/EXE/SHAREDCORE][OK] sources=$($sources.Count)"
    - name: Materialize canonical Pantry signer
      shell: pwsh
      env:
        CREAM_A: ${{ secrets.KYRON_PANTRY_LOCAL_BOOTSTRAP_PRIVATE_PEM }}
        CREAM_B: ${{ secrets.KYRON_PANTRY_LOCAL_BOOTSTRAP_PUBLIC_PEM }}
        JAM_A: ${{ secrets.KYRON_PANTRY_LOCAL_CONTENT_PRIVATE_PEM }}
        JAM_B: ${{ secrets.KYRON_PANTRY_LOCAL_CONTENT_PUBLIC_PEM }}
      run: |
        $ErrorActionPreference='Stop'
        foreach($n in @('CREAM_A','CREAM_B','JAM_A','JAM_B')){if([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($n))){throw "canonical local Pantry signer input missing: $n"}}
        . .\source\etc\build\workspace-common.ps1
        $root=Join-Path (Get-WorkspaceDataRoot) 'SigningKeys\PantryLocal\v1';New-Item -ItemType Directory -Force -Path $root|Out-Null;$utf8=[Text.UTF8Encoding]::new($false)
        foreach($x in @(@('bootstrap_root_private.pem','CREAM_A'),@('bootstrap_root_public.pem','CREAM_B'),@('content_private.pem','JAM_A'),@('content_public.pem','JAM_B'))){[IO.File]::WriteAllText((Join-Path $root $x[0]),([Environment]::GetEnvironmentVariable($x[1])).Trim()+"`n",$utf8)}
        & .\source\etc\publishing\Initialize-LocalPantrySigner.ps1 -PantryPath (Join-Path $PWD.Path 'source/Distribution') -Workspace (Join-Path $PWD.Path 'source') -ExpectedProfile local-machine-v1 -Ephemeral -RequireExistingIdentity|Out-Null
        if(!$?){throw 'Canonical local Pantry signer validation failed'}
    - name: Materialize and prove canonical Windows code signer
      shell: pwsh
      timeout-minutes: 5
      env:
        PFX_B64: ${{ secrets.KYRON_CODESIGN_PFX_B64 }}
        PFX_PASS: ${{ secrets.KYRON_CODESIGN_PASSWORD }}
      run: |
        $ErrorActionPreference='Stop'
        foreach($n in @('PFX_B64','PFX_PASS')){if([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($n))){throw 'Canonical Windows signer input missing'}}
        $meta=Get-Content -LiteralPath 'source/etc/security/signing/canonical-signer.json' -Raw|ConvertFrom-Json
        $root=Join-Path $env:RUNNER_TEMP 'kyron-exe-codesign';New-Item -ItemType Directory -Force -Path $root|Out-Null
        $pfx=Join-Path $root 'canonical.pfx';$raw=[Convert]::FromBase64String($env:PFX_B64)
        try{[IO.File]::WriteAllBytes($pfx,$raw)}finally{[Array]::Clear($raw,0,$raw.Length)}
        $password=$env:PFX_PASS.TrimEnd([char[]]"`r`n")
        $probe=[Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx,$password,[Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
        try{
          $sha=[Security.Cryptography.SHA256]::Create()
          try{$actual=([BitConverter]::ToString($sha.ComputeHash($probe.RawData))).Replace('-','').ToLowerInvariant()}finally{$sha.Dispose()}
          if($actual-ne([string]$meta.certificate_sha256).ToLowerInvariant()-or!$probe.HasPrivateKey-or$probe.Thumbprint-ne$meta.thumbprint_sha1){throw 'Canonical Windows signer pin/private-key mismatch'}
          Write-Host '[PROJECT/WORKSPACE/EXE/CODESIGN] PFX identity pinned'
          $public=[Security.Cryptography.X509Certificates.X509Certificate2]::new($probe.RawData)
          foreach($name in @('Root','TrustedPublisher')){
            $store=[Security.Cryptography.X509Certificates.X509Store]::new($name,'LocalMachine')
            try{$store.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite);$store.Add($public)}finally{$store.Dispose()}
          }
          $public.Dispose()
        }finally{$probe.Dispose()}
        Write-Host '[PROJECT/WORKSPACE/EXE/CODESIGN] ephemeral machine trust installed'
        $secure=ConvertTo-SecureString $password -AsPlainText -Force
        Import-PfxCertificate -FilePath $pfx -CertStoreLocation 'Cert:\CurrentUser\My' -Password $secure|Out-Null
        Write-Host '[PROJECT/WORKSPACE/EXE/CODESIGN] current-user private signer imported'
        "KYRON_CODESIGN_PFX=$pfx" >> $env:GITHUB_ENV
        "KYRON_CODESIGN_PASSWORD=$password" >> $env:GITHUB_ENV
        $env:KYRON_CODESIGN_PFX=$pfx;$env:KYRON_CODESIGN_PASSWORD=$password
        & .\source\etc\security\AndroidSigning\validate-signing-contract.ps1
        if(!$?){throw 'Canonical Windows signer contract failed'}
        & .\source\etc\security\signing\Assert-PreBuildSigner.ps1 -Workspace (Join-Path $PWD.Path 'source') -StateRoot $env:KYRON_WORKSPACE_DATA_ROOT
        if(!$?){throw 'Canonical Windows signer private-key challenge failed'}
        Write-Host '[PROJECT/WORKSPACE/EXE/CODESIGN][OK] canonical pinned signer proved on ephemeral hosted runner'
    - name: Install managed .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Verify strict signed Launcher input identity regression
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        & python ./source/etc/devtools/test_kyron_release_gate_identity.py
        if($LASTEXITCODE-ne0){throw 'Launcher signed input identity regression failed'}
    - name: Bind managed SDK and tools
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop';. .\source\etc\build\workspace-common.ps1
        $sdk=Resolve-WorkspaceSdkRoot
        foreach($row in @(@('dotnet','dotnet.exe'),@('Python','python.exe'))){
          $tool=(Get-Command $row[1] -ErrorAction Stop).Source;$target=Join-Path $sdk ($row[0]+'\current')
          New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent)|Out-Null
          if(!(Test-Path -LiteralPath $target)){New-Item -ItemType Junction -Path $target -Target (Split-Path $tool -Parent)|Out-Null}
          if(!(Test-Path -LiteralPath (Join-Path $target $row[1]))){throw 'Managed tool binding unavailable'}
        }
        $versions=@(& dotnet --list-sdks|ForEach-Object{if($_-match '^(8\.0\.[0-9]+)\s'){[version]$matches[1]}}|Sort-Object -Descending)
        if(!$versions.Count){throw 'Canonical .NET 8 SDK unavailable'}
        @{sdk=@{version=$versions[0].ToString();rollForward='latestPatch'}}|ConvertTo-Json -Depth 3|Set-Content -LiteralPath (Join-Path $PWD.Path 'global.json') -Encoding UTF8
        $git=(Get-Command git.exe -ErrorAction Stop).Source;$python=Join-Path $sdk 'Python\current\python.exe'
        "KYRON_GIT=$git" >> $env:GITHUB_ENV
        "KYRON_PYTHON=$python" >> $env:GITHUB_ENV
        "KYRON_DOTNET=$(Join-Path $sdk 'dotnet\current\dotnet.exe')" >> $env:GITHUB_ENV
        & git -C source sparse-checkout add '/Distribution/client/tools/android'
        if($LASTEXITCODE){throw 'Pinned Android tool sparse-checkout expansion failed'}
        & git -C source restore --source=HEAD --worktree --ignore-skip-worktree-bits -- 'Distribution/client/tools/android'
        if($LASTEXITCODE){throw 'Pinned Android tool bundle not materialized from Workspace HEAD'}
        $androidPath=Join-Path $PWD.Path 'source/Distribution/client/tools/android'
        if(!(Test-Path -LiteralPath $androidPath -PathType Container)){throw 'Pinned Pantry Android directory unavailable'}
        foreach($name in @('adb.exe','AdbWinApi.dll','AdbWinUsbApi.dll')){if(!(Test-Path -LiteralPath (Join-Path $androidPath $name) -PathType Leaf)){throw "Pinned Android tool missing: $name"}}
        "KYRON_ANDROID_PLATFORM_TOOLS_ROOT=$androidPath" >> $env:GITHUB_ENV
    - name: Ensure canonical Workspace toolchain
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop';& .\source\etc\build\ensure-workspace-toolchain.ps1 -WindowsOnly;if(!$?){throw 'Canonical Workspace toolchain bootstrap failed'}
    - name: Compile signed launcher lane and publish directly when requested
      id: build
      shell: pwsh -NoLogo -NoProfile -NonInteractive -File recipe/.github/scripts/Invoke-HostedReleaseStep.ps1 -Script {0}
      env:
        GITHUB_TOKEN: ${{ github.token }}
        KYRON_PANTRY_SIGNER_PROFILE: local-machine-v1
        KYRON_EXE_DIRECT_PUBLISH: ${{ inputs.direct_publish }}
        KYRON_FAST_COMPILE: '1'
        KYRON_COMPILE_JOBS: '3'
      run: |
        $ErrorActionPreference='Stop'
        # Reuse the credential proven by actions/checkout rather than re-encoding the raw secret.
        $checkoutHeader=@(& git -C source config --local --get-all http.https://github.com/.extraheader 2>$null)
        if($LASTEXITCODE-ne0 -or $checkoutHeader.Count-ne1){throw 'Authenticated private checkout header unavailable'}
        $match=[regex]::Match([string]$checkoutHeader[0], '(?i)^AUTHORIZATION:\s*basic\s+([A-Za-z0-9+/=]+)$')
        if(!$match.Success){throw 'Private checkout header format rejected'}
        $encoded=$match.Groups[1].Value
        Write-Host "::add-mask::$encoded"
        $env:GIT_TERMINAL_PROMPT='0'
        $env:GIT_CONFIG_COUNT='2'
        $env:GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
        $env:GIT_CONFIG_VALUE_0=''
        $env:GIT_CONFIG_KEY_1='http.https://github.com/.extraheader'
        $env:GIT_CONFIG_VALUE_1=$checkoutHeader[0]
        $remote=@(& git -C source ls-remote --heads origin refs/heads/main 2>&1)
        $rc=$LASTEXITCODE
        if($rc-ne0 -or $remote.Count-ne1 -or $remote[0]-notmatch '^[0-9a-fA-F]{40}\s+refs/heads/main$'){
          $kind=if($rc-eq0){'unexpected-ref'}elseif(($remote-join' | ')-match'(?i)(authentication failed|could not read username|401|403|terminal prompts disabled)'){'auth-rejected'}else{'git-transport'}
          throw "[CI/AUTH/PRECHECK] private origin rejected rc=$rc category=$kind entries=$($remote.Count)"
        }
        try {
        & .\source\etc\devtools\ValidatePantryContract.ps1;if(!$?){throw 'Canonical Workspace/Pantry contract validation failed'}
        & .\source\etc\publishing\Assert-FrozenBootstrap.ps1 -PantryPath (Join-Path $PWD.Path 'source/Distribution');if(!$?){throw 'Frozen Bootstrap verification failed'}
        $cacheGate=Join-Path $PWD.Path 'source/etc/devtools/KyronReleaseGate.py'
        if(!(Test-Path -LiteralPath $cacheGate -PathType Leaf)){throw 'Launcher integrity gate unavailable'}
        $outerAudit=Join-Path $env:RUNNER_TEMP 'kyron-outer-launcher-inputs.json'
        $gateBase=@('--root',(Join-Path $PWD.Path 'source'),'--sdk',$env:KYRON_CANONICAL_SDK_ROOT,'--profile','local-machine-v1','--pantry',(Join-Path $PWD.Path 'source/Distribution'),'--data',$env:KYRON_WORKSPACE_DATA_ROOT)
        $gateArgs=$gateBase+@('--audit-file',$outerAudit,'--trace-file',(Join-Path $env:RUNNER_TEMP 'kyron-launcher-input-trace.json'))
        $key=@(& $env:KYRON_PYTHON $cacheGate key @gateArgs)
        if($LASTEXITCODE-ne0 -or $key.Count-ne1 -or $key[0]-notmatch '^[a-f0-9]{64}$'){throw 'Prebuild source/signer/toolchain identity rejected'}
        $stableKey=@(& $env:KYRON_PYTHON $cacheGate key @gateBase)
        if($LASTEXITCODE-ne0 -or $stableKey.Count-ne1 -or $stableKey[0]-cne$key[0]){throw '[CI/GATE/UNSTABLE] source digest changed before compilation'}
        Write-Host '[CI/GATE/STABLE] unchanged source identity in two independent prebuild reads'
        # Preserve the proven prebuild index outside the checkout. Hosted build
        # tools can stage deletions; the signed source key must use the same
        # tracked-input inventory both before and after compilation.
        $gitDirs=@(& git -C source rev-parse --absolute-git-dir)
        if($LASTEXITCODE-ne0 -or $gitDirs.Count-ne1){throw '[CI/GATE/INDEX] Git directory unavailable'}
        $realIndex=Join-Path ([string]$gitDirs[0]) 'index'
        $pinnedIndex=Join-Path $env:RUNNER_TEMP ('kyron-exe-prebuild-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT+'.index')
        if($env:GIT_INDEX_FILE -or !(Test-Path -LiteralPath $realIndex -PathType Leaf) -or (Test-Path -LiteralPath $pinnedIndex)){throw '[CI/GATE/INDEX] prebuild index unsuitable'}
        Copy-Item -LiteralPath $realIndex -Destination $pinnedIndex -ErrorAction Stop
        $env:GIT_INDEX_FILE=$pinnedIndex
        try {$pinnedKey=@(& $env:KYRON_PYTHON $cacheGate key @gateBase);$pinnedExit=$LASTEXITCODE}
        finally {Remove-Item Env:GIT_INDEX_FILE -ErrorAction SilentlyContinue}
        if($pinnedExit-ne0 -or $pinnedKey.Count-ne1 -or $pinnedKey[0]-cne$key[0]){throw '[CI/GATE/INDEX] pinned prebuild identity mismatch'}
        Write-Host '[CI/GATE/INDEX/PINNED] exact authenticated prebuild tracked files captured'
        $prebuildTrace=Join-Path $env:RUNNER_TEMP ('kyron-exe-inputs-pre-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT+'.json')
        Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'kyron-launcher-input-trace.json') -Destination $prebuildTrace -ErrorAction Stop
        & .\source\etc\devtools\BuildWindowsSlice.ps1 -Mode launcher
        if(!$?){throw 'Signed launcher release slice failed'}
        if(!(Test-Path -LiteralPath $outerAudit -PathType Leaf)){throw 'Outer source-input baseline disappeared during build'}
        Write-Host '[PROJECT/WORKSPACE/EXE][OK] signed launcher slice'
        $watched=@('Launcher/jni/runtime/third_party/aicommander-agent/packages/agent/bin/agent.ts','Launcher/jni/runtime/third_party/aicommander-agent/packages/priv-helper/bin/priv-helper.ts','Launcher/jni/security/include/PantryLocalTrust.generated.hpp')
        # An ephemeral Git index is read-only evidence; never rewrite the shared
        # sparse index or mask actual file edits. Only known staged deletions are
        # tolerated here, and the signed gate hashes current worktree bytes.
        $stagedChanges=@(& git -C source diff --cached --name-status HEAD -- $watched)
        if($LASTEXITCODE-ne0 -or @($stagedChanges|Where-Object{$_ -notmatch '^D\s+'}).Count){throw '[CI/GATE/INDEX] unexpected staged watched input mutation'}
        Write-Host "[CI/GATE/INDEX] build-staged deletions=$($stagedChanges.Count); prebuild index retained"
        $env:GIT_INDEX_FILE=$pinnedIndex
        $missing=@($watched | Where-Object { !(Test-Path -LiteralPath (Join-Path $PWD.Path ('source/'+$_)) -PathType Leaf) })
        if($missing.Count){
          Write-Host "[CI/GATE/SPARSE] restore missing pinned files=$($missing.Count)"
          & git -C source checkout-index --force -- $missing
          if($LASTEXITCODE-ne0){throw '[CI/GATE/SPARSE] pinned physical input recovery failed'}
          foreach($rel in $missing){if(!(Test-Path -LiteralPath (Join-Path $PWD.Path ('source/'+$rel)) -PathType Leaf)){throw "[CI/GATE/SPARSE] pinned input still missing: $rel"}}
        }
        $trackedDelta=@(& git -C source diff --name-only HEAD -- $watched)
        if($LASTEXITCODE-ne0){throw '[CI/GATE/GIT] source status unavailable'}
        Write-Host "[CI/GATE/GIT] postbuild tracked-changed=$($trackedDelta.Count) paths=$(($trackedDelta -join ', '))"
        if($trackedDelta.Count){
          foreach($rel in $watched){
            $numstat=@(& git -C source diff --numstat HEAD -- $rel)
            if(!$numstat.Count){continue}
            $ranges=@(& git -C source diff --no-ext-diff --unified=0 HEAD -- $rel | Where-Object {$_ -match '^@@'})
            & git -C source diff --quiet --ignore-space-at-eol HEAD -- $rel
            $eolOnly=$LASTEXITCODE-eq0
            Write-Host "[CI/GATE/DIFF] path=$rel numstat=$(($numstat -join ' | ')) ignore-eol-stable=$eolOnly ranges=$(($ranges|Select-Object -First 12)-join ';')"
          }
        }
        # Diagnostic only: compare per-input hashes on the proven prebuild index.
        # Never accept a changed source/signer/toolchain key; fail explicitly.
        $postbuildTrace=Join-Path $env:RUNNER_TEMP ('kyron-exe-inputs-post-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT+'.json')
        $observedKey=@(& $env:KYRON_PYTHON $cacheGate key @($gateBase+@('--trace-file',$postbuildTrace)))
        if($LASTEXITCODE-ne0 -or $observedKey.Count-ne1 -or $observedKey[0]-notmatch '^[a-f0-9]{64}$'){throw '[CI/GATE/TRACE] postbuild source key unavailable'}
        $pre=Get-Content -LiteralPath $prebuildTrace -Raw | ConvertFrom-Json
        $post=Get-Content -LiteralPath $postbuildTrace -Raw | ConvertFrom-Json
        $preHashes=@{};$postHashes=@{}
        foreach($f in @($pre.inputs.files)){$preHashes[[string]$f.path]=[string]$f.sha256}
        foreach($f in @($post.inputs.files)){$postHashes[[string]$f.path]=[string]$f.sha256}
        $changed=@(@($preHashes.Keys)+@($postHashes.Keys)|Sort-Object -Unique|Where-Object{$preHashes[$_] -cne $postHashes[$_]})
        foreach($rel in ($changed|Select-Object -First 35)){Write-Host "[CI/GATE/TRACE/DIFF] source=$rel state=$($(if(!$preHashes.ContainsKey($rel)){'added'}elseif(!$postHashes.ContainsKey($rel)){'missing'}else{'hash-changed'}))"}
        if(($pre.inputs.env|ConvertTo-Json -Compress) -cne ($post.inputs.env|ConvertTo-Json -Compress)){Write-Host '[CI/GATE/TRACE/DIFF] signed environment inputs changed'}
        Write-Host "[CI/GATE/TRACE] changed_files=$($changed.Count) key_equal=$($observedKey[0]-ceq$key[0])"
        if($changed.Count -or $observedKey[0]-cne$key[0]){throw '[CI/GATE/TRACE] signed prebuild source identity changed'}
        & $env:KYRON_PYTHON $cacheGate record --expected-key $key[0] @gateArgs
        if($LASTEXITCODE-ne0){throw 'Signed source/output digest attestation rejected'}
        & $env:KYRON_PYTHON $cacheGate check @gateArgs
        if($LASTEXITCODE-ne0){throw 'Signed artifact repeat verification rejected'}
        Remove-Item Env:GIT_INDEX_FILE -ErrorAction SilentlyContinue
        Write-Host '[PROJECT/WORKSPACE/EXE][INTEGRITY/PASS] verified freshly compiled signed release'
        if($env:KYRON_EXE_DIRECT_PUBLISH-eq'true'){
            $ErrorActionPreference='Stop'
          & .\source\etc\publishing\Update-PantryArtifacts.ps1 -PantryPath (Join-Path $PWD.Path 'source/Distribution') -ArtifactPlan launcher -IncludeLauncher -SkipBuild -WorkspaceStatePrevalidated -PantryStatePrevalidated
          if(!$?){throw 'Launcher direct Pantry promotion failed'}
          Write-Host '[PROJECT/WORKSPACE/EXE/PUBLISH][OK] launcher payload staged and pushed without rebuild'
        }
        } finally {
          foreach($name in @('GIT_TERMINAL_PROMPT','GIT_CONFIG_COUNT','GIT_CONFIG_KEY_0','GIT_CONFIG_VALUE_0','GIT_CONFIG_KEY_1','GIT_CONFIG_VALUE_1','GIT_INDEX_FILE')){Remove-Item "Env:$name" -ErrorAction SilentlyContinue}
        }
    - name: Seal executable lane
      if: ${{ inputs.direct_publish == false && steps.build.outputs.superseded != 'true' }}
      id: shard
      shell: pwsh
      env:
        KYRON_HANDOFF_SECRET: ${{ secrets[vars.MIX_KEY_NAME] }}
      run: |-
        $ErrorActionPreference='Stop'
        $workspaceSha=(& $env:KYRON_GIT -C source rev-parse HEAD).Trim().ToLowerInvariant();$pantrySha=(& $env:KYRON_GIT -C source/Distribution rev-parse HEAD).Trim().ToLowerInvariant();$out=Join-Path $env:RUNNER_TEMP 'workspace-exe-handoff';$root=Join-Path $PWD.Path 'source'
        if(Test-Path -LiteralPath $out){Remove-Item -LiteralPath $out -Recurse -Force}
        $bridge=Join-Path $root 'Launcher\lib\KyronLauncherRuntime\Release\net8.0-windows10.0.19041.0\native\GameLoopNativeBridge.exe'
        if(!(Test-Path -LiteralPath $bridge -PathType Leaf)){throw 'GameLoop native bridge is missing from the managed runtime handoff'}
        $signature=Get-AuthenticodeSignature -LiteralPath $bridge
        if($signature.Status-ne[Management.Automation.SignatureStatus]::Valid-or!$signature.SignerCertificate){throw "GameLoop native bridge signature rejected: $($signature.Status)"}
        $meta=Get-Content -LiteralPath (Join-Path $root 'etc\security\signing\canonical-signer.json') -Raw|ConvertFrom-Json
        $sha=[Security.Cryptography.SHA256]::Create();try{$bridgeSigner=(([BitConverter]::ToString($sha.ComputeHash($signature.SignerCertificate.RawData))) -replace '-','').ToLowerInvariant()}finally{$sha.Dispose()}
        if($bridgeSigner-ne([string]$meta.certificate_sha256).ToLowerInvariant()){throw 'GameLoop native bridge signer fingerprint mismatch'}
        Write-Host '[PROJECT/WORKSPACE/EXE][GAMELOOP/OK] packaged bridge signature is canonical'
        $paths=@('Launcher\lib\x64\Release\local-machine-v1','Launcher\lib\KyronLauncherRuntime\Release\net8.0-windows10.0.19041.0');foreach($p in @('Launcher\obj\Tools','Launcher\obj\Launcher\x64\Release\llvm\tools')){if(Test-Path -LiteralPath (Join-Path $root $p)){$paths+=$p}}
        if($paths.Count-lt5){throw 'Launcher staging output is incomplete in executable lane'}
        & (Join-Path $PWD.Path 'recipe\.github\workflows\workspace-handoff.ps1') -Mode pack -Lane exe -PantryRoot (Join-Path $PWD.Path 'source/Distribution') -WorkspaceSha $workspaceSha -PantrySha $pantrySha -Secret $env:KYRON_HANDOFF_SECRET -SourceRoot $root -Paths $paths -OutputRoot $out -Python $env:KYRON_PYTHON
        if(!$?){throw 'Executable lane handoff sealing failed'}
    - name: Upload encrypted executable lane
      if: ${{ inputs.direct_publish == false && steps.build.outputs.superseded != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: kyron-workspace-exe-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.shard.outputs.root }}
        if-no-files-found: error
        retention-days: 1
        compression-level: 0
        overwrite: true
    - name: Remove ephemeral signer files
      if: ${{ always() }}
      shell: pwsh
      run: |
        $pfx=$env:KYRON_CODESIGN_PFX
        if(![string]::IsNullOrWhiteSpace($pfx)-and(Test-Path -LiteralPath $pfx -PathType Leaf)){
          $len=(Get-Item -LiteralPath $pfx).Length
          if($len-gt0){[IO.File]::WriteAllBytes($pfx,(New-Object byte[] $len))}
          Remove-Item -LiteralPath $pfx -Force
        }
        if(Test-Path '.\source\etc\build\workspace-common.ps1'){
          . .\source\etc\build\workspace-common.ps1
          $root=Join-Path (Get-WorkspaceDataRoot) 'SigningKeys\PantryLocal\v1'
          if(Test-Path -LiteralPath $root){Remove-Item -LiteralPath $root -Recurse -Force}
        }
    if: ${{ github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' }}
