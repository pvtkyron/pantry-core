name: Kura Release Hub

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pantry-kura-publish.yml
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Force Windows and Android rebuilds even when caches are valid
        required: false
        default: false
        type: boolean
      compiler_only:
        description: Build and verify Compiler APKs without publishing Kura
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [pantry-kura-publish, workspace-kura-publish]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: kura-release-hub-main
  cancel-in-progress: false

jobs:
  gate:
    name: Resolve private source state
    runs-on: ubuntu-24.04
    outputs:
      needs_publish: ${{ steps.state.outputs.needs_publish }}
      workspace_sha: ${{ steps.state.outputs.workspace_sha }}
      pantry_sha: ${{ steps.state.outputs.pantry_sha }}
    steps:
      - name: Checkout Pantry Core
        uses: actions/checkout@v6
        with:
          ref: main
          path: core
          fetch-depth: 0

      - name: Require private checkout credentials
        shell: bash
        env:
          KYRON_WORKSPACE_RO: ${{ secrets.KYRON_WORKSPACE_RO }}
          KYRON_PANTRY_RW: ${{ secrets.KYRON_PANTRY_RW }}
        run: |
          set -euo pipefail
          for name in KYRON_WORKSPACE_RO KYRON_PANTRY_RW; do
            [[ -n "${!name:-}" ]] || { echo "::error::required Actions secret is missing: $name"; exit 5; }
          done

      - name: Checkout private Workspace
        uses: actions/checkout@v6
        with:
          repository: pvtkyron/Workspace
          ref: main
          token: ${{ secrets.KYRON_WORKSPACE_RO }}
          path: workspace
          fetch-depth: 0
          lfs: true
          persist-credentials: true
          show-progress: false

      - name: Checkout private Pantry
        uses: actions/checkout@v6
        with:
          repository: pvtkyron/pantry
          ref: main
          token: ${{ secrets.KYRON_PANTRY_RW }}
          path: pantry
          fetch-depth: 0
          lfs: true
          persist-credentials: true
          show-progress: false

      - name: Enforce ownership and publication state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          for root in auth client lib security src tools; do
            test -e "pantry/$root" || { echo "::error::protected Pantry source root missing: $root"; exit 2; }
          done
          test ! -e pantry/kura || { echo '::error::public Kura output must never live in private Pantry source'; exit 3; }
          if test -d pantry/.github/workflows && find pantry/.github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print -quit | grep -q .; then
            echo '::error::private Pantry must not own Actions workflows'
            exit 4
          fi
          for repo in workspace pantry core; do
            test -z "$(git -C "$repo" status --porcelain --untracked-files=normal)" || { echo "::error::$repo checkout is dirty"; exit 6; }
          done

          workspace_sha="$(git -C workspace rev-parse HEAD)"
          pantry_sha="$(git -C pantry rev-parse HEAD)"
          core_sha="$(git -C core rev-parse HEAD)"
          core_kura="$(git -C core rev-parse HEAD:kura 2>/dev/null || true)"
          provenance_workspace="$(python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('pantry/release/delivery-provenance-v1.json')
          try:v=json.loads(p.read_text(encoding='utf-8-sig')) if p.is_file() else {}
          except Exception:v={}
          print(str(v.get('workspace_sha','')).strip().lower())
          PY
          )"

          tag_target=''; tag_source=''; tag_core=''; tag_kura=''
          if git -C pantry fetch --force origin refs/tags/kyron-kura-published:refs/tags/kyron-kura-published >/dev/null 2>&1; then
            tag_target="$(git -C pantry rev-list -n1 refs/tags/kyron-kura-published 2>/dev/null || true)"
            tag_message="$(git -C pantry tag -l kyron-kura-published --format='%(contents)' 2>/dev/null || true)"
            tag_source="$(sed -n 's/^source=//p' <<<"$tag_message" | tail -n1)"
            tag_core="$(sed -n 's/^core=//p' <<<"$tag_message" | tail -n1)"
            tag_kura="$(sed -n 's/^kura_tree=//p' <<<"$tag_message" | tail -n1)"
          fi

          needs=true
          if [[ "$provenance_workspace" == "$workspace_sha" && "$tag_target" == "$pantry_sha" && "$tag_source" == "$pantry_sha" && -n "$core_kura" && "$tag_kura" == "$core_kura" ]]; then
            needs=false
          fi
          echo "needs_publish=$needs" >> "$GITHUB_OUTPUT"
          echo "workspace_sha=$workspace_sha" >> "$GITHUB_OUTPUT"
          echo "pantry_sha=$pantry_sha" >> "$GITHUB_OUTPUT"
          echo "[KURA][GATE] needs=$needs workspace=$workspace_sha pantry=$pantry_sha core=$core_sha kura=${core_kura:-missing} tag_core=${tag_core:-missing}"

  compiler:
    name: Build + verify private Compiler APKs
    needs: gate
    if: ${{ needs.gate.outputs.needs_publish == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    runs-on: ${{ fromJSON(vars.KYRON_WINDOWS_RUNNER_JSON || '["windows-2025"]') }}
    timeout-minutes: 120
    env:
      KYRON_VS_BUILD: '1'
      KYRON_NONINTERACTIVE: '1'
      ComSpec: C:\Windows\System32\cmd.exe
    outputs:
      workspace_sha: ${{ steps.verify.outputs.workspace_sha }}
      loader32_sha: ${{ steps.verify.outputs.loader32_sha }}
      loader64_sha: ${{ steps.verify.outputs.loader64_sha }}
    steps:
      - name: Checkout exact private Workspace revision
        uses: actions/checkout@v6
        with:
          repository: pvtkyron/Workspace
          ref: ${{ needs.gate.outputs.workspace_sha }}
          token: ${{ secrets.KYRON_WORKSPACE_RO }}
          path: workspace
          fetch-depth: 0
          lfs: true
          persist-credentials: false
          show-progress: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Provision Compiler Android SDK and Smali
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sdk=if($env:ANDROID_SDK_ROOT){$env:ANDROID_SDK_ROOT}elseif($env:ANDROID_HOME){$env:ANDROID_HOME}else{''}
          if([string]::IsNullOrWhiteSpace($sdk)){throw 'GitHub Windows runner did not expose an Android SDK root'}
          $sdk=[IO.Path]::GetFullPath($sdk)
          $manager=Get-ChildItem -LiteralPath (Join-Path $sdk 'cmdline-tools') -Filter sdkmanager.bat -File -Recurse -ErrorAction SilentlyContinue|Select-Object -First 1
          if(!$manager){throw "sdkmanager.bat not found under $sdk"}
          $savedPreference=$ErrorActionPreference;$ErrorActionPreference='Continue'
          & $manager.FullName "--sdk_root=$sdk" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          $sdkCode=$LASTEXITCODE;$ErrorActionPreference=$savedPreference
          if($sdkCode-ne0){throw "Android SDK package provisioning failed: $sdkCode"}
          foreach($relative in 'platforms\android-36\android.jar','build-tools\36.0.0\aapt2.exe','build-tools\36.0.0\zipalign.exe','build-tools\36.0.0\lib\apksigner.jar'){
            $required=Join-Path $sdk $relative
            if(!(Test-Path -LiteralPath $required -PathType Leaf)){throw "Compiler Android dependency missing after provisioning: $required"}
          }
          $smali=Join-Path $env:RUNNER_TEMP 'smali-3.0.9-fat-release.jar'
          $uri='https://github.com/baksmali/smali/releases/download/3.0.9/smali-3.0.9-fat-release.jar'
          & curl.exe -L --fail --retry 4 --retry-delay 2 --output $smali $uri
          if($LASTEXITCODE-ne0-or!(Test-Path -LiteralPath $smali -PathType Leaf)){throw 'Smali 3.0.9 download failed'}
          $expected='b5e2aa019c49ddaf7b2cace80f60ebbfd61f7ac18e7a3dea1075bec8779cc37a'
          $actual=(Get-FileHash -LiteralPath $smali -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual-ne$expected){throw "Smali checksum mismatch: expected=$expected actual=$actual"}
          "KYRON_COMPILER_ANDROID_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KYRON_SMALI_JAR=$smali" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "[COMPILER][TOOLCHAIN/OK] sdk=$sdk smali_sha256=$actual java=$env:JAVA_HOME"

      - name: Validate Compiler source and signing contracts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\workspace\Compiler\tools\validate-signing-contract.ps1
          if(!$?){throw 'Compiler signing contract validation failed'}
          & .\workspace\Compiler\tools\test-signing-identity.ps1
          if(!$?){throw 'Compiler signing identity regression test failed'}
          & .\workspace\Compiler\KYRON.ps1 Validate -AndroidSdk $env:KYRON_COMPILER_ANDROID_SDK -SmaliJar $env:KYRON_SMALI_JAR
          if(!$?){throw 'Compiler project validation failed'}

      - name: Build fresh unsigned 32-bit and 64-bit Compiler APKs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'workspace\Compiler'
          $sdk=$env:KYRON_COMPILER_ANDROID_SDK
          $smali=$env:KYRON_SMALI_JAR
          foreach($value in @($root,$sdk,$smali)){if([string]::IsNullOrWhiteSpace($value)){throw 'Compiler build dependency resolution failed'}}
          $env:KYRON_ANDROID_SDK=$sdk;$env:ANDROID_SDK_ROOT=$sdk;$env:ANDROID_HOME=$sdk;$env:KYRON_SMALI_JAR=$smali
          & (Join-Path $root 'tools\clean-project.ps1')
          if(!$?){throw 'Compiler clean failed'}
          & (Join-Path $root 'tools\preflight.ps1') -AndroidSdk $sdk -SmaliJar $smali
          if(!$?){throw 'Compiler preflight failed'}
          & (Join-Path $root 'tools\build-all.ps1') -NoSign
          if(!$?){throw 'Compiler dual-ABI unsigned build failed'}
          $apk=Join-Path $root 'apk'
          Move-Item -LiteralPath (Join-Path $apk 'Kyron-32.apk') -Destination (Join-Path $apk 'loader-32.apk') -Force
          Move-Item -LiteralPath (Join-Path $apk 'Kyron-64.apk') -Destination (Join-Path $apk 'loader.apk') -Force

      - name: Verify Compiler APK structure and ABI isolation
        id: verify
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $workspace=(git -C workspace rev-parse HEAD).Trim().ToLowerInvariant()
          if($workspace-ne'${{ needs.gate.outputs.workspace_sha }}'){throw "Compiler Workspace drifted: expected=${{ needs.gate.outputs.workspace_sha }} actual=$workspace"}
          $specs=@(
            [pscustomobject]@{Name='loader-32.apk';Abi='armeabi-v7a';Forbidden='arm64-v8a';ElfClass=1;Machine=40;Output='loader32_sha'},
            [pscustomobject]@{Name='loader.apk';Abi='arm64-v8a';Forbidden='armeabi-v7a';ElfClass=2;Machine=183;Output='loader64_sha'}
          )
          foreach($spec in $specs){
            $path=Join-Path $env:GITHUB_WORKSPACE "workspace\Compiler\apk\$($spec.Name)"
            if(!(Test-Path -LiteralPath $path -PathType Leaf)){throw "Compiler APK missing: $path"}
            $item=Get-Item -LiteralPath $path
            if($item.Length-lt4096){throw "Compiler APK is unexpectedly small: $($spec.Name) bytes=$($item.Length)"}
            $head=[IO.File]::ReadAllBytes($path);if($head.Length-lt4-or$head[0]-ne0x50-or$head[1]-ne0x4b){throw "Compiler output is not an APK/ZIP: $($spec.Name)"}
            $zip=[IO.Compression.ZipFile]::OpenRead($path)
            try{
              $entries=@($zip.Entries|ForEach-Object FullName)
              foreach($required in 'AndroidManifest.xml','classes.dex','resources.arsc',"lib/$($spec.Abi)/libkyron.so"){if($required-notin$entries){throw "$($spec.Name) missing $required"}}
              if("lib/$($spec.Forbidden)/libkyron.so"-in$entries){throw "$($spec.Name) contains forbidden opposite-ABI native library"}
              $native=$zip.GetEntry("lib/$($spec.Abi)/libkyron.so");$stream=$native.Open();$elf=New-Object byte[] 20
              try{$read=$stream.Read($elf,0,$elf.Length)}finally{$stream.Dispose()}
              if($read-lt20-or$elf[0]-ne0x7f-or$elf[1]-ne0x45-or$elf[2]-ne0x4c-or$elf[3]-ne0x46){throw "$($spec.Name) native payload is not ELF"}
              $machine=[BitConverter]::ToUInt16($elf,18)
              if($elf[4]-ne$spec.ElfClass-or$machine-ne$spec.Machine){throw "$($spec.Name) native ABI mismatch: class=$($elf[4]) machine=$machine"}
            }finally{$zip.Dispose()}
            $java=Join-Path $env:JAVA_HOME 'bin\java.exe';$signer=Join-Path $env:KYRON_COMPILER_ANDROID_SDK 'build-tools\36.0.0\lib\apksigner.jar'
            $savedPreference=$ErrorActionPreference;$ErrorActionPreference='Continue'
            $signatureText=((& $java -jar $signer verify $path 2>&1|Out-String).Trim());$signatureCode=$LASTEXITCODE
            $ErrorActionPreference=$savedPreference
            if($signatureCode-eq0){throw "$($spec.Name) was unexpectedly signed in CI"}
            if($signatureText-notmatch'(?i)DOES NOT VERIFY|not signed|no signatures'){throw "APK signature verifier failed unexpectedly for $($spec.Name): $signatureText"}
            Write-Host "[COMPILER][UNSIGNED/OK] $($spec.Name)"
            $sha=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$($spec.Output)=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "- $($spec.Name): ``$($spec.Abi)`` · $($item.Length) bytes · ``$sha``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            Write-Host "[COMPILER][APK/OK] file=$($spec.Name) abi=$($spec.Abi) bytes=$($item.Length) sha256=$sha"
          }
          "workspace_sha=$workspace" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $dirty=((git -C workspace status --porcelain --untracked-files=normal)-join"`n").Trim()
          if($dirty){throw "Compiler build mutated tracked Workspace state:`n$dirty"}

  build-and-publish:
    name: Build Workspace + Pantry into Core Kura
    needs: [gate, compiler]
    if: ${{ (needs.gate.outputs.needs_publish == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_rebuild)) && !(github.event_name == 'workflow_dispatch' && inputs.compiler_only) }}
    permissions:
      contents: write
    runs-on: ${{ fromJSON(vars.KYRON_WINDOWS_RUNNER_JSON || '["windows-2025"]') }}
    timeout-minutes: 360
    env:
      KYRON_PANTRY_ROOT: ${{ github.workspace }}\pantry
      KYRON_PANTRY_CORE_ROOT: ${{ github.workspace }}\core
      KYRON_VS_BUILD: '1'
      KYRON_NONINTERACTIVE: '1'
      KYRON_CODESIGN_AUTOCREATE: '0'
    steps:
      - name: Checkout Pantry Core
        uses: actions/checkout@v6
        with:
          ref: main
          path: core
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout private Workspace
        uses: actions/checkout@v6
        with:
          repository: pvtkyron/Workspace
          ref: ${{ needs.gate.outputs.workspace_sha }}
          token: ${{ secrets.KYRON_WORKSPACE_RO }}
          path: workspace
          fetch-depth: 0
          lfs: true
          persist-credentials: true
          show-progress: false

      - name: Checkout private Pantry
        uses: actions/checkout@v6
        with:
          repository: pvtkyron/pantry
          ref: main
          token: ${{ secrets.KYRON_PANTRY_RW }}
          path: pantry
          fetch-depth: 0
          lfs: true
          persist-credentials: true
          show-progress: false

      - name: Bind publication to verified Compiler revision
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $actual=(git -C workspace rev-parse HEAD).Trim().ToLowerInvariant()
          $gate='${{ needs.gate.outputs.workspace_sha }}'
          $compiler='${{ needs.compiler.outputs.workspace_sha }}'
          if($actual-ne$gate-or$compiler-ne$gate){throw "Workspace/Compiler proof drift: checkout=$actual gate=$gate compiler=$compiler"}
          Write-Host "[COMPILER][BOUND] workspace=$actual loader32=${{ needs.compiler.outputs.loader32_sha }} loader64=${{ needs.compiler.outputs.loader64_sha }}"

      - name: Materialize protected release signer
        shell: pwsh
        env:
          KYRON_BOOTSTRAP_ROOT_PRIVATE_PEM: ${{ secrets.KYRON_BOOTSTRAP_ROOT_PRIVATE_PEM }}
          KYRON_CONTENT_PRIVATE_PEM: ${{ secrets.KYRON_CONTENT_PRIVATE_PEM }}
          KYRON_CODESIGN_PFX_B64: ${{ secrets.KYRON_CODESIGN_PFX_B64 }}
          KYRON_CODESIGN_PASSWORD: ${{ secrets.KYRON_CODESIGN_PASSWORD }}
        run: |
          $ErrorActionPreference='Stop'
          foreach($name in 'KYRON_BOOTSTRAP_ROOT_PRIVATE_PEM','KYRON_CONTENT_PRIVATE_PEM','KYRON_CODESIGN_PFX_B64','KYRON_CODESIGN_PASSWORD'){
            if([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))){throw "required release secret is missing: $name"}
          }
          $pfx=Join-Path $env:RUNNER_TEMP 'kyron-codesign.pfx'
          [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:KYRON_CODESIGN_PFX_B64.Trim()))
          if((Get-Item -LiteralPath $pfx).Length -lt 256){throw 'decoded code-signing PFX is unexpectedly small'}
          $flags=[Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $cert=[Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx,$env:KYRON_CODESIGN_PASSWORD,$flags)
          try{
            if(!$cert.HasPrivateKey){throw 'release PFX does not contain a private key'}
            $eku=$false
            foreach($ext in $cert.Extensions){
              if($ext -is [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]){
                foreach($oid in $ext.EnhancedKeyUsages){if($oid.Value -eq '1.3.6.1.5.5.7.3.3'){$eku=$true}}
              }
            }
            if(!$eku){throw 'release PFX is not a Code Signing certificate'}
            if($cert.Subject -eq $cert.Issuer){
              $cer=Join-Path $env:RUNNER_TEMP 'kyron-codesign.cer'
              [IO.File]::WriteAllBytes($cer,$cert.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))
              Import-Certificate -FilePath $cer -CertStoreLocation Cert:\CurrentUser\Root | Out-Null
              Import-Certificate -FilePath $cer -CertStoreLocation Cert:\CurrentUser\TrustedPublisher | Out-Null
              "KYRON_CODESIGN_TEMP_TRUST=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              Remove-Item -LiteralPath $cer -Force
            }
          }finally{$cert.Dispose()}
          "KYRON_CODESIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host '[KURA][SIGNER/READY] protected code-signing identity materialized for this job only'

      - name: Run canonical local-and-hosted release entrypoint
        shell: pwsh
        env:
          KYRON_BOOTSTRAP_ROOT_PRIVATE_PEM: ${{ secrets.KYRON_BOOTSTRAP_ROOT_PRIVATE_PEM }}
          KYRON_CONTENT_PRIVATE_PEM: ${{ secrets.KYRON_CONTENT_PRIVATE_PEM }}
          KYRON_CODESIGN_PASSWORD: ${{ secrets.KYRON_CODESIGN_PASSWORD }}
        run: |
          $ErrorActionPreference='Stop'
          $batch=Join-Path $env:GITHUB_WORKSPACE 'workspace\BUILD_AND_PUBLISH_PANTRY_CORE.bat'
          $args=@(
            '-PantryPath',(Join-Path $env:GITHUB_WORKSPACE 'pantry'),
            '-PantryCorePath',(Join-Path $env:GITHUB_WORKSPACE 'core'),
            '-RunId','${{ github.run_id }}',
            '-RunAttempt','${{ github.run_attempt }}'
          )
          if('${{ inputs.force_rebuild }}' -eq 'true'){$args+='-ForceRebuild'}
          & $batch @args
          if($LASTEXITCODE-ne0){throw "canonical Kura release transaction failed: $LASTEXITCODE"}

      - name: Verify remote Kura and private publication receipt
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git -C core fetch --prune origin main
          if($LASTEXITCODE-ne0){throw 'Pantry Core fetch failed after publication'}
          $core=(git -C core rev-parse refs/remotes/origin/main).Trim()
          $kura=(git -C core rev-parse refs/remotes/origin/main:kura).Trim()
          $paths=@(git -C core ls-tree -r --name-only refs/remotes/origin/main -- kura)
          if(!$paths.Count){throw 'published Kura tree is empty'}
          $bad=@($paths|Where-Object{$_ -notmatch '^kura/[0-9a-f]{2}/[0-9a-f]{2}/[0-9a-f]{28}\.bin$'})
          if($bad.Count){throw "non-opaque path escaped Kura publication: $($bad[0])"}

          git -C pantry fetch --prune origin main
          if($LASTEXITCODE-ne0){throw 'private Pantry main fetch failed'}
          git -C pantry fetch --force origin refs/tags/kyron-kura-published:refs/tags/kyron-kura-published
          if($LASTEXITCODE-ne0){throw 'private publication tag fetch failed'}
          $pantry=(git -C pantry rev-parse refs/remotes/origin/main).Trim()
          $target=(git -C pantry rev-list -n1 refs/tags/kyron-kura-published).Trim()
          $message=(git -C pantry tag -l kyron-kura-published --format='%(contents)') -join "`n"
          $tagSource=([regex]::Match($message,'(?m)^source=([0-9a-f]{40})$')).Groups[1].Value
          $tagCore=([regex]::Match($message,'(?m)^core=([0-9a-f]{40})$')).Groups[1].Value
          $tagKura=([regex]::Match($message,'(?m)^kura_tree=([0-9a-f]{40})$')).Groups[1].Value
          if($target-ne$pantry-or$tagSource-ne$pantry-or$tagCore-ne$core-or$tagKura-ne$kura){throw "publication tag mismatch pantry=$pantry target=$target core=$core tagCore=$tagCore kura=$kura tagKura=$tagKura"}
          Write-Host "[KURA][REMOTE/OK] pantry=$pantry core=$core kura=$kura records=$($paths.Count)"

      - name: Erase transient signing material
        if: ${{ always() }}
        shell: pwsh
        run: |
          $pfx=$env:KYRON_CODESIGN_PFX
          if($pfx -and (Test-Path -LiteralPath $pfx -PathType Leaf)){
            try{$length=(Get-Item -LiteralPath $pfx).Length;[IO.File]::WriteAllBytes($pfx,(New-Object byte[] $length))}catch{}
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
          $thumb=($env:KYRON_CODESIGN_TEMP_TRUST -replace '[^0-9A-Fa-f]','')
          if($thumb){
            foreach($store in 'Cert:\CurrentUser\Root','Cert:\CurrentUser\TrustedPublisher'){
              Get-ChildItem $store -ErrorAction SilentlyContinue | Where-Object Thumbprint -eq $thumb | Remove-Item -Force -ErrorAction SilentlyContinue
            }
          }
