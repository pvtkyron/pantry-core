name: Kura Release Hub

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Force Windows and Android rebuilds even when caches are valid
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [pantry-kura-publish, workspace-kura-publish]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: kura-release-hub-main
  cancel-in-progress: false

jobs:
  gate:
    name: Resolve private source state
    runs-on: ubuntu-24.04
    outputs:
      needs_publish: ${{ steps.state.outputs.needs_publish }}
      workspace_sha: ${{ steps.state.outputs.workspace_sha }}
      pantry_sha: ${{ steps.state.outputs.pantry_sha }}
    steps:
      - name: Checkout Pantry Core
        uses: actions/checkout@v6
        with:
          ref: main
          path: core
          fetch-depth: 0

      - name: Checkout private Workspace
        uses: actions/checkout@v6
        with:
          repository: pvtkyron/Workspace
          ref: main
          token: ${{ secrets.KYRON_WORKSPACE_RO }}
          path: workspace
          fetch-depth: 0
          lfs: true
          persist-credentials: true
          show-progress: false

      - name: Checkout private Pantry
        uses: actions/checkout@v6
        with:
          repository: pvtkyron/pantry
          ref: main
          token: ${{ secrets.KYRON_PANTRY_RW }}
          path: pantry
          fetch-depth: 0
          lfs: true
          persist-credentials: true
          show-progress: false

      - name: Enforce ownership and decide whether a build is needed
        id: state
        shell: bash
        run: |
          set -euo pipefail
          for root in auth client lib security src tools; do
            test -e "pantry/$root" || { echo "::error::protected Pantry source root missing: $root"; exit 2; }
          done
          test ! -e pantry/kura || { echo '::error::public Kura output must never live in private Pantry source'; exit 3; }
          if test -d pantry/.github/workflows && find pantry/.github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print -quit | grep -q .; then
            echo '::error::private Pantry must not own Actions workflows'
            exit 4
          fi
          test -z "$(git -C workspace status --porcelain --untracked-files=normal)"
          test -z "$(git -C pantry status --porcelain --untracked-files=normal)"
          test -z "$(git -C core status --porcelain --untracked-files=normal)"
          workspace_sha="$(git -C workspace rev-parse HEAD)"
          pantry_sha="$(git -C pantry rev-parse HEAD)"
          core_sha="$(git -C core rev-parse HEAD)"
          core_kura="$(git -C core rev-parse HEAD:kura 2>/dev/null || true)"
          provenance_workspace="$(python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('pantry/release/delivery-provenance-v1.json')
          try:
              value=json.loads(path.read_text(encoding='utf-8-sig')) if path.is_file() else {}
          except Exception:
              value={}
          print(str(value.get('workspace_sha','')).strip().lower())
          PY
          )"
          tag_target=''; tag_source=''; tag_core=''; tag_kura=''
          if git -C pantry fetch --force origin refs/tags/kyron-kura-published:refs/tags/kyron-kura-published >/dev/null 2>&1; then
            tag_target="$(git -C pantry rev-list -n1 refs/tags/kyron-kura-published 2>/dev/null || true)"
            tag_message="$(git -C pantry tag -l kyron-kura-published --format='%(contents)' 2>/dev/null || true)"
            tag_source="$(sed -n 's/^source=//p' <<<"$tag_message" | tail -n1)"
            tag_core="$(sed -n 's/^core=//p' <<<"$tag_message" | tail -n1)"
            tag_kura="$(sed -n 's/^kura_tree=//p' <<<"$tag_message" | tail -n1)"
          fi
          needs=true
          if [[ "$provenance_workspace" == "$workspace_sha" && "$tag_target" == "$pantry_sha" && "$tag_source" == "$pantry_sha" && -n "$core_kura" && "$tag_kura" == "$core_kura" ]]; then
            needs=false
          fi
          echo "needs_publish=$needs" >> "$GITHUB_OUTPUT"
          echo "workspace_sha=$workspace_sha" >> "$GITHUB_OUTPUT"
          echo "pantry_sha=$pantry_sha" >> "$GITHUB_OUTPUT"
          echo "[KURA][GATE] needs=$needs workspace=$workspace_sha pantry=$pantry_sha core=$core_sha kura=${core_kura:-missing} tag_core=${tag_core:-missing} provenance_workspace=${provenance_workspace:-missing}"

  build-and-publish:
    name: Build Workspace + Pantry and overlay Kura
    needs: gate
    if: ${{ needs.gate.outputs.needs_publish == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_rebuild) }}
    permissions:
      contents: write
    runs-on: ${{ fromJSON(vars.KYRON_WINDOWS_RUNNER_JSON || '["windows-2025"]') }}
    timeout-minutes: 360
    env:
      KYRON_PANTRY_ROOT: ${{ github.workspace }}\pantry
      KYRON_PANTRY_CORE_ROOT: ${{ github.workspace }}\core
      KYRON_VS_BUILD: '1'
      KYRON_NONINTERACTIVE: '1'
      KYRON_CODESIGN_AUTOCREATE: '0'
    steps:
      - name: Checkout Pantry Core
        uses: actions/checkout@v6
        with:
          ref: main
          path: core
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout private Workspace
        uses: actions/checkout@v6
        with:
          repository: pvtkyron/Workspace
          ref: main
          token: ${{ secrets.KYRON_WORKSPACE_RO }}
          path: workspace
          fetch-depth: 0
          lfs: true
          persist-credentials: true
          show-progress: false

      - name: Checkout private Pantry
        uses: actions/checkout@v6
        with:
          repository: pvtkyron/pantry
          ref: main
          token: ${{ secrets.KYRON_PANTRY_RW }}
          path: pantry
          fetch-depth: 0
          lfs: true
          persist-credentials: true
          show-progress: false

      - name: Require protected release credentials
        shell: pwsh
        env:
          KYRON_BOOTSTRAP_ROOT_PRIVATE_PEM: ${{ secrets.KYRON_BOOTSTRAP_ROOT_PRIVATE_PEM }}
          KYRON_CONTENT_PRIVATE_PEM: ${{ secrets.KYRON_CONTENT_PRIVATE_PEM }}
          KYRON_CODESIGN_PFX_B64: ${{ secrets.KYRON_CODESIGN_PFX_B64 }}
          KYRON_CODESIGN_PASSWORD: ${{ secrets.KYRON_CODESIGN_PASSWORD }}
        run: |
          $ErrorActionPreference='Stop'
          foreach($name in 'KYRON_BOOTSTRAP_ROOT_PRIVATE_PEM','KYRON_CONTENT_PRIVATE_PEM','KYRON_CODESIGN_PFX_B64','KYRON_CODESIGN_PASSWORD'){
            if([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))){throw "required release secret is missing: $name"}
          }
          $pfx=Join-Path $env:RUNNER_TEMP 'kyron-codesign.pfx'
          [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:KYRON_CODESIGN_PFX_B64.Trim()))
          if((Get-Item -LiteralPath $pfx).Length -lt 256){throw 'decoded code-signing PFX is unexpectedly small'}
          $flags=[Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $cert=[Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx,$env:KYRON_CODESIGN_PASSWORD,$flags)
          try{
            if(!$cert.HasPrivateKey){throw 'release PFX does not contain a private key'}
            $eku=$false
            foreach($ext in $cert.Extensions){if($ext -is [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]){foreach($oid in $ext.EnhancedKeyUsages){if($oid.Value -eq '1.3.6.1.5.5.7.3.3'){$eku=$true}}}}
            if(!$eku){throw 'release PFX is not a Code Signing certificate'}
            if($cert.Subject -eq $cert.Issuer){
              $cer=Join-Path $env:RUNNER_TEMP 'kyron-codesign.cer'
              [IO.File]::WriteAllBytes($cer,$cert.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))
              Import-Certificate -FilePath $cer -CertStoreLocation Cert:\CurrentUser\Root | Out-Null
              Import-Certificate -FilePath $cer -CertStoreLocation Cert:\CurrentUser\TrustedPublisher | Out-Null
              "KYRON_CODESIGN_TEMP_TRUST=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              Remove-Item -LiteralPath $cer -Force
              Write-Host "[KURA][SIGNER/TRUSTED] self-signed thumbprint=$($cert.Thumbprint) scope=CurrentUser"
            }
          }finally{$cert.Dispose()}
          "KYRON_CODESIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Provision exact locked Workspace toolchains
        shell: cmd
        run: call "${{ github.workspace }}\workspace\SETUP_WORKSPACE.bat"

      - name: Build, stage private Pantry, prepare and publish Kura
        shell: pwsh
        env:
          KYRON_BOOTSTRAP_ROOT_PRIVATE_PEM: ${{ secrets.KYRON_BOOTSTRAP_ROOT_PRIVATE_PEM }}
          KYRON_CONTENT_PRIVATE_PEM: ${{ secrets.KYRON_CONTENT_PRIVATE_PEM }}
          KYRON_CODESIGN_PASSWORD: ${{ secrets.KYRON_CODESIGN_PASSWORD }}
        run: |
          $ErrorActionPreference='Stop'
          $batch=Join-Path $env:GITHUB_WORKSPACE 'workspace\PREPARE_AND_PUBLISH_PANTRY_CORE.bat'
          $args=@('-PantryPath',(Join-Path $env:GITHUB_WORKSPACE 'pantry'),'-PantryCorePath',(Join-Path $env:GITHUB_WORKSPACE 'core'),'-RuntimeChannel','both','-IncludeLauncher','-RunId','${{ github.run_id }}','-RunAttempt','${{ github.run_attempt }}')
          if('${{ inputs.force_rebuild }}' -eq 'true'){$args+='-ForceRebuild'}
          & $batch @args
          if($LASTEXITCODE-ne0){throw "canonical Kura release transaction failed: $LASTEXITCODE"}

      - name: Verify remote Kura ownership and private publication tag
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git -C core fetch --prune origin main
          if($LASTEXITCODE-ne0){throw 'Pantry Core fetch failed after publication'}
          $core=(git -C core rev-parse refs/remotes/origin/main).Trim()
          $kura=(git -C core rev-parse refs/remotes/origin/main:kura).Trim()
          $paths=@(git -C core ls-tree -r --name-only refs/remotes/origin/main -- kura)
          if(!$paths.Count){throw 'published Kura tree is empty'}
          $bad=@($paths|Where-Object{$_ -notmatch '^kura/[0-9a-f]{2}/[0-9a-f]{2}/[0-9a-f]{28}\.bin$'})
          if($bad.Count){throw "non-opaque path escaped Kura publication: $($bad[0])"}
          git -C pantry fetch --prune origin main
          if($LASTEXITCODE-ne0){throw 'private Pantry main fetch failed'}
          git -C pantry fetch --force origin refs/tags/kyron-kura-published:refs/tags/kyron-kura-published
          if($LASTEXITCODE-ne0){throw 'private publication tag fetch failed'}
          $pantry=(git -C pantry rev-parse refs/remotes/origin/main).Trim();$target=(git -C pantry rev-list -n1 refs/tags/kyron-kura-published).Trim();$message=(git -C pantry tag -l kyron-kura-published --format='%(contents)') -join "`n"
          $tagSource=([regex]::Match($message,'(?m)^source=([0-9a-f]{40})$')).Groups[1].Value;$tagCore=([regex]::Match($message,'(?m)^core=([0-9a-f]{40})$')).Groups[1].Value;$tagKura=([regex]::Match($message,'(?m)^kura_tree=([0-9a-f]{40})$')).Groups[1].Value
          if($target-ne$pantry-or$tagSource-ne$pantry-or$tagCore-ne$core-or$tagKura-ne$kura){throw "publication tag mismatch pantry=$pantry target=$target core=$core tagCore=$tagCore kura=$kura tagKura=$tagKura"}
          Write-Host "[KURA][REMOTE/OK] pantry=$pantry core=$core kura=$kura records=$($paths.Count)"

      - name: Erase transient signing material
        if: ${{ always() }}
        shell: pwsh
        run: |
          $pfx=$env:KYRON_CODESIGN_PFX
          if($pfx -and (Test-Path -LiteralPath $pfx -PathType Leaf)){
            try{$length=(Get-Item -LiteralPath $pfx).Length;[IO.File]::WriteAllBytes($pfx,(New-Object byte[] $length))}catch{}
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
          $thumb=($env:KYRON_CODESIGN_TEMP_TRUST -replace '[^0-9A-Fa-f]','')
          if($thumb){
            foreach($store in 'Cert:\CurrentUser\Root','Cert:\CurrentUser\TrustedPublisher'){
              Get-ChildItem $store -ErrorAction SilentlyContinue | Where-Object Thumbprint -eq $thumb | Remove-Item -Force -ErrorAction SilentlyContinue
            }
          }
