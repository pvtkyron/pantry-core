name: Pantry delta to Pantry Core
# One-shot verified Launcher handoff: Workspace 584914b236c29fa26ea5f71c8df8dac5088afaea
# Client lane 29e03eb8e2054961ad55ee85906ef179; full/delta guards remain unchanged.
run-name: Pantry delta ${{ github.event.client_payload.pantry_sha || inputs.pantry_sha || 'main' }}
'on':
  repository_dispatch:
    types:
    - pantry-delta
  workflow_dispatch:
    inputs:
      pantry_sha:
        description: Exact Pantry commit to publish; blank means Pantry main
        required: false
        default: ''
        type: string
permissions:
  contents: write
  actions: write
jobs:
  publish:
    if: ${{ (github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' && (github.event_name != 'push'
      || !contains(github.event.head_commit.message, '[full-release]'))) && (github.event_name != 'repository_dispatch' || (github.event.client_payload.source_router != true && github.event.client_payload.pantry_router != true && github.event.client_payload.pantry_delta != true)) }}
    name: Publish only changed Pantry content
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      full_required: ${{ steps.delta.outputs.full_required }}
      target: ${{ steps.delta.outputs.target }}
    concurrency:
      group: pantry-core-main-publisher
      cancel-in-progress: false
    steps:
    - name: Open route state checkpoint recipe
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        path: recipe
        fetch-depth: 1
        persist-credentials: false
        show-progress: false
        sparse-checkout: .github
        sparse-checkout-cone-mode: false
    - name: Open pinned Workspace and integrated distribution
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ secrets.MIX_REPO }}
        token: ${{ secrets[vars.MIX_KEY_NAME] }}
        ref: ${{ github.event.client_payload.pantry_sha || github.event.client_payload.workspace_sha || inputs.pantry_sha || 'main' }}
        path: source
        fetch-depth: 100
        fetch-tags: false
        persist-credentials: true
        show-progress: false
        sparse-checkout: |
          /Distribution/SrcVersion.ini
          /Distribution/release/pantry-core-route-state.ini
          etc/publishing/prepare_pantry_core_legacy.py
          etc/publishing/verify_prepared_snapshot.py
          etc/publishing/verify_prepared_snapshot_legacy.py
          Bootstrap/jni/security/trust/BootstrapTransportKey.hpp
          Bootstrap/jni/build/BuildSeed.hpp
        sparse-checkout-cone-mode: false
    - name: Resolve and open Pantry delta
      id: delta
      shell: bash
      env:
        GH_TOKEN: ${{ secrets[vars.FILL_KEY_NAME] }}
        REQUESTED_SOURCE_SHA: ${{ github.event.client_payload.pantry_sha || github.event.client_payload.workspace_sha || inputs.pantry_sha }}
        REQUESTED_WORKSPACE_SHA: ${{ github.event.client_payload.workspace_sha }}
      run: |
        set -euo pipefail
        GH_TOKEN="${GH_TOKEN#"${GH_TOKEN%%[!$' \t\r\n']*}"}"
        GH_TOKEN="${GH_TOKEN#$'\ufeff'}"
        GH_TOKEN="${GH_TOKEN#"${GH_TOKEN%%[!$' \t\r\n']*}"}"
        GH_TOKEN="${GH_TOKEN%"${GH_TOKEN##*[!$' \t\r\n']}"}"
        [[ "$GH_TOKEN" =~ ^[!-~]+$ ]] || { echo '::error::Configured GitHub credential format rejected'; exit 1; }
        export GH_TOKEN
        target="$(git -C source/Distribution rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
        [[ "$target" =~ ^[0-9a-f]{40}$ ]]
        [[ -z "${REQUESTED_SOURCE_SHA:-}" || ( "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$REQUESTED_SOURCE_SHA" == "$target" ) ]] || { echo '::error::Exact delta source pin rejected'; exit 1; }
        [[ -z "${REQUESTED_WORKSPACE_SHA:-}" || "$REQUESTED_WORKSPACE_SHA" == "$target" ]] || { echo '::error::Conflicting Workspace and Pantry source pins'; exit 1; }
        echo "target=$target" >> "$GITHUB_OUTPUT"

        published="$(
          gh api "repos/pvtkyron/pantry-core/commits?sha=main&per_page=100" \
            --jq '[.[] | .commit.message | capture("Pantry-Source: (?<sha>[0-9a-f]{40})")? | select(.sha != null) | .sha][0] // ""'
        )"
        if [[ ! "$published" =~ ^[0-9a-f]{40}$ ]]; then
          echo "needs_publish=false" >> "$GITHUB_OUTPUT"
          echo "full_required=true" >> "$GITHUB_OUTPUT"
          echo "::notice::[PANTRY-DELTA][FULL-REQUIRED] no published source baseline; reconcile exact source=$target"
          exit 0
        fi
        if [[ "$published" == "$target" ]]; then
          echo "needs_publish=false" >> "$GITHUB_OUTPUT"
          echo "[PANTRY-DELTA][NOOP] published=$published target=$target"
          exit 0
        fi
        if ! git -C source/Distribution cat-file -e "$published^{commit}" 2>/dev/null; then
          if ! git -C source/Distribution fetch --quiet --no-tags --depth=1 origin "$published"; then
            echo "needs_publish=false" >> "$GITHUB_OUTPUT"
            echo "full_required=true" >> "$GITHUB_OUTPUT"
            echo "::notice::[PANTRY-DELTA][FULL-REQUIRED] published baseline unavailable; reconcile exact source=$target"
            exit 0
          fi
        fi
        if ! git -C source/Distribution merge-base --is-ancestor "$published" "$target"; then
          git -C source/Distribution fetch --quiet --no-tags --deepen=200 origin main || true
        fi
        if ! git -C source/Distribution merge-base --is-ancestor "$published" "$target"; then
          echo "needs_publish=false" >> "$GITHUB_OUTPUT"
          echo "full_required=true" >> "$GITHUB_OUTPUT"
          echo "::notice::[PANTRY-DELTA][FULL-REQUIRED] source history changed; reconcile exact source=$target baseline=$published"
          exit 0
        fi

        state_ready=false
        if git -C source/Distribution cat-file -e "$target:Distribution/release/pantry-core-route-state.ini" 2>/dev/null; then
          state_pin="$(git -C source/Distribution show "$target:Distribution/release/pantry-core-route-state.ini" | sed -n '1s/^; Pantry-Source: //p' | tr -d '\r')"
          if [[ "$state_pin" == "$published" ]]; then state_ready=true; fi
        fi
        if [[ "$state_ready" != true ]]; then
          echo "needs_publish=false" >> "$GITHUB_OUTPUT"
          echo "full_required=true" >> "$GITHUB_OUTPUT"
          echo "::notice::[PANTRY-DELTA][FULL-REQUIRED] missing published route state; reconcile exact source=$target baseline=$published"
          exit 0
        fi

        previous_tree="$(git -C source rev-parse --verify "$published:Distribution" 2>/dev/null || git -C source rev-parse --verify "$published^{tree}")"
        target_tree="$(git -C source rev-parse "$target:Distribution")"
        git -C source diff --name-status -M "$previous_tree" "$target_tree" -- > "$RUNNER_TEMP/pantry-name-status.tsv"
        : > "$RUNNER_TEMP/pantry-changed.list"
        unsafe=false
        needs_lua=false
        while IFS=$'\t' read -r status first second; do
          [[ -n "$first" ]] || continue
          file="$first"; kind="$status"
          if [[ "$status" == R* ]]; then file="$second"; kind="renamed"; fi
          if [[ "$status" == D* ]]; then kind="removed"; fi
          case "$file" in
            release/pantry-core-route-state.ini|release/*|tools/*|tests/*|security/*|README.md|AI_README.md|00_AI_READ_FIRST.md|memory.md|.gitattributes|.gitignore)
              continue
              ;;
            SrcVersion.ini)
              unsafe=true
              echo "[PANTRY-DELTA][FULL-REQUIRED] contract changed: $file"
              continue
              ;;
          esac
          if [[ "$file" =~ ^lib/libkyron(64|i|i64)?-[0-9a-f]{24}\.so$ ]]; then continue; fi
          if [[ ! "$file" =~ ^(auth/|client/|lib/|lua/|assest/|Font/|img/|nativebridge/|dist/|vm/|enrollment/) ]]; then continue; fi
          if [[ "$kind" == "removed" || "$kind" == "renamed" ]]; then
            unsafe=true
            echo "[PANTRY-DELTA][FULL-REQUIRED] status=$kind path=$file"
            continue
          fi
          printf '%s\n' "$file" >> "$RUNNER_TEMP/pantry-changed.list"
          if [[ "$file" == auth/subscription.json || "$file" == lua/* ]]; then needs_lua=true; fi
        done < "$RUNNER_TEMP/pantry-name-status.tsv"

        sort -u -o "$RUNNER_TEMP/pantry-changed.list" "$RUNNER_TEMP/pantry-changed.list"
        changed_count="$(grep -c . "$RUNNER_TEMP/pantry-changed.list" || true)"
        if [[ "$unsafe" == true ]]; then
          echo "needs_publish=false" >> "$GITHUB_OUTPUT"
          echo "full_required=true" >> "$GITHUB_OUTPUT"
          echo "::notice::[PANTRY-DELTA][FULL-REQUIRED] structural changes; reconcile exact source=$target"
          exit 0
        fi
        if [[ "$changed_count" -eq 0 ]]; then
          echo "needs_publish=false" >> "$GITHUB_OUTPUT"
          echo "[PANTRY-DELTA][NOOP] only control/source-tool changes from=$published to=$target"
          exit 0
        fi

        sparse="$RUNNER_TEMP/pantry-sparse.list"
        cat > "$sparse" <<'EOF'
        /SrcVersion.ini
        /release/pantry-core-route-state.ini
        /tools/
        /tests/test_packet_codec.py
        /tests/test_device_membership.py
        /enrollment/
        /tests/test_consumer_contract.py
        /tests/test_signer_cutover.py
        /tests/test_lua_precompile.py
        /tests/test_delta_publication_runtime.py
        /security/keys/content_public.pem
        /security/keys/content_public.previous-local-machine-v1.pem
        /client/Launcher.exe
        /client/Launcher.build.json
        /client/KyronCoreService.exe
        /dist/InputHost.dex
        /lib/libkyron.so
        /lib/libkyron64.so
        /lib/libkyroni.so
        /lib/libkyroni64.so
        EOF
        while IFS= read -r path; do printf '/%s\n' "$path" >> "$sparse"; done < "$RUNNER_TEMP/pantry-changed.list"
        if [[ "$needs_lua" == true ]]; then printf '/lua/\n/auth/subscription.json\n' >> "$sparse"; fi
        sort -u -o "$sparse" "$sparse"
        # Sparse patterns are relative to the single Workspace Git root.
        sed 's|^/|/Distribution/|' "$sparse" > "$sparse.workspace"
        printf '/.github/actions/pantry-route-state/\n/etc/publishing/prepare_pantry_core_legacy.py\n/etc/publishing/verify_prepared_snapshot.py\n/etc/publishing/verify_prepared_snapshot_legacy.py\n/etc/security/signing/\n/Bootstrap/jni/security/trust/BootstrapTransportKey.hpp\n/Bootstrap/jni/build/BuildSeed.hpp\n' >> "$sparse.workspace"
        cp "$sparse.workspace" source/.git/info/sparse-checkout
        git -C source/Distribution read-tree -mu HEAD

        echo "needs_publish=true" >> "$GITHUB_OUTPUT"
        echo "published=$published" >> "$GITHUB_OUTPUT"
        echo "state_ready=$state_ready" >> "$GITHUB_OUTPUT"
        core_index="$(awk '
          /^\[runtime\.contract\]$/ {in_runtime=1; next}
          /^\[/ {in_runtime=0}
          in_runtime && /^index_record=/ {sub(/^index_record=/,""); print; exit}
        ' source/Distribution/SrcVersion.ini | tr -d '\r')"
        [[ "$core_index" =~ ^kyron/[0-9a-f]{2}/[0-9a-f]{2}/[0-9a-f]{28}\.bin$ ]] || { echo "::error::Invalid Pantry Core index route: $core_index"; exit 1; }

        echo "needs_lua=$needs_lua" >> "$GITHUB_OUTPUT"
        echo "core_index=$core_index" >> "$GITHUB_OUTPUT"
        echo "[PANTRY-DELTA][READY] from=$published to=$target changed=$changed_count state=$state_ready lua=$needs_lua patterns=$(wc -l < "$sparse") core_index=$core_index"
    - name: Open Pantry Core publish target
      if: ${{ steps.delta.outputs.needs_publish == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ secrets[vars.FILL_KEY_NAME] }}
      run: |
        set -euo pipefail
        GH_TOKEN="${GH_TOKEN#"${GH_TOKEN%%[!$' \t\r\n']*}"}"
        GH_TOKEN="${GH_TOKEN#$'\ufeff'}"
        GH_TOKEN="${GH_TOKEN#"${GH_TOKEN%%[!$' \t\r\n']*}"}"
        GH_TOKEN="${GH_TOKEN%"${GH_TOKEN##*[!$' \t\r\n']}"}"
        [[ "$GH_TOKEN" =~ ^[!-~]+$ ]] || { echo '::error::Configured GitHub credential format rejected'; exit 1; }
        export GH_TOKEN
        rm -rf shelf
        git init shelf
        git -C shelf remote add origin "https://github.com/pvtkyron/pantry-core.git"
        gh auth setup-git
        git -C shelf fetch --filter=blob:none --no-tags --depth=100 origin main
        git -C shelf sparse-checkout init --no-cone
        printf '/%s\n' "${{ steps.delta.outputs.core_index }}" > shelf/.git/info/sparse-checkout
        git -C shelf checkout -B main FETCH_HEAD
        git -C shelf config gc.auto 0
        echo "[PANTRY-DELTA][CORE] hydrated=index-only path=${{ steps.delta.outputs.core_index }}"
    - name: Install Python 3.12
      if: ${{ steps.delta.outputs.needs_publish == 'true' }}
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: source/Distribution/tools/requirements-launch.txt
    - name: Install verified Pantry Python dependencies
      if: ${{ steps.delta.outputs.needs_publish == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        requirements="source/Distribution/tools/requirements-launch.txt"
        python -m pip install --disable-pip-version-check --no-input -r "$requirements"
        deps_sha="$(sha256sum "$requirements" | awk '{print $1}')"
        echo "KYRON_PANTRY_DEPENDENCIES_VERIFIED_SHA256=$deps_sha" >> "$GITHUB_ENV"
        python -c 'import cryptography,lz4'
    - name: Install Lua 5.3 only when Lua/auth changed
      if: ${{ steps.delta.outputs.needs_publish == 'true' && steps.delta.outputs.needs_lua == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends lua5.3
        luac5.3 -v 2>&1 | grep -F 'Lua 5.3.6'
    - name: Materialize signer public keys
      if: ${{ steps.delta.outputs.needs_publish == 'true' }}
      id: signer
      shell: bash
      env:
        ROOT_PUBLIC: ${{ secrets.KYRON_PANTRY_LOCAL_BOOTSTRAP_PUBLIC_PEM }}
        CONTENT_PUBLIC: ${{ secrets.KYRON_PANTRY_LOCAL_CONTENT_PUBLIC_PEM }}
      run: |
        set -euo pipefail
        python - <<'PY'
        import os
        from pathlib import Path
        root=Path(os.environ["RUNNER_TEMP"])/"pantry-bootstrap-public.pem"
        content=Path(os.environ["RUNNER_TEMP"])/"pantry-content-public.pem"
        for path,name in ((root,"ROOT_PUBLIC"),(content,"CONTENT_PUBLIC")):
            value=os.environ.get(name,"").strip()
            if "BEGIN PUBLIC KEY" not in value:
                raise SystemExit(f"{name} is missing or invalid")
            path.write_text(value+"\n",encoding="utf-8",newline="\n")
        with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
            print(f"root_public={root}",file=out)
            print(f"content_public={content}",file=out)
        PY
    - name: Reconstruct Bootstrap transport master
      if: ${{ steps.delta.outputs.needs_publish == 'true' }}
      id: master
      shell: bash
      run: |
        set -euo pipefail
        master="$(python source/etc/publishing/prepare_pantry_core_legacy.py --workspace source --print-transport-master | tail -n 1 | tr -d '\r\n')"
        [[ "$master" =~ ^[0-9a-f]{64}$ ]]
        echo "::add-mask::$master"
        echo "master=$master" >> "$GITHUB_OUTPUT"
    - name: Prepare and publish only Pantry delta
      if: ${{ steps.delta.outputs.needs_publish == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ secrets[vars.FILL_KEY_NAME] }}
        KYRON_PANTRY_SIGNER_PROFILE: local-machine-v1
        KYRON_RESOURCE_ROTATION_ENABLED: ${{ vars.KYRON_RESOURCE_ROTATION_ENABLED || '0' }}
        KYRON_RESOURCE_ROUTE_GENERATION: ${{ vars.KYRON_RESOURCE_ROUTE_GENERATION || '' }}
        KYRON_RESOURCE_ROUTE_HMAC_KEY_HEX: ${{ secrets.KYRON_RESOURCE_ROUTE_HMAC_KEY_HEX }}
        KYRON_BOOTSTRAP_ROOT_PRIVATE_PEM: ${{ secrets.KYRON_PANTRY_LOCAL_BOOTSTRAP_PRIVATE_PEM }}
        KYRON_CONTENT_PRIVATE_PEM: ${{ secrets.KYRON_PANTRY_LOCAL_CONTENT_PRIVATE_PEM }}
        KYRON_BOOTSTRAP_ROOT_PUBLIC_PEM: ${{ steps.signer.outputs.root_public }}
        KYRON_CONTENT_PUBLIC_PEM: ${{ steps.signer.outputs.content_public }}
        KYRON_PANTRY_PUBLISHED_SOURCE_SHA: ${{ steps.delta.outputs.published }}
        KYRON_LAUNCH_CAPSULE_MASTER_HEX: ${{ steps.master.outputs.master }}
      run: |
        set -euo pipefail
        GH_TOKEN="${GH_TOKEN#"${GH_TOKEN%%[!$' \t\r\n']*}"}"
        GH_TOKEN="${GH_TOKEN#$'\ufeff'}"
        GH_TOKEN="${GH_TOKEN#"${GH_TOKEN%%[!$' \t\r\n']*}"}"
        GH_TOKEN="${GH_TOKEN%"${GH_TOKEN##*[!$' \t\r\n']}"}"
        [[ "$GH_TOKEN" =~ ^[!-~]+$ ]] || { echo '::error::Configured GitHub credential format rejected'; exit 1; }
        export GH_TOKEN
        python source/Distribution/tools/prepare_snapshot.py \
          --source source/Distribution \
          --cdn shelf \
          --source-sha "${{ steps.delta.outputs.target }}" \
          --run-id "$(date -u +%s%3N)" \
          --run-attempt "$GITHUB_RUN_ATTEMPT" \
          --branch main \
          --changed-list "$RUNNER_TEMP/pantry-changed.list"
    - name: Verify Pantry Core delta publication
      if: ${{ steps.delta.outputs.needs_publish == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        git -C shelf fetch --quiet --force origin main
        remote="$(git -C shelf rev-parse refs/remotes/origin/main)"
        message="$(git -C shelf show -s --format=%B "$remote")"
        grep -Fxq "Pantry-Source: ${{ steps.delta.outputs.target }}" <<<"$message"
        grep -Fxq "History-Mode: root-only" <<<"$message"
        test "$(git -C shelf rev-list --parents -n 1 "$remote" | wc -w | tr -d ' ')" -eq 1
        bad="$(git -C shelf ls-tree -r --name-only "$remote" kyron | grep -Ev '^kyron/[0-9a-f]{2}/[0-9a-f]{2}/[0-9a-f]{28}\.bin$' || true)"
        test -z "$bad"
        echo "[PANTRY-DELTA][PUBLISHED][OK] pantry=${{ steps.delta.outputs.target }} core=$remote"
    - name: Checkpoint private route state
      if: ${{ steps.delta.outputs.needs_publish == 'true' }}
      uses: ./recipe/.github/actions/pantry-route-state
      with:
        source_root: source/Distribution
        source_sha: ${{ steps.delta.outputs.target }}
    - name: Remove temporary signer public keys
      if: ${{ always() }}
      shell: bash
      run: |
        rm -f "$RUNNER_TEMP/pantry-bootstrap-public.pem" "$RUNNER_TEMP/pantry-content-public.pem"
  full:
    name: Request full preparation for exact Pantry source
    needs: publish
    if: ${{ (github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' && (needs.publish.result == 'success'
      && needs.publish.outputs.full_required == 'true')) && (github.event_name != 'repository_dispatch' || (github.event.client_payload.source_router != true && github.event.client_payload.pantry_router != true && github.event.client_payload.pantry_delta != true)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Request authenticated full release preparation
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WORKSPACE_SHA: ${{ needs.publish.outputs.target }}
      run: |
        set -euo pipefail
        [[ "$WORKSPACE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Full preparation requires an exact source revision'; exit 1; }
        jq -n --arg sha "$WORKSPACE_SHA" '{event_type:"workspace-release",client_payload:{workspace_sha:$sha,manual_refresh:true}}' \
          | gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input - >/dev/null
        echo '[PANTRY-DELTA][FULL/DISPATCHED] exact source sent to full preparation; this run did not publish it'
