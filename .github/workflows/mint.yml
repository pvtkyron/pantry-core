name: Mint Drop

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mint-drop
  cancel-in-progress: false

jobs:
  bake:
    name: Bake mint
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Set table
        shell: pwsh
        env:
          MIX: ${{ secrets.MIX_REPO }}
          MIX_KEY: ${{ secrets[vars.MIX_KEY_NAME] }}
          FILL: ${{ secrets.FILL_REPO }}
          FILL_KEY: ${{ secrets[vars.FILL_KEY_NAME] }}
        run: |
          $u="https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/.github/table.ps1"
          $p=Join-Path $env:RUNNER_TEMP 'table.ps1'
          & curl.exe -fsSL --retry 3 $u -o $p
          if($LASTEXITCODE){throw 'counter rejected'}
          & $p
          exit $LASTEXITCODE

      - name: Chill oven
        uses: actions/cache@v4
        with:
          path: '*-sdk/Android/ndk'
          key: oven-android-${{ runner.os }}-${{ hashFiles('mix/toolchains.lock.json') }}

      - name: Chill crumbs
        uses: actions/cache@v4
        with:
          path: mix/*/obj
          key: mint-${{ runner.os }}-${{ hashFiles('mix/toolchains.lock.json') }}-${{ github.run_id }}
          restore-keys: |
            mint-${{ runner.os }}-${{ hashFiles('mix/toolchains.lock.json') }}-

      - name: Bake
        shell: pwsh
        run: |
          & ./mix/Tools/BakeSlice.ps1 -Fill (Join-Path $PWD.Path 'filling') -Slice Mint
          exit $LASTEXITCODE
