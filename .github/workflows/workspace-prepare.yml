name: Workspace prepare lane
'on':
  workflow_call:
    inputs:
      capsule:
        required: true
        type: string
      runtime_channel:
        required: false
        default: both
        type: string
      include_launcher:
        required: false
        default: false
        type: boolean
      java_run_id:
        type: string
        default: ''
      java_attempt:
        type: string
        default: ''
      exe_run_id:
        type: string
        default: ''
      exe_attempt:
        type: string
        default: ''
      minimum_launch_epoch:
        type: string
        required: false
        default: ''
    outputs:
      delivery_pending:
        description: Approved native delivery has not arrived yet
        value: ${{ jobs.prepare.outputs.delivery_pending }}
      superseded:
        description: This source was superseded and must not be published
        value: ${{ jobs.prepare.outputs.superseded }}
      delivery_capsule:
        description: Encrypted private delivery state
        value: ${{ jobs.prepare.outputs.delivery_capsule }}
  workflow_dispatch:
    inputs:
      capsule:
        required: true
        type: string
      runtime_channel:
        required: false
        default: both
        type: string
      include_launcher:
        required: false
        default: false
        type: boolean
      minimum_launch_epoch:
        type: string
        required: false
        default: ''
permissions:
  contents: write
jobs:
  prepare:
    permissions:
      contents: write
      actions: write
    name: Restore lanes + prepare private Pantry
    runs-on: windows-2025
    timeout-minutes: 240
    outputs:
      delivery_pending: ${{ steps.native.outputs.pending }}
      superseded: ${{ steps.promotion.outputs.superseded }}
      delivery_capsule: ${{ steps.advance.outputs.capsule }}
    env:
      KYRON_SERIAL_BUILD: '1'
      KYRON_BUILD_JOBS: '2'
      KYRON_MSBUILD_TIMEOUT_SECONDS: '1200'
      KYRON_SLICE_TIMEOUT_SECONDS: '3600'
      KYRON_HEARTBEAT_SECONDS: '30'
      KYRON_MINIMUM_LAUNCH_EPOCH: ${{ github.event.client_payload.minimum_launch_epoch || '' }}
      ANDROID_HOME: ''
      ANDROID_SDK_ROOT: ''
      ANDROID_NDK_HOME: ''
      ANDROID_NDK_ROOT: ''
      NDK_ROOT: ''
      JAVA_HOME: ''
    steps:
    - name: Enable Git long paths before checkout
      shell: pwsh
      run: '$ErrorActionPreference=''Stop''

        & git config --global core.longpaths true

        if($LASTEXITCODE-ne0){throw ''Git long-path setup failed''}

        '
    - name: Open prepare recipe
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        path: recipe
        fetch-depth: 1
        persist-credentials: false
        show-progress: false
        sparse-checkout-cone-mode: false
        sparse-checkout: .github
    - name: Open private Workspace state
      id: state
      uses: ./recipe/.github/actions/private-capsule
      with:
        mode: open
        key: ${{ secrets[vars.MIX_KEY_NAME] }}
        capsule: ${{ inputs.capsule }}
        project: workspace
    - name: Open pinned Workspace and integrated distribution
      uses: actions/checkout@v6
      with:
        repository: ${{ secrets.MIX_REPO }}
        token: ${{ secrets[vars.MIX_KEY_NAME] }}
        ref: ${{ steps.state.outputs.workspace_ref }}
        path: source
        clean: true
        fetch-depth: 1
        fetch-tags: false
        persist-credentials: true
        show-progress: false
        sparse-checkout: '/*

          '
        sparse-checkout-cone-mode: false
    - name: Bind canonical release branches
      shell: pwsh
      run: "$ErrorActionPreference='Stop'\nforeach($repo in @('source')){& git -C $repo checkout -q -B main HEAD;if($LASTEXITCODE){throw \"release main binding rejected: $repo\"}}\n\
        foreach($path in @('Distribution/SrcVersion.ini','etc/publishing/Update-PantryArtifacts.ps1')){\n  if(!(Test-Path -LiteralPath (Join-Path 'source' $path) -PathType Leaf)){throw\
        \ \"[PREPARE/CHECKOUT] Complete pinned source is missing: $path\"}\n}\nWrite-Host '[PROJECT/WORKSPACE/PREPARE/CHECKOUT][OK] complete pinned source; authenticated materialization'\n\
        if(!(Test-Path -LiteralPath 'recipe/.github/workflows/workspace-handoff.ps1' -PathType Leaf)){throw '[PREPARE/CHECKOUT] Pantry Core handoff recipe is missing'}\n"
    - name: Download Java proof
      uses: actions/download-artifact@v4
      with:
        name: kyron-workspace-java-${{ inputs.java_run_id || github.run_id }}-${{ inputs.java_attempt || github.run_attempt }}
        run-id: ${{ inputs.java_run_id || github.run_id }}
        github-token: ${{ github.token }}
        path: handoff/java
    - name: Download native library lane
      uses: actions/download-artifact@v4
      with:
        name: kyron-workspace-lib-${{ github.run_id }}-${{ github.run_attempt }}
        path: handoff/lib
    - name: Download encrypted executable lane
      if: ${{ inputs.include_launcher }}
      uses: actions/download-artifact@v4
      with:
        name: kyron-workspace-exe-${{ inputs.exe_run_id || github.run_id }}-${{ inputs.exe_attempt || github.run_attempt }}
        run-id: ${{ inputs.exe_run_id || github.run_id }}
        github-token: ${{ github.token }}
        path: handoff/exe
    - name: Verify and restore encrypted lanes
      shell: pwsh
      env:
        KYRON_HANDOFF_SECRET: ${{ secrets[vars.MIX_KEY_NAME] }}
      run: "$ErrorActionPreference='Stop'\n$workspaceSha=(& git -C source rev-parse HEAD).Trim().ToLowerInvariant();$pantrySha=(& git -C source/Distribution rev-parse HEAD).Trim().ToLowerInvariant()\n\
        function Open-Lane([string]$lane,[bool]$restore){\n  $root=Join-Path $PWD.Path (\"handoff\\$lane\");$bins=@(Get-ChildItem -LiteralPath $root -Recurse -File -Filter '*.bin');if($bins.Count-ne1){throw\
        \ \"Encrypted $lane handoff count rejected: $($bins.Count)\"}\n  $stage=Join-Path $env:RUNNER_TEMP (\"workspace-open-$lane\");if(Test-Path $stage){Remove-Item $stage -Recurse\
        \ -Force};New-Item -ItemType Directory -Force $stage|Out-Null\n  & .\\recipe\\.github\\workflows\\workspace-handoff.ps1 -Mode unpack -Lane $lane -PantryRoot (Join-Path $PWD.Path\
        \ 'source/Distribution') -WorkspaceSha $workspaceSha -PantrySha $pantrySha -Secret $env:KYRON_HANDOFF_SECRET -InputPath $bins[0].FullName -OutputRoot $stage\n  if($restore){$src=Join-Path\
        \ $stage 'source';if(!(Test-Path $src -PathType Container)){throw \"$lane handoff payload root missing\"};foreach($f in @(Get-ChildItem -LiteralPath $src -Recurse -File)){$rel=$f.FullName.Substring($src.Length+1);$dst=Join-Path\
        \ (Join-Path $PWD.Path 'source') $rel;New-Item -ItemType Directory -Force (Split-Path $dst -Parent)|Out-Null;Copy-Item -LiteralPath $f.FullName -Destination $dst -Force}}\n}\n\
        Open-Lane 'java' $false;Open-Lane 'lib' $true;if('${{ inputs.include_launcher }}'-eq'true'){Open-Lane 'exe' $true}\nWrite-Host '[PROJECT/WORKSPACE/HANDOFF][OK] encrypted lanes\
        \ verified and restored'\n"
    - name: Materialize canonical Pantry signer
      shell: pwsh
      env:
        CREAM_A: ${{ secrets.KYRON_PANTRY_LOCAL_BOOTSTRAP_PRIVATE_PEM }}
        CREAM_B: ${{ secrets.KYRON_PANTRY_LOCAL_BOOTSTRAP_PUBLIC_PEM }}
        JAM_A: ${{ secrets.KYRON_PANTRY_LOCAL_CONTENT_PRIVATE_PEM }}
        JAM_B: ${{ secrets.KYRON_PANTRY_LOCAL_CONTENT_PUBLIC_PEM }}
      run: '$ErrorActionPreference=''Stop'';foreach($n in @(''CREAM_A'',''CREAM_B'',''JAM_A'',''JAM_B'')){if([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($n))){throw
        "canonical local Pantry signer input missing: $n"}}

        . .\source\etc\build\workspace-common.ps1;$root=Join-Path (Get-WorkspaceDataRoot) ''SigningKeys\PantryLocal\v1'';New-Item -ItemType Directory -Force -Path $root|Out-Null;$utf8=[Text.UTF8Encoding]::new($false)

        foreach($x in @(@(''bootstrap_root_private.pem'',''CREAM_A''),@(''bootstrap_root_public.pem'',''CREAM_B''),@(''content_private.pem'',''JAM_A''),@(''content_public.pem'',''JAM_B''))){[IO.File]::WriteAllText((Join-Path
        $root $x[0]),([Environment]::GetEnvironmentVariable($x[1])).Trim()+"`n",$utf8)}

        & .\source\etc\publishing\Initialize-LocalPantrySigner.ps1 -PantryPath (Join-Path $PWD.Path ''source/Distribution'') -Workspace (Join-Path $PWD.Path ''source'') -ExpectedProfile
        local-machine-v1 -Ephemeral -RequireExistingIdentity|Out-Null;if(!$?){throw ''Canonical local Pantry signer validation failed''}

        '
    - name: Materialize canonical code signer trust
      shell: pwsh
      env:
        KYRON_CODESIGN_PFX_BASE64: ${{ secrets.KYRON_CODESIGN_PFX_B64 }}
        KYRON_CODESIGN_PASSWORD_SECRET: ${{ secrets.KYRON_CODESIGN_PASSWORD }}
      run: '$ErrorActionPreference=''Stop'';if([string]::IsNullOrWhiteSpace($env:KYRON_CODESIGN_PFX_BASE64)-or[string]::IsNullOrWhiteSpace($env:KYRON_CODESIGN_PASSWORD_SECRET)){throw
        ''canonical signing secret unavailable''}

        Write-Host "::add-mask::$($env:KYRON_CODESIGN_PFX_BASE64)";Write-Host "::add-mask::$($env:KYRON_CODESIGN_PASSWORD_SECRET)";$pfx=Join-Path $env:RUNNER_TEMP ''kyron-canonical.pfx'';$raw=[Convert]::FromBase64String($env:KYRON_CODESIGN_PFX_BASE64);[IO.File]::WriteAllBytes($pfx,$raw)

        $meta=Get-Content -LiteralPath ''./source/etc/security/signing/canonical-signer.json'' -Raw|ConvertFrom-Json;$flags=[Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet;$password=$env:KYRON_CODESIGN_PASSWORD_SECRET.TrimEnd([char[]]"`r`n");$cert=[Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx,$password,$flags)

        try{$sha=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($cert.RawData)).ToLowerInvariant();if(!$cert.HasPrivateKey-or$sha-ne([string]$meta.certificate_sha256).ToLowerInvariant()){throw
        ''canonical code signer identity mismatch''};$cer=Join-Path $env:RUNNER_TEMP ''kyron-canonical.cer'';[IO.File]::WriteAllBytes($cer,$cert.RawData);foreach($storeName in @(''Root'',''TrustedPublisher'')){&
        certutil.exe -f -addstore $storeName $cer|Out-Host;if($LASTEXITCODE){throw "canonical signer trust import failed: $storeName"}};& certutil.exe -user -f -addstore My $cer|Out-Host;if($LASTEXITCODE){throw
        ''canonical pinned public signer import into CurrentUser/My failed''}}finally{$cert.Dispose();[Security.Cryptography.CryptographicOperations]::ZeroMemory($raw)}

        '
    - name: Prepare only pinned Python for verified lane promotion
      shell: pwsh
      run: '$ErrorActionPreference=''Stop''

        & .\source\etc\build\setup-python.ps1

        if(!$?){throw ''Pinned promotion Python bootstrap failed''}

        . .\source\etc\build\workspace-common.ps1

        $python=Resolve-WorkspacePython ''''

        if(!$python){throw ''Managed promotion Python is unavailable''}

        Write-Host ''[PROJECT/WORKSPACE/PREPARE/TOOLS][OK] pinned Python only; restored native staging tools remain verified by their owners''

        '
    - name: Verify source pins and restore generated toolchain wrapper
      shell: pwsh
      env:
        WORKSPACE_REF: ${{ steps.state.outputs.workspace_ref }}
        PANTRY_REF: ${{ steps.state.outputs.pantry_ref }}
      run: "$ErrorActionPreference='Stop'\nforeach($row in @(@('source',$env:WORKSPACE_REF),@('source/Distribution',$env:PANTRY_REF))){\n  $actual=(& git -C $row[0] rev-parse HEAD).Trim().ToLowerInvariant()\n\
        \  if($LASTEXITCODE-or$actual-ne$row[1]){throw 'Promotion source pin mismatch'}\n}\n& git -C source diff --cached --quiet\nif($LASTEXITCODE){throw 'Promotion source index changed\
        \ unexpectedly'}\n$wrapper='VeraInternal/Vera.bat'\n$dirty=@(& git -C source diff --name-only HEAD)\nif($LASTEXITCODE){throw 'Promotion source diff rejected'}\n$unexpected=@($dirty|Where-Object{$_-ne$wrapper})\n\
        if($unexpected.Count){throw ('Unexpected tracked source changes before promotion: '+($unexpected-join', '))}\nif($dirty -contains $wrapper){\n  & git -C source restore --worktree\
        \ --source=HEAD -- $wrapper\n  if($LASTEXITCODE){throw 'Pinned toolchain wrapper restoration failed'}\n}\n& git -C source diff --quiet HEAD\nif($LASTEXITCODE){throw 'Pinned tracked\
        \ source verification failed'}\nWrite-Host '[PROJECT/WORKSPACE/PREPARE/SOURCE][OK] exact pins; original tracked source; publisher clean gate retained'\n"
    - name: Restore the exact frozen Bootstrap delivery
      shell: pwsh
      env:
        PRIVATE_SOURCE_REPOSITORY: ${{ secrets.MIX_REPO }}
      run: '& ./recipe/.github/scripts/Restore-FrozenBootstrap.ps1 -SourceRoot ./source -ExpectedRepository $env:PRIVATE_SOURCE_REPOSITORY

        if(!$?){throw ''Frozen Bootstrap delivery restore failed''}

        '
    - name: Restore pinned Commander bundles
      if: ${{ inputs.include_launcher }}
      shell: pwsh
      env:
        PRIVATE_SOURCE_REPOSITORY: ${{ secrets.MIX_REPO }}
      run: '& ./recipe/.github/scripts/Restore-PinnedCommanderBundles.ps1 -SourceRoot ./source -ExpectedRepository $env:PRIVATE_SOURCE_REPOSITORY

        if(!$?){throw ''Pinned Commander bundle restore failed''}

        '
    - name: Restore approved native delivery with original provenance
      id: native
      shell: pwsh
      env:
        PRIVATE_SOURCE_REPOSITORY: ${{ secrets.MIX_REPO }}
      run: '& ./recipe/.github/scripts/Restore-ApprovedNativeRuntime.ps1 -SourceRoot ./source -ExpectedRepository $env:PRIVATE_SOURCE_REPOSITORY

        if(!$?){throw ''Approved native delivery restore failed''}

        '
    - name: Resolve verified hosted release floor
      id: release_policy
      shell: pwsh
      env:
        REQUESTED_EPOCH: ${{ github.event.client_payload.minimum_launch_epoch || github.event.inputs.minimum_launch_epoch || vars.KYRON_VERIFIED_MINIMUM_LAUNCH_EPOCH || '' }}
      run: '& python ./recipe/.github/scripts/release_policy.py "--requested=$env:REQUESTED_EPOCH"

        if($LASTEXITCODE){throw ''Hosted release floor rejected''}

        '
    - name: Promote restored lanes into Pantry
      if: ${{ steps.native.outputs.pending != 'true' }}
      id: promotion
      shell: pwsh -NoLogo -NoProfile -NonInteractive -File recipe/.github/scripts/Invoke-HostedReleaseStep.ps1 -Script {0}
      env:
        GITHUB_TOKEN: ${{ github.token }}
        KYRON_PANTRY_SIGNER_PROFILE: local-machine-v1
        KYRON_MINIMUM_LAUNCH_EPOCH: ${{ steps.release_policy.outputs.minimum_epoch }}
      run: '$ErrorActionPreference=''Stop'';$plan=if(''${{ inputs.include_launcher }}''-eq''true''){''both''}else{''runtime''};$args=@{PantryPath=(Join-Path $PWD.Path ''source/Distribution'');RuntimeChannel=''${{
        inputs.runtime_channel }}'';ArtifactPlan=$plan;SkipBuild=$true};if(''${{ inputs.include_launcher }}''-eq''true''){$args.IncludeLauncher=$true}

        & .\source\etc\publishing\Update-PantryArtifacts.ps1 @args;if(!$?){throw ''Restored Workspace lane promotion failed''}

        $sha=(& git -C source/Distribution rev-parse HEAD 2>$null).Trim().ToLowerInvariant()

        if($LASTEXITCODE-or$sha-notmatch''^[0-9a-f]{40}$''){throw ''Promoted Pantry delivery pin rejected''}

        Write-Host "::add-mask::$sha";"ref=$sha" >> $env:GITHUB_OUTPUT

        Write-Host "[PROJECT/WORKSPACE/PROMOTE][OK] plan=$plan"

        '
    - name: Seal prepared generated delivery for canonical publisher
      if: ${{ steps.promotion.outputs.superseded != 'true' && steps.native.outputs.pending != 'true' }}
      id: prepared
      shell: pwsh
      env:
        KYRON_HANDOFF_SECRET: ${{ secrets[vars.MIX_KEY_NAME] }}
      run: '& ./recipe/.github/scripts/Seal-PreparedDelivery.ps1 -SourceRoot ./source -OutputRoot (Join-Path $env:RUNNER_TEMP ''workspace-prepared-delivery'')

        if(!$?){throw ''Prepared generated delivery sealing failed''}

        '
    - name: Upload encrypted prepared delivery
      if: ${{ steps.promotion.outputs.superseded != 'true' && steps.native.outputs.pending != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: kyron-workspace-delivery-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.prepared.outputs.root }}
        if-no-files-found: error
        retention-days: 2
    - name: Pin private Pantry delivery
      if: ${{ steps.promotion.outputs.superseded != 'true' && steps.native.outputs.pending != 'true' }}
      id: delivery
      shell: pwsh
      env:
        PROMOTED_PANTRY_SHA: ${{ steps.promotion.outputs.ref }}
      run: '$ErrorActionPreference=''Stop''

        $sha=($env:PROMOTED_PANTRY_SHA+'''').Trim().ToLowerInvariant()

        if($sha-notmatch''^[0-9a-f]{40}$''){throw ''Promoted Pantry delivery pin unavailable''}

        Write-Host "::add-mask::$sha"

        $head=(& git -C source/Distribution rev-parse HEAD 2>$null).Trim().ToLowerInvariant()

        if($LASTEXITCODE-or$head-ne$sha){throw ''Promoted Pantry delivery changed locally''}

        & git -C source/Distribution fetch --quiet --prune origin main 1>$null 2>$null

        if($LASTEXITCODE){throw ''Pantry delivery refresh rejected''}

        & git -C source/Distribution merge-base --is-ancestor $sha refs/remotes/origin/main 1>$null 2>$null

        if($LASTEXITCODE){throw ''Promoted Pantry delivery is absent from remote main''}

        "ref=$sha" >> $env:GITHUB_OUTPUT

        Write-Host ''[PROJECT/WORKSPACE][DELIVERY][OK] exact promoted revision retained; remote main contains delivery''

        '
    - name: Advance encrypted delivery state
      if: ${{ steps.promotion.outputs.superseded != 'true' && steps.native.outputs.pending != 'true' }}
      id: advance
      uses: ./recipe/.github/actions/private-capsule
      with:
        mode: advance
        key: ${{ secrets[vars.MIX_KEY_NAME] }}
        capsule: ${{ inputs.capsule }}
        pantry-ref: ${{ steps.delivery.outputs.ref }}
    - name: Remove ephemeral signing material
      if: ${{ always() }}
      shell: pwsh
      run: '$metaPath=''./source/etc/security/signing/canonical-signer.json'';if(Test-Path -LiteralPath $metaPath -PathType Leaf){$meta=Get-Content -LiteralPath $metaPath -Raw|ConvertFrom-Json;$thumb=([string]$meta.thumbprint_sha1-replace''\s'','''').ToUpperInvariant();foreach($storeName
        in @(''TrustedPublisher'',''Root'')){& certutil.exe -delstore $storeName $thumb|Out-Null};& certutil.exe -user -delstore My $thumb|Out-Null}

        foreach($leaf in @(''kyron-canonical.cer'',''kyron-canonical.pfx'')){$path=Join-Path $env:RUNNER_TEMP $leaf;if(Test-Path -LiteralPath $path -PathType Leaf){Remove-Item -LiteralPath
        $path -Force}}

        if(Test-Path ''.\source\etc\build\workspace-common.ps1''){. .\source\etc\build\workspace-common.ps1;$root=Join-Path (Get-WorkspaceDataRoot) ''SigningKeys\PantryLocal\v1'';if(Test-Path
        -LiteralPath $root){Remove-Item -LiteralPath $root -Recurse -Force}}

        '
    if: ${{ github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' }}
