name: Workspace RevTranslator ABI lane

on:
  workflow_call:
    inputs:
      capsule:
        required: true
        type: string
      component_mode:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  apk:
    name: Build and verify canonical RevTranslator four ABIs
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      ANDROID_HOME: ''
      ANDROID_SDK_ROOT: ''
      ANDROID_NDK_HOME: ''
      ANDROID_NDK_ROOT: ''
      NDK_ROOT: ''
      JAVA_HOME: ''
    steps:
      - name: Enable Git long paths before checkout
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & git config --global core.longpaths true
          if($LASTEXITCODE-ne0){throw 'Git long-path setup failed'}
      - name: Open lane recipe
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: recipe
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          sparse-checkout: |
            .github/actions/private-capsule

      - name: Open private source state
        id: state
        uses: ./recipe/.github/actions/private-capsule
        with:
          mode: open
          key: ${{ secrets[vars.MIX_KEY_NAME] }}
          capsule: ${{ inputs.capsule }}
          project: workspace

      - name: Open pinned Workspace and integrated distribution
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.MIX_REPO }}
          token: ${{ secrets[vars.MIX_KEY_NAME] }}
          ref: ${{ steps.state.outputs.workspace_ref }}
          path: source
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          show-progress: false
          sparse-checkout: |
            .gitignore
            etc
            RevTranslator
            VeraInternal
            Bootstrap
            Launcher
            Shared
            /Distribution/SrcVersion.ini
          sparse-checkout-cone-mode: false


      - name: Bind release source branches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($repo in @('source')){& git -C $repo checkout -q -B main HEAD;if($LASTEXITCODE){throw "release main binding rejected: $repo"}}

      - name: Materialize canonical Pantry trust
        shell: pwsh
        env:
          CREAM_A: ${{ secrets.KYRON_PANTRY_LOCAL_BOOTSTRAP_PRIVATE_PEM }}
          CREAM_B: ${{ secrets.KYRON_PANTRY_LOCAL_BOOTSTRAP_PUBLIC_PEM }}
          JAM_A: ${{ secrets.KYRON_PANTRY_LOCAL_CONTENT_PRIVATE_PEM }}
          JAM_B: ${{ secrets.KYRON_PANTRY_LOCAL_CONTENT_PUBLIC_PEM }}
        run: |
          $ErrorActionPreference='Stop'
          foreach($n in @('CREAM_A','CREAM_B','JAM_A','JAM_B')){if([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($n))){throw "canonical local Pantry signer input missing: $n"}}
          . .\source\etc\build\workspace-common.ps1
          $root=Join-Path (Get-WorkspaceDataRoot) 'SigningKeys\PantryLocal\v1';New-Item -ItemType Directory -Force -Path $root|Out-Null;$utf8=[Text.UTF8Encoding]::new($false)
          foreach($x in @(@('bootstrap_root_private.pem','CREAM_A'),@('bootstrap_root_public.pem','CREAM_B'),@('content_private.pem','JAM_A'),@('content_public.pem','JAM_B'))){[IO.File]::WriteAllText((Join-Path $root $x[0]),([Environment]::GetEnvironmentVariable($x[1])).Trim()+"`n",$utf8)}
          & .\source\etc\publishing\Initialize-LocalPantrySigner.ps1 -PantryPath (Join-Path $PWD.Path 'source/Distribution') -Workspace (Join-Path $PWD.Path 'source') -ExpectedProfile local-machine-v1 -Ephemeral -RequireExistingIdentity|Out-Null
          if(!$?){throw 'Canonical local Pantry trust generation failed'}
          $trust=Join-Path $PWD.Path 'source\VeraInternal\jni\Protection\PantryLocalTrust.generated.hpp'
          if(!(Test-Path -LiteralPath $trust -PathType Leaf)){throw 'VeraInternal generated Pantry trust header is unavailable'}
          Write-Host '[PROJECT/WORKSPACE/APK/TRUST][OK] canonical local-machine-v1 header materialized'

      - name: Materialize canonical code signer
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.KYRON_CODESIGN_PFX_B64 }}
          PFX_PASS: ${{ secrets.KYRON_CODESIGN_PASSWORD }}
        run: |
          $ErrorActionPreference='Stop'
          foreach($n in @('PFX_B64','PFX_PASS')){if([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($n))){throw "canonical code signer input missing: $n"}}
          $meta=Get-Content -LiteralPath './source/etc/security/signing/canonical-signer.json' -Raw|ConvertFrom-Json
          $expected=([string]$meta.certificate_sha256).Trim().ToLowerInvariant()
          if($expected-notmatch'^[0-9a-f]{64}$'){throw 'canonical code signer SHA256 pin is invalid'}
          $root=Join-Path $env:RUNNER_TEMP 'kyron-apk-codesign';New-Item -ItemType Directory -Force -Path $root|Out-Null;$pfx=Join-Path $root 'canonical.pfx'
          $raw=[Convert]::FromBase64String($env:PFX_B64);[IO.File]::WriteAllBytes($pfx,$raw);$password=$env:PFX_PASS.TrimEnd([char[]]"`r`n")
          $cert=[Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx,$password,[Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
          try{
            $actual=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($cert.RawData)).ToLowerInvariant()
            if($actual-ne$expected){throw "canonical code signer pin mismatch: actual=$actual expected=$expected"}
            if(!$cert.HasPrivateKey){throw 'canonical code signer PFX does not expose a private key'}
            if(([string]$meta.thumbprint_sha1)-and(([string]$meta.thumbprint_sha1).Replace(' ','').ToUpperInvariant()-ne([string]$cert.Thumbprint).Replace(' ','').ToUpperInvariant())){throw 'canonical code signer SHA1 thumbprint mismatch'}
          }finally{$cert.Dispose();[Security.Cryptography.CryptographicOperations]::ZeroMemory($raw)}
          "KYRON_CODESIGN_PFX=$pfx" >> $env:GITHUB_ENV
          "KYRON_CODESIGN_PASSWORD=$password" >> $env:GITHUB_ENV
          Write-Host "[PROJECT/WORKSPACE/APK/CODESIGN][OK] cert=$expected private_key=ephemeral-pfx"

      - name: Chill toolchains
        if: ${{ inputs.component_mode == false }}
        uses: actions/cache@v6.1.0
        with:
          path: |
            *-sdk/Android
            *-sdk/Java
            *-sdk/Smali
          key: workspace-apk-toolchains-v1-${{ runner.os }}-${{ hashFiles('source/etc/build/toolchains.lock.json') }}

      - name: Install managed .NET 8 SDK
        if: ${{ inputs.component_mode == false }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Bind managed SDK
        if: ${{ inputs.component_mode == false }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          . .\source\etc\build\workspace-common.ps1
          $sdk=Resolve-WorkspaceSdkRoot;$dotnet=(Get-Command dotnet.exe -ErrorAction Stop).Source;$target=Join-Path $sdk 'dotnet\current'
          New-Item -ItemType Directory -Force (Split-Path $target -Parent)|Out-Null
          if(!(Test-Path -LiteralPath $target -PathType Container)){New-Item -ItemType Junction -Path $target -Target (Split-Path $dotnet -Parent)|Out-Null}
          if(!(Test-Path -LiteralPath (Join-Path $target 'dotnet.exe') -PathType Leaf)){throw 'Canonical managed .NET SDK binding is unavailable'}

      - name: Ensure canonical Workspace toolchain
        if: ${{ inputs.component_mode == false }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & .\source\etc\build\ensure-workspace-toolchain.ps1
          if(!$?){throw 'Canonical Workspace toolchain bootstrap failed'}

      - name: Install pinned JDK for APK component
        if: ${{ inputs.component_mode }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.20+8'

      - name: Prepare minimal APK toolchain only
        if: ${{ inputs.component_mode }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          . .\source\etc\build\workspace-common.ps1
          $sdk=Resolve-WorkspaceSdkRoot
          $jdkTarget=$env:JAVA_HOME
          if(!(Test-Path -LiteralPath (Join-Path $jdkTarget 'bin\javac.exe') -PathType Leaf)){throw 'Pinned APK JDK is unavailable'}
          foreach($link in @((Join-Path $sdk 'Java\17.0.20'),(Join-Path $sdk 'Java\current'))){
            if(Test-Path -LiteralPath $link){Remove-Item -LiteralPath $link -Recurse -Force}
            New-Item -ItemType Directory -Force -Path (Split-Path $link -Parent)|Out-Null
            New-Item -ItemType Junction -Path $link -Target $jdkTarget|Out-Null
          }
          & .\source\etc\build\setup-android-minimal.ps1 -SdkRoot $sdk
          if(!$?){throw 'Minimal component APK Android surface bootstrap failed'}
          $lock=Get-Content -LiteralPath '.\source\etc\build\toolchains.lock.json' -Raw|ConvertFrom-Json
          $smaliDir=Join-Path $sdk ([string]$lock.smali.folder);New-Item -ItemType Directory -Force -Path $smaliDir|Out-Null
          $smali=Join-Path $smaliDir ('smali-'+[string]$lock.smali.version+'-fat-release.jar')
          $expected=([string]$lock.smali.sha256).ToLowerInvariant()
          $valid=(Test-Path -LiteralPath $smali -PathType Leaf)-and((Get-FileHash -LiteralPath $smali -Algorithm SHA256).Hash.ToLowerInvariant()-eq$expected)
          if(!$valid){
            $part=$smali+'.part';Remove-Item -LiteralPath $part -Force -ErrorAction SilentlyContinue
            & curl.exe -L --fail --retry 2 --retry-all-errors --connect-timeout 15 --silent --show-error ([string]$lock.smali.download) -o $part
            if($LASTEXITCODE){throw 'Pinned Smali download failed'}
            $actual=(Get-FileHash -LiteralPath $part -Algorithm SHA256).Hash.ToLowerInvariant();if($actual-ne$expected){Remove-Item $part -Force;throw 'Pinned Smali hash mismatch'}
            Move-Item -LiteralPath $part -Destination $smali -Force
          }
          & .\source\etc\build\repair-pinned-ndk.ps1 -SdkRoot $sdk
          if(!$?){throw 'Pinned APK ABI-marker NDK bootstrap failed'}
          $ndk=Join-Path $sdk 'Android\sdk\ndk\28.0.13004108'
          if(!(Test-Path -LiteralPath (Join-Path $ndk 'toolchains\llvm\prebuilt\windows-x86_64\bin\clang.exe') -PathType Leaf)){throw 'Pinned APK ABI-marker clang is unavailable'}
          "KYRON_CANONICAL_SDK_ROOT=$sdk" >> $env:GITHUB_ENV
          "KYRON_SDK_ROOT=$sdk" >> $env:GITHUB_ENV
          "KYRON_SMALI_JAR=$smali" >> $env:GITHUB_ENV
          "ANDROID_NDK_HOME=$ndk" >> $env:GITHUB_ENV
          Write-Host "[COMPONENT/APK/TOOLCHAIN][OK] jdk=17.0.20 android=minimal smali=$([string]$lock.smali.version) ndk=abi-marker-only no-llvm-mingw no-dotnet sdk=$sdk"

      - name: Verify and compile RevTranslator ABI matrix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($retired in @('KyronVM','Supervisor','RevEngine','Bridge','NativeBridgeRuntime')){
            $entry=@(& git -C source ls-tree -d HEAD -- ("src/android/"+$retired))
            if($LASTEXITCODE -ne 0 -or $entry.Count -ne 0){throw "Retired Android tree unexpectedly present: $retired"}
          }
          $path=Join-Path $PWD.Path 'source/RevTranslator'
          foreach($f in @('rev_translator.py','test_rev_translator.py','build.ps1','upstream.lock.json','THIRD_PARTY_LICENSES.txt')){
            if(!(Test-Path -LiteralPath (Join-Path $path $f) -PathType Leaf)){throw "RevTranslator pinned source missing: $f"}
          }
          $lock=Get-Content -LiteralPath (Join-Path $path 'upstream.lock.json') -Raw|ConvertFrom-Json
          if([string]$lock.andkitty_sha -notmatch '^[a-f0-9]{40}$' -or [string]$lock.kittymemory_sha -notmatch '^[a-f0-9]{40}$'){
            throw 'Unpinned Android native injector source'
          }
          $abis=@('armeabi-v7a','arm64-v8a','x86','x86_64')
          if(@(Compare-Object $abis @($lock.abis)).Count -ne 0){throw 'Native injector ABI lock mismatch'}
          Push-Location $path
          try{
            & python.exe -B -m unittest -v test_rev_translator
            if($LASTEXITCODE -ne 0){throw 'RevTranslator ABI regression suite failed'}
          }finally{Pop-Location}
          . .\source\etc\build\workspace-common.ps1
          $sdk=Resolve-WorkspaceSdkRoot
          $ndk=Join-Path $sdk 'Android/sdk/ndk/28.0.13004108'
          $cmake=(Get-Command cmake.exe -ErrorAction Stop).Source
          $ninja=(Get-Command ninja.exe -ErrorAction Stop).Source
          $readelf=Join-Path $ndk 'toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-readelf.exe'
          if(!(Test-Path -LiteralPath $readelf -PathType Leaf)){throw 'Pinned NDK readelf unavailable'}
          $out=Join-Path $env:RUNNER_TEMP 'kyron-revtranslator-four-abi'
          & (Join-Path $path 'build.ps1') -Ndk $ndk -CMake $cmake -Ninja $ninja -Output $out
          if(!$? -or $LASTEXITCODE -ne 0){throw 'RevTranslator pinned native build failed'}
          $expectedClasses=@{'armeabi-v7a'='ELF32';'arm64-v8a'='ELF64';'x86'='ELF32';'x86_64'='ELF64'}
          $expectedMachines=@{'armeabi-v7a'='ARM';'arm64-v8a'='AArch64';'x86'='Intel 80386';'x86_64'='Advanced Micro Devices X86-64'}
          foreach($abi in $abis){
            $exe=Join-Path $out "$abi/AndKittyInjector"
            if(!(Test-Path -LiteralPath $exe -PathType Leaf)){throw "Missing verified $abi native injector"}
            $elf=@(& $readelf -h $exe)
            if($LASTEXITCODE -ne 0){throw "ELF read failed for $abi"}
            $class=@($elf|Where-Object {$_ -match '^\s*Class:\s+'})
            $type=@($elf|Where-Object {$_ -match '^\s*Type:\s+'})
            $machine=@($elf|Where-Object {$_ -match '^\s*Machine:\s+'})
            if($class.Count -ne 1 -or $type.Count -ne 1 -or $machine.Count -ne 1){throw "Incomplete ELF header for $abi"}
            if($class[0] -notmatch ('^\s*Class:\s*'+[regex]::Escape($expectedClasses[$abi])+'(?:\s|$)') -or
              $type[0] -notmatch '^\s*Type:\s+DYN(?:\s|$)' -or
              $machine[0] -notmatch ('^\s*Machine:\s*'+[regex]::Escape($expectedMachines[$abi])+'(?:\s|$)')){
             throw "ELF architecture, class, or shared-object type mismatch for $abi"
           }
           $sha=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
           Write-Host "[PROJECT/WORKSPACE/REVTRANSLATOR][OK] abi=$abi sha256=$sha"
          }
          Write-Host '[PROJECT/WORKSPACE/REVTRANSLATOR][OK] native 4-ABI build + signed source topology and tests passed; no APK generated'

      - name: Remove ephemeral code signer
        if: ${{ always() }}
        shell: pwsh
        run: |
          $pfx=$env:KYRON_CODESIGN_PFX
          if(![string]::IsNullOrWhiteSpace($pfx)-and(Test-Path -LiteralPath $pfx -PathType Leaf)){
            $len=(Get-Item -LiteralPath $pfx).Length
            if($len-gt0){[IO.File]::WriteAllBytes($pfx,(New-Object byte[] $len))}
            $root=Split-Path -Parent $pfx
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host '[PROJECT/WORKSPACE/APK/CODESIGN][CLEAN] ephemeral PFX removed'

      - name: Remove ephemeral Pantry trust
        if: ${{ always() }}
        shell: pwsh
        run: |
          if(Test-Path '.\source\etc\build\workspace-common.ps1'){
            . .\source\etc\build\workspace-common.ps1
            $root=Join-Path (Get-WorkspaceDataRoot) 'SigningKeys\PantryLocal\v1'
            if(Test-Path -LiteralPath $root){Remove-Item -LiteralPath $root -Recurse -Force}
          }
