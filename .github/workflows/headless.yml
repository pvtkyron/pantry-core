name: Pantry Runtime Smoke
'on':
  workflow_call:
    inputs:
      capsule:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      capsule:
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    name: Headless serial checks
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    env:
      KYRON_SERIAL_BUILD: '1'
      KYRON_BUILD_JOBS: '1'
    steps:
    - name: Enable Git long paths before checkout
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        & git config --global core.longpaths true
        if($LASTEXITCODE-ne0){throw 'Git long-path setup failed'}
    - name: Open capsule helper
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        path: recipe
        fetch-depth: 1
        persist-credentials: false
        show-progress: false
        sparse-checkout: .github
        sparse-checkout-cone-mode: false
    - name: Open private Workspace state
      id: state
      uses: ./recipe/.github/actions/private-capsule
      with:
        mode: open
        key: ${{ secrets[vars.MIX_KEY_NAME] }}
        capsule: ${{ inputs.capsule }}
        project: workspace
    - name: Open pinned Workspace and integrated distribution
      uses: actions/checkout@v6
      with:
        repository: ${{ secrets.MIX_REPO }}
        token: ${{ secrets[vars.MIX_KEY_NAME] }}
        ref: ${{ steps.state.outputs.workspace_ref }}
        path: source
        fetch-depth: 1
        persist-credentials: false
        show-progress: false
        sparse-checkout: |
          /*
        sparse-checkout-cone-mode: false
    - name: Run headless matrix serially and quietly
      shell: pwsh
      run: |
        $targets=@(
          @{Configuration='Release';Platform='x64'}
        )
        foreach($target in $targets){
          $log=Join-Path $env:RUNNER_TEMP ("headless-{0}-{1}.log"-f$target.Configuration,$target.Platform)
          try{
            & ./source/etc/devtools/Test-KyronHeadless.ps1 -Suite All -Configuration $target.Configuration -Platform $target.Platform *>&1 | Set-Content -LiteralPath $log
            if($LASTEXITCODE){throw 'headless rejected'}
            Write-Host ("[HEADLESS][OK] configuration={0} platform={1}"-f$target.Configuration,$target.Platform)
          }catch{
            Write-Host ("[HEADLESS][FAIL] configuration={0} platform={1}"-f$target.Configuration,$target.Platform)
            if(Test-Path -LiteralPath $log -PathType Leaf){
              $raw=[string](Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue)
              $stages=[regex]::Matches($raw,'\[KYRON\]\[HEADLESS\]\[(?:Launcher|InstallLib|Bootstrap)\]\[(?:BUILD|RUN|OK)\]')
              $stage=if($stages.Count){$stages[$stages.Count-1].Value}else{'not-started'}
              $codes=@([regex]::Matches($raw,'(?i)\b(?:MSB|C|LNK|NETSDK)\d{4}\b')|ForEach-Object{$_.Value.ToUpperInvariant()}|Select-Object -Unique)
              $markers=@();foreach($marker in @('MSBuild not found','Managed Windows SDK build','headless build failed','headless tests failed','headless executable missing','headless build failed with exit code','headless tests failed with exit code')){if($raw.Contains($marker)){$markers+=$marker}}
              $code=[regex]::Match($raw,'(?i)headless (?:build|tests) failed with exit code (\d+)')
              $exitCode=if($code.Success){$code.Groups[1].Value}else{'unknown'}
              $failureType=$_.Exception.GetType().Name
              Write-Host ("[HEADLESS][DIAGNOSTIC] stage={0} compiler_codes={1} failure_classes={2} exit={3} exception_type={4} log_present={5}"-f$stage,($codes-join','),($markers-join';'),$exitCode,$failureType,($raw.Length-gt0))
            }
            exit 1
          }finally{
            if(Test-Path $log){Remove-Item $log -Force -ErrorAction SilentlyContinue}
          }
        }
    if: ${{ github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' }}
