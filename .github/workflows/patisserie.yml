name: Midnight Patisserie

on:
  push:
    branches: [main]
    paths: [.github/workflows/patisserie.yml, .github/kitchen.ps1]
  workflow_dispatch:
    inputs:
      fresh_batch:
        description: Bake a fresh batch
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [fresh-batch]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: midnight-patisserie-main
  cancel-in-progress: false

jobs:
  tray:
    name: Weigh tray
    runs-on: ubuntu-24.04
    outputs:
      fresh: ${{ steps.taste.outputs.fresh }}
    steps:
      - name: Set table
        id: taste
        shell: pwsh
        env:
          SHELF_KEY: ${{ github.token }}
          MIX: ${{ secrets.MIX_REPO }}
          MIX_KEY: ${{ secrets[vars.MIX_KEY_NAME] }}
          FILL: ${{ secrets.FILL_REPO }}
          FILL_KEY: ${{ secrets[vars.FILL_KEY_NAME] }}
        run: |
          & git clone --quiet --branch main "https://github.com/$env:GITHUB_REPOSITORY.git" shelf *> $null
          if($LASTEXITCODE){throw 'counter rejected'}
          & ./shelf/.github/kitchen.ps1 -Mode Tray
          exit $LASTEXITCODE

  oven:
    name: Bake batch
    needs: tray
    if: ${{ needs.tray.outputs.fresh == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.fresh_batch) }}
    runs-on: windows-2025
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Bake
        shell: pwsh
        env:
          SHELF_KEY: ${{ github.token }}
          MIX: ${{ secrets.MIX_REPO }}
          MIX_KEY: ${{ secrets[vars.MIX_KEY_NAME] }}
          FILL: ${{ secrets.FILL_REPO }}
          FILL_KEY: ${{ secrets[vars.FILL_KEY_NAME] }}
          CREAM_A: ${{ secrets[vars.CREAM_A_NAME] }}
          CREAM_B: ${{ secrets[vars.CREAM_B_NAME] }}
          JAM_A: ${{ secrets[vars.JAM_A_NAME] }}
          JAM_B: ${{ secrets[vars.JAM_B_NAME] }}
          TIN: ${{ secrets[vars.TIN_NAME] }}
          PIN: ${{ secrets[vars.PIN_NAME] }}
        run: |
          & git clone --quiet --branch main "https://github.com/$env:GITHUB_REPOSITORY.git" shelf *> $null
          if($LASTEXITCODE){throw 'counter rejected'}
          & .\shelf\.github\kitchen.ps1 -Mode Oven -Batch '${{ github.run_id }}' -Try '${{ github.run_attempt }}' -Fresh:$('${{ inputs.fresh_batch }}'-eq'true')
          exit $LASTEXITCODE
