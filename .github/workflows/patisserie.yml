name: Kyron Full Release · 6h
run-name: "Kyron full release · native + launcher + doctor · ${{ github.run_id }}"

on:
  workflow_dispatch:
  repository_dispatch:
    types: [workspace-release]
  push:
    branches: [main]
    paths:
      - '.github/workflows/patisserie.yml'
      - '.github/workflows/source-pin.yml'
      - '.github/workflows/project-sdk.yml'
      - '.github/workflows/project-web.yml'
      - '.github/workflows/project-workspace.yml'
      - '.github/workflows/workspace-java.yml'
      - '.github/workflows/workspace-lib.yml'
      - '.github/workflows/workspace-exe.yml'
      - '.github/workflows/workspace-prepare.yml'
      - '.github/workflows/doctor.yml'
      - '.github/workflows/box.yml'
      - '.github/workflows/headless.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: kyron-full-reconcile-6h
  cancel-in-progress: false

jobs:
  sources:
    name: 1 · Pin private sources
    uses: ./.github/workflows/source-pin.yml
    secrets: inherit

  sdk:
    name: 2 · SDK project
    needs: sources
    if: ${{ needs.sources.result == 'success' }}
    uses: ./.github/workflows/project-sdk.yml
    with:
      capsule: ${{ needs.sources.outputs.capsule }}
    secrets: inherit

  web:
    name: 3 · Web project
    needs: sources
    if: ${{ needs.sources.result == 'success' }}
    uses: ./.github/workflows/project-web.yml
    with:
      capsule: ${{ needs.sources.outputs.capsule }}
    secrets: inherit

  # Restore toolchain-written wrappers to their pinned source before promotion.
  # An authenticated immutable Pantry SHA is shared by Java, native, executable and Prepare handoffs.
  workspace:
    name: 4 · Workspace full build + publish
    needs: [sources, sdk, web]
    permissions:
      contents: write
    if: ${{ needs.sdk.result == 'success' && needs.web.result == 'success' }}
    uses: ./.github/workflows/project-workspace.yml
    with:
      capsule: ${{ needs.sources.outputs.capsule }}
      runtime_channel: both
      include_launcher: true
    secrets: inherit

  # Portable validation checks signed-history non-resurrection before public mirror publication.
  doctor:
    name: 5 · Source validation
    needs: [workspace]
    if: ${{ needs.workspace.result == 'success' }}
    uses: ./.github/workflows/doctor.yml
    with:
      capsule: ${{ needs.workspace.outputs.delivery_capsule }}
    secrets: inherit

  publish:
    name: 6 · Pantry Core canonical publish
    needs: [workspace, doctor]
    permissions:
      contents: write
      actions: write
    if: ${{ needs.doctor.result == 'success' }}
    uses: ./.github/workflows/box.yml
    with:
      capsule: ${{ needs.workspace.outputs.delivery_capsule }}
      runtime_channel: both
      include_launcher: true
    secrets: inherit

  headless:
    name: 7 · Post-publish runtime smoke
    needs: [workspace, publish]
    if: ${{ needs.publish.result == 'success' }}
    uses: ./.github/workflows/headless.yml
    with:
      capsule: ${{ needs.workspace.outputs.delivery_capsule }}
    secrets: inherit