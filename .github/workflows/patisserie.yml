name: Midnight Patisserie

on:
  push:
    branches: [main]
    paths: [.github/workflows/patisserie.yml]
  workflow_dispatch:
    inputs:
      fresh_batch:
        description: Bake a fresh batch
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [fresh-batch]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: midnight-patisserie-main
  cancel-in-progress: false

jobs:
  tray:
    name: Weigh tray
    runs-on: ubuntu-24.04
    outputs:
      fresh: ${{ steps.taste.outputs.fresh }}
    steps:
      - name: Set table
        id: taste
        shell: pwsh
        env:
          SHELF_KEY: ${{ github.token }}
          MIX: ${{ secrets.MIX_REPO }}
          MIX_KEY: ${{ secrets[vars.MIX_KEY_NAME] }}
          FILL: ${{ secrets.FILL_REPO }}
          FILL_KEY: ${{ secrets[vars.FILL_KEY_NAME] }}
        run: |
          $ErrorActionPreference='Stop';$env:GIT_TERMINAL_PROMPT='0'
          function Pull($name,$repo,$key){
            $pair=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$key"));$h="AUTHORIZATION: basic $pair";$u="https://github.com/$repo.git"
            & git -c "http.https://github.com/.extraheader=$h" clone --quiet --branch main $u $name *> $null
            if($LASTEXITCODE){throw 'tray rejected'}
            & git -C $name config http.https://github.com/.extraheader $h
            & git -C $name lfs pull *> $null;if($LASTEXITCODE){throw 'tray rejected'}
          }
          Pull 'shelf' $env:GITHUB_REPOSITORY $env:SHELF_KEY
          Pull 'mix' $env:MIX $env:MIX_KEY
          Pull 'filling' $env:FILL $env:FILL_KEY
          & ./mix/Tools/Bake.ps1 -Fill (Join-Path $env:GITHUB_WORKSPACE 'filling') -Shelf (Join-Path $env:GITHUB_WORKSPACE 'shelf') -Peek
          exit $LASTEXITCODE

  oven:
    name: Bake batch
    needs: tray
    if: ${{ needs.tray.outputs.fresh == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.fresh_batch) }}
    runs-on: windows-2025
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Bake
        shell: pwsh
        env:
          SHELF_KEY: ${{ github.token }}
          MIX: ${{ secrets.MIX_REPO }}
          MIX_KEY: ${{ secrets[vars.MIX_KEY_NAME] }}
          FILL: ${{ secrets.FILL_REPO }}
          FILL_KEY: ${{ secrets[vars.FILL_KEY_NAME] }}
          CREAM_A: ${{ secrets[vars.CREAM_A_NAME] }}
          CREAM_B: ${{ secrets[vars.CREAM_B_NAME] }}
          JAM_A: ${{ secrets[vars.JAM_A_NAME] }}
          JAM_B: ${{ secrets[vars.JAM_B_NAME] }}
          TIN: ${{ secrets[vars.TIN_NAME] }}
          PIN: ${{ secrets[vars.PIN_NAME] }}
        run: |
          $ErrorActionPreference='Stop';$env:GIT_TERMINAL_PROMPT='0'
          function Pull($name,$repo,$key){
            $pair=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$key"));$h="AUTHORIZATION: basic $pair";$u="https://github.com/$repo.git"
            & git -c "http.https://github.com/.extraheader=$h" clone --quiet --branch main $u $name *> $null
            if($LASTEXITCODE){throw 'batch rejected'}
            & git -C $name config http.https://github.com/.extraheader $h
            & git -C $name lfs pull *> $null;if($LASTEXITCODE){throw 'batch rejected'}
          }
          Pull 'shelf' $env:GITHUB_REPOSITORY $env:SHELF_KEY
          Pull 'mix' $env:MIX $env:MIX_KEY
          Pull 'filling' $env:FILL $env:FILL_KEY
          $a=@('-Fill',(Join-Path $env:GITHUB_WORKSPACE 'filling'),'-Shelf',(Join-Path $env:GITHUB_WORKSPACE 'shelf'),'-Batch','${{ github.run_id }}','-Try','${{ github.run_attempt }}')
          if('${{ inputs.fresh_batch }}'-eq'true'){$a+='-Fresh'}
          $ps=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\mix\Tools\Bake.ps1 @a
          exit $LASTEXITCODE
