name: Midnight Patisserie

on:
  push:
    branches: [main]
    paths: [.github/**]
  workflow_dispatch:
    inputs:
      fresh_batch:
        description: Fresh batch
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [fresh-batch]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: midnight-patisserie-main
  cancel-in-progress: false

jobs:
  tray:
    name: Weigh tray
    runs-on: ubuntu-24.04
    outputs:
      mix_ref: ${{ steps.pin.outputs.mix_ref }}
      sponge: ${{ steps.taste.outputs.sponge }}
      meringue: ${{ steps.taste.outputs.meringue }}
      meringue_stamp: ${{ steps.taste.outputs.meringue_stamp }}
      cream: ${{ steps.taste.outputs.cream }}
      cocoa: ${{ steps.taste.outputs.cocoa }}
      cherry: ${{ steps.taste.outputs.cherry }}
      mint: ${{ steps.taste.outputs.mint }}
      mochi: ${{ steps.taste.outputs.mochi }}
      truffle: ${{ steps.taste.outputs.truffle }}
      box: ${{ steps.taste.outputs.box }}
    steps:
      - name: Dust counter
        shell: pwsh
        run: |
          Write-Host "::add-mask::$env:GITHUB_REPOSITORY"
          $crumb=$env:GITHUB_REPOSITORY -split '/',2
          foreach($x in $crumb){if($x){Write-Host "::add-mask::$x"}}
      - name: Open recipe
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: recipe
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          sparse-checkout: .github/actions/table
      - name: Set table
        uses: ./recipe/.github/actions/table
        with:
          mix: ${{ secrets.MIX_REPO }}
          mix-key: ${{ secrets[vars.MIX_KEY_NAME] }}
          fill: ${{ secrets.FILL_REPO }}
          fill-key: ${{ secrets[vars.FILL_KEY_NAME] }}
      - name: Pin tray
        id: pin
        shell: pwsh
        run: |
          $mix=(& git -C mix rev-parse HEAD).Trim().ToLowerInvariant()
          if($mix -notmatch '^[0-9a-f]{40}$'){throw 'Workspace source pin rejected'}
          "mix_ref=$mix" >> $env:GITHUB_OUTPUT
      - name: Taste tray
        id: taste
        shell: pwsh
        run: |
          $a=@{Fill=(Join-Path $PWD.Path 'filling');Slice='Probe'}
          if('${{ inputs.fresh_batch }}'-eq'true'){$a.Fresh=$true}
          & ./mix/Tools/BakeSlice.ps1 @a
          exit $LASTEXITCODE

  sponge:
    needs: tray
    if: ${{ needs.tray.outputs.sponge == 'true' }}
    uses: ./.github/workflows/sponge.yml
    with:
      mix_ref: ${{ needs.tray.outputs.mix_ref }}
    secrets: inherit

  meringue:
    needs: tray
    if: ${{ needs.tray.outputs.cream == 'true' }}
    uses: ./.github/workflows/meringue.yml
    with:
      mix_ref: ${{ needs.tray.outputs.mix_ref }}
      stamp: ${{ needs.tray.outputs.meringue_stamp }}
      bake: ${{ needs.tray.outputs.meringue == 'true' }}
    secrets: inherit

  cream:
    needs: [tray, meringue]
    if: ${{ always() && needs.tray.result == 'success' && needs.tray.outputs.cream == 'true' && needs.meringue.result == 'success' }}
    uses: ./.github/workflows/cream.yml
    with:
      mix_ref: ${{ needs.tray.outputs.mix_ref }}
      stamp: ${{ needs.tray.outputs.meringue_stamp }}
    secrets: inherit

  cocoa:
    needs: [tray, meringue, cream]
    if: >-
      ${{ always() && needs.tray.result == 'success' && needs.tray.outputs.cocoa == 'true' &&
          (needs.meringue.result == 'success' || needs.meringue.result == 'skipped') &&
          (needs.cream.result == 'success' || needs.cream.result == 'skipped') }}
    uses: ./.github/workflows/cocoa.yml
    with:
      mix_ref: ${{ needs.tray.outputs.mix_ref }}
      fold: ${{ needs.tray.outputs.cream == 'true' }}
    secrets: inherit

  cherry:
    needs: tray
    if: ${{ needs.tray.outputs.cherry == 'true' }}
    uses: ./.github/workflows/cherry.yml
    with:
      mix_ref: ${{ needs.tray.outputs.mix_ref }}
    secrets: inherit
  mint:
    needs: tray
    if: ${{ needs.tray.outputs.mint == 'true' }}
    uses: ./.github/workflows/mint.yml
    with:
      mix_ref: ${{ needs.tray.outputs.mix_ref }}
    secrets: inherit

  mochi:
    needs: tray
    if: ${{ needs.tray.outputs.mochi == 'true' }}
    uses: ./.github/workflows/mochi.yml
    with:
      mix_ref: ${{ needs.tray.outputs.mix_ref }}
    secrets: inherit

  truffle:
    needs: tray
    if: ${{ needs.tray.outputs.truffle == 'true' }}
    uses: ./.github/workflows/truffle.yml
    with:
      mix_ref: ${{ needs.tray.outputs.mix_ref }}
    secrets: inherit

  box:
    needs: [tray, sponge, meringue, cream, cocoa, cherry, mint, mochi, truffle]
    if: >-
      ${{ always() && needs.tray.result == 'success' && needs.tray.outputs.box == 'true' &&
          (needs.sponge.result == 'success' || needs.sponge.result == 'skipped') &&
          (needs.meringue.result == 'success' || needs.meringue.result == 'skipped') &&
          (needs.cream.result == 'success' || needs.cream.result == 'skipped') &&
          (needs.cocoa.result == 'success' || needs.cocoa.result == 'skipped') &&
          (needs.cherry.result == 'success' || needs.cherry.result == 'skipped') &&
          (needs.mint.result == 'success' || needs.mint.result == 'skipped') &&
          (needs.mochi.result == 'success' || needs.mochi.result == 'skipped') &&
          (needs.truffle.result == 'success' || needs.truffle.result == 'skipped') }}
    permissions:
      contents: write
    uses: ./.github/workflows/box.yml
    with:
      mix_ref: ${{ needs.tray.outputs.mix_ref }}
      fold: ${{ needs.tray.outputs.cream == 'true' && needs.tray.outputs.cocoa != 'true' }}
    secrets: inherit
