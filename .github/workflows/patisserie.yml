name: Kyron Full Release · 6h
run-name: Kyron full release · native + launcher + doctor · ${{ github.run_id }}
'on':
  workflow_dispatch:
    inputs:
      request:
        description: Optional request; blank runs this workflow
        type: string
        default: ''
      payload:
        description: Public request data as JSON; never secrets
        type: string
        default: '{}'
  repository_dispatch:
    types:
    - workspace-release
  push:
    branches:
    - main
    paths:
    - .github/workflows/patisserie.yml
    - .github/workflows/source-pin.yml
    - .github/workflows/project-workspace.yml
    - .github/workflows/workspace-java.yml
    - .github/workflows/workspace-lib.yml
    - .github/workflows/workspace-exe.yml
    - .github/workflows/workspace-prepare.yml
    - .github/workflows/doctor.yml
    - .github/workflows/box.yml
    - .github/workflows/headless.yml
  schedule:
  - cron: 17 */6 * * *
permissions:
  contents: read
concurrency:
  group: kyron-full-reconcile-6h
  cancel-in-progress: true
jobs:
  readiness:
    uses: ./.github/workflows/ci-readiness.yml
    secrets: inherit
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.request == '') && (github.repository == 'pvtkyron/pantry-core'
      && github.ref == 'refs/heads/main') }}
  sources:
    name: 1 · Pin private sources
    needs: readiness
    uses: ./.github/workflows/source-pin.yml
    secrets: inherit
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.request == '') && (github.repository == 'pvtkyron/pantry-core'
      && github.ref == 'refs/heads/main') }}
  workspace:
    name: 2 · Workspace full build + publish
    needs:
    - sources
    permissions:
      contents: write
      actions: write
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.request == '') && (github.repository == 'pvtkyron/pantry-core'
      && github.ref == 'refs/heads/main' && (needs.sources.result == 'success')) }}
    uses: ./.github/workflows/project-workspace.yml
    with:
      capsule: ${{ needs.sources.outputs.capsule }}
      runtime_channel: both
      include_launcher: true
    secrets: inherit
  doctor:
    name: 3 · Source validation
    needs:
    - workspace
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.request == '') && (github.repository == 'pvtkyron/pantry-core'
      && github.ref == 'refs/heads/main' && (needs.workspace.result == 'success')) && needs.workspace.outputs.superseded != 'true' }}
    uses: ./.github/workflows/doctor.yml
    with:
      capsule: ${{ needs.workspace.outputs.delivery_capsule }}
    secrets: inherit
  publish:
    name: 4 · Pantry Core canonical publish
    needs:
    - workspace
    - doctor
    permissions:
      contents: write
      actions: write
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.request == '') && (github.repository == 'pvtkyron/pantry-core'
      && github.ref == 'refs/heads/main' && (needs.doctor.result == 'success')) }}
    uses: ./.github/workflows/box.yml
    with:
      capsule: ${{ needs.workspace.outputs.delivery_capsule }}
      runtime_channel: both
      include_launcher: true
    secrets: inherit
  headless:
    name: 5 · Post-publish runtime smoke
    needs:
    - workspace
    - publish
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.request == '') && (github.repository == 'pvtkyron/pantry-core'
      && github.ref == 'refs/heads/main' && (needs.publish.result == 'success')) }}
    uses: ./.github/workflows/headless.yml
    with:
      capsule: ${{ needs.workspace.outputs.delivery_capsule }}
    secrets: inherit
  request:
    name: Run requested operation in Pantry Core
    if: ${{ github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
      && inputs.request != '' }}
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/automation-request.yml
    with:
      request: ${{ inputs.request }}
      payload: ${{ inputs.payload }}
