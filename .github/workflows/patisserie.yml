name: Midnight Patisserie

on:
  push:
    branches: [main]
    paths: [.github/workflows/patisserie.yml]
  workflow_dispatch:
    inputs:
      fresh_batch:
        description: Bake a fresh batch
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [fresh-batch]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: midnight-patisserie-main
  cancel-in-progress: false

jobs:
  tray:
    name: Weigh tray
    runs-on: ubuntu-24.04
    outputs:
      fresh: ${{ steps.taste.outputs.fresh }}
      cream: ${{ steps.taste.outputs.cream }}
    steps:
      - name: Dust counter
        shell: pwsh
        env:
          MIX: ${{ secrets.MIX_REPO }}
          FILL: ${{ secrets.FILL_REPO }}
        run: |
          Write-Host "::add-mask::$env:MIX"
          Write-Host "::add-mask::$env:FILL"
          $crumb=$env:GITHUB_REPOSITORY -split '/',2
          Write-Host "::add-mask::$env:GITHUB_REPOSITORY"
          if($crumb.Count-eq2){Write-Host "::add-mask::$($crumb[0])";Write-Host "::add-mask::$($crumb[1])"}

      - name: Open counter
        uses: actions/checkout@v6
        with:
          ref: main
          path: shelf
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Measure flour
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.MIX_REPO }}
          ref: main
          token: ${{ secrets[vars.MIX_KEY_NAME] }}
          path: mix
          fetch-depth: 1
          persist-credentials: true
          show-progress: false
      - name: Whip cream
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.FILL_REPO }}
          ref: main
          token: ${{ secrets[vars.FILL_KEY_NAME] }}
          path: filling
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Taste tray
        id: taste
        shell: pwsh
        run: |
          & ./mix/Tools/Bake.ps1 `
            -Fill (Join-Path $PWD.Path 'filling') `
            -Shelf (Join-Path $PWD.Path 'shelf') `
            -Peek
          exit $LASTEXITCODE

  oven:
    name: Bake batch
    needs: tray
    if: ${{ needs.tray.outputs.fresh == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.fresh_batch) }}
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Dust counter
        shell: pwsh
        env:
          MIX: ${{ secrets.MIX_REPO }}
          FILL: ${{ secrets.FILL_REPO }}
        run: |
          Write-Host "::add-mask::$env:MIX"
          Write-Host "::add-mask::$env:FILL"
          $crumb=$env:GITHUB_REPOSITORY -split '/',2
          Write-Host "::add-mask::$env:GITHUB_REPOSITORY"
          if($crumb.Count-eq2){Write-Host "::add-mask::$($crumb[0])";Write-Host "::add-mask::$($crumb[1])"}

      - name: Open counter
        uses: actions/checkout@v6
        with:
          ref: main
          path: shelf
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Measure flour
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.MIX_REPO }}
          ref: main
          token: ${{ secrets[vars.MIX_KEY_NAME] }}
          path: mix
          fetch-depth: 1
          persist-credentials: true
          show-progress: false
      - name: Whip cream
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.FILL_REPO }}
          ref: main
          token: ${{ secrets[vars.FILL_KEY_NAME] }}
          path: filling
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Chill cream
        id: cream_cache
        if: ${{ needs.tray.outputs.cream != 'still' || (github.event_name == 'workflow_dispatch' && inputs.fresh_batch) }}
        uses: actions/cache@v4
        with:
          path: oven/cream
          key: cream-${{ runner.os }}-${{ hashFiles('mix/toolchains.lock.json') }}

      - name: Sift flour
        id: flour_cache
        uses: actions/cache@v4
        with:
          path: oven/flour
          key: flour-${{ runner.os }}-${{ hashFiles('mix/toolchains.lock.json', 'mix/**/requirements*.txt') }}

      - name: Bake
        shell: pwsh
        env:
          CREAM_A: ${{ secrets[vars.CREAM_A_NAME] }}
          CREAM_B: ${{ secrets[vars.CREAM_B_NAME] }}
          JAM_A: ${{ secrets[vars.JAM_A_NAME] }}
          JAM_B: ${{ secrets[vars.JAM_B_NAME] }}
          TIN: ${{ secrets[vars.TIN_NAME] }}
          PIN: ${{ secrets[vars.PIN_NAME] }}
          OVEN_ROOT: oven
          BAKERY_HOSTED: 1
        run: |
          $a=@(
            '-Fill',(Join-Path $PWD.Path 'filling'),
            '-Shelf',(Join-Path $PWD.Path 'shelf'),
            '-Batch','${{ github.run_id }}',
            '-Try','${{ github.run_attempt }}'
          )
          if('${{ inputs.fresh_batch }}'-eq'true'){$a+='-Fresh'}
          $ps=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\mix\Tools\Bake.ps1 @a
          exit $LASTEXITCODE
