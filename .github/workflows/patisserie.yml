name: Midnight Patisserie

on:
  push:
    branches: [main]
    paths: [.github/workflows/**]
  workflow_dispatch:
    inputs:
      fresh_batch:
        description: Fresh batch
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [fresh-batch]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: midnight-patisserie-main
  cancel-in-progress: false

jobs:
  tray:
    name: Weigh tray
    runs-on: ubuntu-24.04
    outputs:
      sponge: ${{ steps.taste.outputs.sponge }}
      cream: ${{ steps.taste.outputs.cream }}
      cocoa: ${{ steps.taste.outputs.cocoa }}
      box: ${{ steps.taste.outputs.box }}
    steps:
      - name: Dust counter
        shell: pwsh
        env:
          MIX: ${{ secrets.MIX_REPO }}
          FILL: ${{ secrets.FILL_REPO }}
        run: |
          Write-Host "::add-mask::$env:MIX"
          Write-Host "::add-mask::$env:FILL"

      - name: Measure flour
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.MIX_REPO }}
          token: ${{ secrets[vars.MIX_KEY_NAME] }}
          ref: main
          path: mix
          fetch-depth: 1
          show-progress: false

      - name: Whip cream
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.FILL_REPO }}
          token: ${{ secrets[vars.FILL_KEY_NAME] }}
          ref: main
          path: filling
          fetch-depth: 1
          show-progress: false

      - name: Taste tray
        id: taste
        shell: pwsh
        run: |
          $a=@('-Fill',(Join-Path $PWD.Path 'filling'),'-Slice','Probe')
          if('${{ inputs.fresh_batch }}'-eq'true'){$a+='-Fresh'}
          & ./mix/Tools/BakeSlice.ps1 @a
          exit $LASTEXITCODE

  sponge:
    name: Sponge
    needs: tray
    if: ${{ needs.tray.outputs.sponge == 'true' }}
    uses: ./.github/workflows/sponge.yml
    secrets: inherit

  cream:
    name: Cream
    needs: tray
    if: ${{ needs.tray.outputs.cream == 'true' }}
    uses: ./.github/workflows/cream.yml
    secrets: inherit

  cocoa:
    name: Cocoa
    needs: [tray, cream]
    if: ${{ always() && needs.tray.result == 'success' && needs.tray.outputs.cocoa == 'true' && (needs.cream.result == 'success' || needs.cream.result == 'skipped') }}
    uses: ./.github/workflows/cocoa.yml
    with:
      fold: ${{ needs.tray.outputs.cream == 'true' }}
    secrets: inherit

  box:
    name: Box
    needs: [tray, sponge, cream, cocoa]
    if: >-
      ${{ always() && needs.tray.result == 'success' && needs.tray.outputs.box == 'true' &&
          (needs.sponge.result == 'success' || needs.sponge.result == 'skipped') &&
          (needs.cream.result == 'success' || needs.cream.result == 'skipped') &&
          (needs.cocoa.result == 'success' || needs.cocoa.result == 'skipped') }}
    permissions:
      contents: write
    uses: ./.github/workflows/box.yml
    with:
      fold: ${{ needs.tray.outputs.cream == 'true' && needs.tray.outputs.cocoa != 'true' }}
    secrets: inherit
