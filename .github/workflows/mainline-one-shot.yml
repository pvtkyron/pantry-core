name: One-shot mainline ref cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mainline-one-shot.yml'

permissions:
  contents: read

jobs:
  cleanup:
    if: "${{ github.event.head_commit.message == 'ops: execute mainline branch cleanup v2' }}"
    runs-on: ubuntu-24.04
    env:
      MIX_TOKEN: ${{ secrets[vars.MIX_KEY_NAME] }}
      FILL_TOKEN: ${{ secrets[vars.FILL_KEY_NAME] }}
      CORE_TOKEN: ${{ github.token }}
    steps:
      - name: Delete exact pre-verified refs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Need([string]$Name,[string]$Value){
            if([string]::IsNullOrWhiteSpace($Value)){throw "required token unavailable: $Name"}
          }
          Need 'MIX_TOKEN' $env:MIX_TOKEN
          Need 'FILL_TOKEN' $env:FILL_TOKEN

          function Gh([string]$Token,[string[]]$Args,[switch]$Allow404){
            $old=$env:GH_TOKEN
            try{
              $env:GH_TOKEN=$Token
              $out=@(& timeout 20s gh @Args 2>&1)
              $code=$LASTEXITCODE
              if($code-eq124){throw "GitHub API timeout: $($Args -join ' ')"}
              if($code-ne0){
                $msg=$out -join "`n"
                if($Allow404-and$msg-match'(?i)(HTTP 404|Not Found)'){return $null}
                throw "GitHub API command failed: $($Args -join ' ')`n$msg"
              }
              return $out
            }finally{$env:GH_TOKEN=$old}
          }
          function RefSha([string]$Repo,[string]$Branch,[string]$Token,[switch]$AllowMissing){
            $out=Gh $Token @('api',"repos/$Repo/git/ref/heads/$Branch",'--jq','.object.sha') -Allow404:$AllowMissing
            if($null-eq$out){return $null}
            return (($out) -join '').Trim()
          }
          function RequireRef([string]$Repo,[string]$Branch,[string]$Expected,[string]$Token){
            $got=RefSha $Repo $Branch $Token
            if($got-ne$Expected){throw "ref changed: $Repo $Branch expected=$Expected got=$got"}
          }
          function DeleteRef([string]$Repo,[string]$Branch,[string]$Expected,[string]$Token){
            if($Branch-eq'main'){throw 'main deletion guard tripped'}
            $got=RefSha $Repo $Branch $Token -AllowMissing
            if($null-eq$got){Write-Host "[REF/CLEAN][SKIP] already absent $Repo $Branch";return}
            if($got-ne$Expected){throw "branch head changed: $Repo $Branch expected=$Expected got=$got"}
            [void](Gh $Token @('api','--method','DELETE',"repos/$Repo/git/refs/heads/$Branch"))
            Write-Host "[REF/CLEAN][OK] $Repo $Branch"
          }
          function AssertMainOnly([string]$Repo,[string]$Token){
            $json=(Gh $Token @('api',"repos/$Repo/branches?per_page=100")) -join "`n"
            $names=@(($json|ConvertFrom-Json)|ForEach-Object{[string]$_.name})
            if($names.Count-ne1-or$names[0]-ne'main'){throw "extra branch remains in $Repo : $($names -join ', ')"}
            Write-Host "[REF/MAIN-ONLY][OK] $Repo"
          }

          RequireRef 'pvtkyron/Workspace' 'main' 'd326edc2782a024ec189e79d8b8e4db5d5070065' $env:MIX_TOKEN
          DeleteRef 'pvtkyron/Workspace' 'kyron-recovered-unified-20260919' '49af6913b6cc0d7afcc09b818d39dffabbdfc22a' $env:MIX_TOKEN
          DeleteRef 'pvtkyron/Workspace' 'kyron-unified-client-20260919' '4bcfe672a51ae473a1eab5fbb3fb6aa037178fb7' $env:MIX_TOKEN

          RequireRef 'pvtkyron/pantry' 'main' 'ca0dbf6af065087e8ba8755e8e6cac813f35e3b8' $env:FILL_TOKEN
          DeleteRef 'pvtkyron/pantry' 'net-scout-v1-20260918' 'b9c93dc6ff9c98c90bb8939f38566ce109f9d82b' $env:FILL_TOKEN

          RequireRef 'pvtkyron/cdn' 'main' 'e3e686d98ab496719e4d0368ced8ea6d7995d094' $env:MIX_TOKEN
          $cdn=@{
            'codex/kyron-9-19-cdn-20260825'='cb42b5fb7a248c051783ea5f4d987803f9fd3faa'
            'codex/kyron-9-19-origin-fix-20260825'='cb42b5fb7a248c051783ea5f4d987803f9fd3faa'
            'codex/kyron-9.21.1-scope-fix'='cb42b5fb7a248c051783ea5f4d987803f9fd3faa'
            'codex/kyron-gateway-012345678910'='cb42b5fb7a248c051783ea5f4d987803f9fd3faa'
            'kyron-9.20-kura-ui'='cb42b5fb7a248c051783ea5f4d987803f9fd3faa'
            'kyron-9.20.1-login-startup-fix'='cb42b5fb7a248c051783ea5f4d987803f9fd3faa'
            'kyron-9.20.2-popup-width-fix'='cb42b5fb7a248c051783ea5f4d987803f9fd3faa'
            'kyron-9.21-profile-login-scope'='cb42b5fb7a248c051783ea5f4d987803f9fd3faa'
            'kyron-v10-release'='cb42b5fb7a248c051783ea5f4d987803f9fd3faa'
            'kyron-suite-v10.1.0'='90a0f483e26d484f66a6fb074bc670ce5dcc95d0'
            'kyron-suite-v10.2.0'='e41872bb03c51775261470a8cf6f580fe14a6e6c'
            'kyron-suite-v11.0.0'='ebf3817b3a14cdbc71206e4320ae801899f62941'
          }
          foreach($b in $cdn.Keys){DeleteRef 'pvtkyron/cdn' $b $cdn[$b] $env:MIX_TOKEN}

          AssertMainOnly 'pvtkyron/Workspace' $env:MIX_TOKEN
          AssertMainOnly 'pvtkyron/pantry' $env:FILL_TOKEN
          AssertMainOnly 'pvtkyron/sensevity' $env:MIX_TOKEN
          AssertMainOnly 'pvtkyron/cdn' $env:MIX_TOKEN
          AssertMainOnly 'pvtkyron/pantry-core' $env:CORE_TOKEN
          Write-Host '[REF/CLEANUP][PASS] all repositories are main-only'
