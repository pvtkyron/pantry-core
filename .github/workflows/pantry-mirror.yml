name: Pantry mirror to Pantry Core

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [pantry-updated]

permissions:
  contents: write

concurrency:
  group: launcher-pantry-core-publish
  cancel-in-progress: false

jobs:
  detect:
    name: Detect unpublished Pantry state
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.delta.outputs.changed }}
      pantry_sha: ${{ steps.delta.outputs.pantry_sha }}
      published_sha: ${{ steps.delta.outputs.published_sha }}
    steps:
      - name: Open Pantry Core history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: shelf
          fetch-depth: 100
          persist-credentials: false
          show-progress: false

      - name: Open canonical Pantry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pvtkyron/pantry
          token: ${{ secrets[vars.FILL_KEY_NAME] }}
          ref: main
          path: filling
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          show-progress: false

      - name: Compare Pantry source with latest publication
        id: delta
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $pantrySha=(& git -C filling rev-parse HEAD).Trim().ToLowerInvariant()
          if($pantrySha -notmatch '^[0-9a-f]{40}$'){throw 'Pantry HEAD is invalid'}
          $published=''
          $body=@(& git -C shelf log -n 100 --format=%B)
          foreach($line in $body){
            if(([string]$line) -match '^Pantry-Source:\s*(?<sha>[0-9a-fA-F]{40})\s*$'){$published=$Matches.sha.ToLowerInvariant();break}
          }
          $changed=$pantrySha -ne $published
          "pantry_sha=$pantrySha" >> $env:GITHUB_OUTPUT
          "published_sha=$published" >> $env:GITHUB_OUTPUT
          "changed=$($changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if($changed){Write-Host "[PANTRY-MIRROR][DIRTY] pantry=$pantrySha published=$published"}
          else{Write-Host "[PANTRY-MIRROR][CURRENT] pantry=$pantrySha"}

  publish:
    name: Prepare verify and publish full Pantry snapshot
    needs: detect
    if: ${{ needs.detect.outputs.changed == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      KYRON_PANTRY_SIGNER_PROFILE: local-machine-v1
      KYRON_SERIAL_BUILD: '1'
      ANDROID_NDK_HOME: ''
      ANDROID_NDK_ROOT: ''
      NDK_ROOT: ''
    steps:
      - name: Open Pantry Core publish target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: shelf
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Open canonical Workspace publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pvtkyron/Workspace
          token: ${{ secrets[vars.MIX_KEY_NAME] }}
          ref: main
          path: source
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: true
          show-progress: false

      - name: Open exact Pantry revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pvtkyron/pantry
          token: ${{ secrets[vars.FILL_KEY_NAME] }}
          ref: ${{ needs.detect.outputs.pantry_sha }}
          path: filling
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: true
          show-progress: false

      - name: Bind canonical main branches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($repo in @('source','filling','shelf')){
            & git -C $repo checkout -q -B main HEAD
            if($LASTEXITCODE){throw "main binding rejected: $repo"}
          }
          $actual=(& git -C filling rev-parse HEAD).Trim().ToLowerInvariant()
          if($actual -ne '${{ needs.detect.outputs.pantry_sha }}'){throw "Pantry pin mismatch: $actual"}

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bind Java into canonical Workspace SDK
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          . .\source\scripts\workspace-common.ps1
          $sdk=Resolve-WorkspaceSdkRoot
          $javaHome=[IO.Path]::GetFullPath($env:JAVA_HOME)
          if(!(Test-WorkspaceJava $javaHome)){throw "setup-java produced an invalid JDK: $javaHome"}
          $javaRoot=Join-Path $sdk 'Java';New-Item -ItemType Directory -Force -Path $javaRoot|Out-Null
          foreach($name in @('17.0.20','current')){
            $target=Join-Path $javaRoot $name
            if(Test-WorkspaceJava $target){continue}
            if(Test-Path -LiteralPath $target){Remove-Item -LiteralPath $target -Recurse -Force}
            New-Item -ItemType Junction -Path $target -Target $javaHome|Out-Null
          }
          $canonical=Join-Path $javaRoot 'current'
          if(!(Test-WorkspaceJava $canonical)){throw 'Canonical Java binding failed'}
          "JAVA_HOME=$canonical" >> $env:GITHUB_ENV
          Write-Host "[PANTRY-MIRROR][JAVA][OK] $canonical"

      - name: Restore minimal Android surface
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            D:\kyron-sdk\Android
          key: pantry-mirror-android-v1-${{ runner.os }}-${{ hashFiles('source/toolchains.lock.json') }}

      - name: Restore Pantry Python
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            D:\kyron-sdk\Python
          key: pantry-publisher-python-v3-${{ runner.os }}-${{ hashFiles('source/toolchains.lock.json') }}

      - name: Materialize minimal Android build surface
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          . .\source\scripts\workspace-common.ps1
          $sdk=Resolve-WorkspaceSdkRoot
          & .\source\scripts\setup-android-minimal.ps1 -SdkRoot $sdk
          if(!$?){throw 'Minimal Android surface setup failed'}
          $android=Join-Path $sdk 'Android\sdk'
          foreach($leaf in @('platforms\android-34\android.jar','build-tools\34.0.0\d8.bat','build-tools\34.0.0\lib\d8.jar')){
            if(!(Test-Path -LiteralPath (Join-Path $android $leaf) -PathType Leaf)){throw "Minimal Android surface missing: $leaf"}
          }
          "ANDROID_HOME=$android" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$android" >> $env:GITHUB_ENV
          "KYRON_ANDROID_SDK=$android" >> $env:GITHUB_ENV
          Write-Host "[PANTRY-MIRROR][ANDROID][OK] $android"

      - name: Materialize canonical Pantry signer
        shell: pwsh
        env:
          CREAM_A: ${{ secrets.KYRON_PANTRY_LOCAL_BOOTSTRAP_PRIVATE_PEM }}
          CREAM_B: ${{ secrets.KYRON_PANTRY_LOCAL_BOOTSTRAP_PUBLIC_PEM }}
          JAM_A: ${{ secrets.KYRON_PANTRY_LOCAL_CONTENT_PRIVATE_PEM }}
          JAM_B: ${{ secrets.KYRON_PANTRY_LOCAL_CONTENT_PUBLIC_PEM }}
        run: |
          $ErrorActionPreference='Stop'
          foreach($n in @('CREAM_A','CREAM_B','JAM_A','JAM_B')){
            if([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($n))){throw "canonical local Pantry signer input missing: $n"}
          }
          . .\source\scripts\workspace-common.ps1
          $root=Join-Path (Get-WorkspaceDataRoot) 'SigningKeys\PantryLocal\v1'
          New-Item -ItemType Directory -Force -Path $root|Out-Null
          $utf8=[Text.UTF8Encoding]::new($false)
          foreach($x in @(@('bootstrap_root_private.pem','CREAM_A'),@('bootstrap_root_public.pem','CREAM_B'),@('content_private.pem','JAM_A'),@('content_public.pem','JAM_B'))){
            [IO.File]::WriteAllText((Join-Path $root $x[0]),([Environment]::GetEnvironmentVariable($x[1])).Trim()+"`n",$utf8)
          }
          & .\source\PantryPublisher\Initialize-LocalPantrySigner.ps1 -PantryPath (Join-Path $PWD.Path 'filling') -Workspace (Join-Path $PWD.Path 'source') -ExpectedProfile local-machine-v1 -Ephemeral -RequireExistingIdentity|Out-Null
          if(!$?){throw 'Canonical local Pantry signer validation failed'}

      - name: Prepare and publish current Pantry without rebuilding artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $pantry=Join-Path $PWD.Path 'filling';$core=Join-Path $PWD.Path 'shelf';$runId=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          & .\source\PantryPublisher\Prepare-PantryCore.ps1 -PantryPath $pantry -PantryCorePath $core -RuntimeChannel both -ArtifactPlan both -RunId $runId -RunAttempt ([int]'${{ github.run_attempt }}') -PrepareOnly -SkipArtifactPromotion
          if(!$?){throw 'Full current-Pantry preparation failed'}
          & .\source\PUBLISH_PANTRY_CORE.bat -PantryPath $pantry -PantryCorePath $core -RuntimeChannel both
          if($LASTEXITCODE){throw "Pantry Core publish failed: rc=$LASTEXITCODE"}
          & git -C $core fetch --quiet origin main
          if($LASTEXITCODE){throw 'Pantry Core remote verification fetch failed'}
          $message=(& git -C $core show -s --format=%B refs/remotes/origin/main) -join "`n"
          if($message -notmatch ('(?m)^Pantry-Source:\s*'+[regex]::Escape('${{ needs.detect.outputs.pantry_sha }}')+'\s*$')){throw 'Published Pantry-Source does not match detected Pantry revision'}
          Write-Host "[PANTRY-MIRROR][PUBLISHED][OK] source=${{ needs.detect.outputs.pantry_sha }}"

      - name: Remove ephemeral Pantry signer
        if: ${{ always() }}
        shell: pwsh
        run: |
          if(Test-Path '.\source\scripts\workspace-common.ps1'){
            . .\source\scripts\workspace-common.ps1
            $root=Join-Path (Get-WorkspaceDataRoot) 'SigningKeys\PantryLocal\v1'
            foreach($name in @('bootstrap_root_private.pem','content_private.pem')){
              $path=Join-Path $root $name
              if(Test-Path -LiteralPath $path -PathType Leaf){[IO.File]::WriteAllBytes($path,(New-Object byte[] ((Get-Item -LiteralPath $path).Length)))}
            }
            if(Test-Path -LiteralPath $root -PathType Container){Remove-Item -LiteralPath $root -Recurse -Force}
          }

  current:
    name: Pantry already published
    needs: detect
    if: ${{ needs.detect.outputs.changed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Pantry ${{ needs.detect.outputs.pantry_sha }} is already the latest published Pantry-Source."
