name: Pantry mirror to Pantry Core
run-name: Pantry mirror ${{ inputs.pantry_sha || 'main' }}
'on':
  workflow_call:
    inputs:
      pantry_sha:
        description: Exact Pantry commit to mirror
        required: true
        type: string
      delivery_run_id:
        description: Pantry Core run that uploaded the encrypted prepared delivery
        required: false
        default: ''
        type: string
      delivery_run_attempt:
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      pantry_sha:
        description: Exact Pantry commit to mirror; blank means Pantry main
        required: false
        default: ''
        type: string
      delivery_run_id:
        description: Pantry Core run that uploaded the encrypted prepared delivery
        required: false
        default: ''
        type: string
      delivery_run_attempt:
        required: false
        default: ''
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: pantry-core-main-publisher
  cancel-in-progress: false
jobs:
  detect:
    name: Resolve Pantry source
    runs-on: ubuntu-latest
    outputs:
      pantry_sha: ${{ steps.source.outputs.pantry_sha }}
      needs_publish: ${{ steps.compare.outputs.needs_publish }}
      delivery_pending: ${{ steps.prepared.outputs.pending }}
    steps:
    - name: Open pinned Workspace and integrated distribution
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ secrets.MIX_REPO }}
        token: ${{ secrets[vars.MIX_KEY_NAME] }}
        ref: ${{ inputs.pantry_sha || 'main' }}
        path: source
        fetch-depth: 1
        fetch-tags: false
        persist-credentials: true
        show-progress: false
        sparse-checkout: |
          /Distribution/SrcVersion.ini
        sparse-checkout-cone-mode: false
    - name: Resolve Pantry source
      id: source
      shell: bash
      run: |
        set -euo pipefail
        sha="$(git -C source/Distribution rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
        [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
        echo "pantry_sha=$sha" >> "$GITHUB_OUTPUT"
        echo "[PANTRY-MIRROR][READY] source=$sha"
    - name: Compare current published Pantry source
      id: compare
      shell: bash
      env:
        GH_TOKEN: ${{ secrets[vars.FILL_KEY_NAME] }}
        DELIVERY_RUN_ID: ${{ inputs.delivery_run_id }}
      run: |
        set -euo pipefail
        GH_TOKEN="${GH_TOKEN#"${GH_TOKEN%%[!$' \t\r\n']*}"}"
        GH_TOKEN="${GH_TOKEN#$'\ufeff'}"
        GH_TOKEN="${GH_TOKEN#"${GH_TOKEN%%[!$' \t\r\n']*}"}"
        GH_TOKEN="${GH_TOKEN%"${GH_TOKEN##*[!$' \t\r\n']}"}"
        [[ "$GH_TOKEN" =~ ^[!-~]+$ ]] || { echo '::error::Configured GitHub credential format rejected'; exit 1; }
        export GH_TOKEN
        source_sha="${{ steps.source.outputs.pantry_sha }}"
        published="$(
          gh api "repos/pvtkyron/pantry-core/commits?sha=main&per_page=50" \
            --jq '[.[] | .commit.message | capture("Pantry-Source: (?<sha>[0-9a-f]{40})")? | select(.sha != null) | .sha][0] // ""'
        )"
        if [[ "$published" == "$source_sha" ]]; then
          echo "needs_publish=false" >> "$GITHUB_OUTPUT"
          echo "[PANTRY-MIRROR][NOOP] requested source is already published"
        elif [[ -z "$DELIVERY_RUN_ID" && "$published" =~ ^[0-9a-f]{40}$ ]]; then
          git -C source fetch --quiet --no-tags --depth=1 origin "$published"
          if git -C source diff --quiet "$published" "$source_sha" -- Distribution/ ':(exclude)Distribution/release/pantry-core-route-state.ini'; then
            echo "needs_publish=false" >> "$GITHUB_OUTPUT"
            echo "[PANTRY-MIRROR][NOOP] Distribution inputs are already published"
          else
            code=$?
            [[ "$code" -eq 1 ]] || exit "$code"
            echo "needs_publish=true" >> "$GITHUB_OUTPUT"
            echo "[PANTRY-MIRROR][PUBLISH] Distribution inputs changed"
          fi
        else
          echo "needs_publish=true" >> "$GITHUB_OUTPUT"
          echo "[PANTRY-MIRROR][PUBLISH] no prior source receipt"
        fi
    - name: Check prepared delivery readiness
      id: prepared
      shell: bash
      env:
        NEEDS_PUBLISH: ${{ steps.compare.outputs.needs_publish }}
        DELIVERY_RUN_ID: ${{ inputs.delivery_run_id }}
        DELIVERY_RUN_ATTEMPT: ${{ inputs.delivery_run_attempt }}
      run: |
        set -euo pipefail
        if [[ -z "$DELIVERY_RUN_ID" && -z "$DELIVERY_RUN_ATTEMPT" && "$NEEDS_PUBLISH" != true ]]; then
          echo 'pending=false' >> "$GITHUB_OUTPUT"
        elif [[ -z "$DELIVERY_RUN_ID" && -z "$DELIVERY_RUN_ATTEMPT" ]]; then
          echo 'pending=true' >> "$GITHUB_OUTPUT"
          echo '[PANTRY-MIRROR][WAIT] authenticated prepared delivery producer is required; publication remains skipped'
          echo 'Publication is pending: provide the run and attempt that uploaded the authenticated prepared delivery, or request a full release.' >> "$GITHUB_STEP_SUMMARY"
        else
          [[ "$DELIVERY_RUN_ID" =~ ^[1-9][0-9]{0,19}$ && "$DELIVERY_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]] || { echo '::error::Prepared delivery producer identity rejected'; exit 1; }
          echo 'pending=false' >> "$GITHUB_OUTPUT"
        fi
    if: ${{ github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' }}
  publish:
    name: Prepare verify and publish full Pantry snapshot
    needs: detect
    if: ${{ github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' && (needs.detect.outputs.needs_publish
      == 'true') && needs.detect.outputs.delivery_pending != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - name: Open route state checkpoint recipe
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        path: recipe
        fetch-depth: 1
        persist-credentials: false
        show-progress: false
        sparse-checkout: .github
        sparse-checkout-cone-mode: false
    - name: Recheck source after acquiring the publication lane
      id: current
      shell: bash
      env:
        GH_TOKEN: ${{ secrets[vars.FILL_KEY_NAME] }}
        SOURCE_SHA: ${{ needs.detect.outputs.pantry_sha }}
      run: |
        set -euo pipefail
        GH_TOKEN="${GH_TOKEN#"${GH_TOKEN%%[!$' \t\r\n']*}"}"
        GH_TOKEN="${GH_TOKEN#$'\ufeff'}"
        GH_TOKEN="${GH_TOKEN#"${GH_TOKEN%%[!$' \t\r\n']*}"}"
        GH_TOKEN="${GH_TOKEN%"${GH_TOKEN##*[!$' \t\r\n']}"}"
        [[ "$GH_TOKEN" =~ ^[!-~]+$ ]] || { echo '::error::Configured GitHub credential format rejected'; exit 1; }
        export GH_TOKEN
        published="$(gh api "repos/pvtkyron/pantry-core/commits?sha=main&per_page=50" --jq '[.[] | .commit.message | capture("Pantry-Source: (?<sha>[0-9a-f]{40})")? | select(.sha != null) | .sha][0] // ""')"
        if [[ "$published" == "$SOURCE_SHA" ]]; then
          echo "needs_publish=false" >> "$GITHUB_OUTPUT"
          echo '[PANTRY-MIRROR][NOOP] another publisher completed this source'
        else
          echo "needs_publish=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Open Pantry Core Kyron publish target
      if: ${{ steps.current.outputs.needs_publish == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ secrets[vars.FILL_KEY_NAME] }}
      run: |
        set -euo pipefail
        GH_TOKEN="${GH_TOKEN#"${GH_TOKEN%%[!$' \t\r\n']*}"}"
        GH_TOKEN="${GH_TOKEN#$'\ufeff'}"
        GH_TOKEN="${GH_TOKEN#"${GH_TOKEN%%[!$' \t\r\n']*}"}"
        GH_TOKEN="${GH_TOKEN%"${GH_TOKEN##*[!$' \t\r\n']}"}"
        [[ "$GH_TOKEN" =~ ^[!-~]+$ ]] || { echo '::error::Configured GitHub credential format rejected'; exit 1; }
        export GH_TOKEN
        rm -rf shelf
        git init shelf
        git -C shelf remote add origin "https://github.com/pvtkyron/pantry-core.git"
        gh auth setup-git
        git -C shelf fetch --filter=blob:none --no-tags --depth=1 origin main
        git -C shelf sparse-checkout init --no-cone
        printf '/kyron/\n' > shelf/.git/info/sparse-checkout
        git -C shelf checkout -B main FETCH_HEAD
        git -C shelf config gc.auto 0
        git -C shelf status --short
    - name: Open pinned Workspace and integrated distribution
      if: ${{ steps.current.outputs.needs_publish == 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ secrets.MIX_REPO }}
        token: ${{ secrets[vars.MIX_KEY_NAME] }}
        ref: ${{ needs.detect.outputs.pantry_sha }}
        path: source
        fetch-depth: 1
        fetch-tags: false
        persist-credentials: true
        show-progress: false
        sparse-checkout: |
          /*
        sparse-checkout-cone-mode: false
    - name: Install Python 3.12
      if: ${{ steps.current.outputs.needs_publish == 'true' }}
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install verified Pantry Python dependencies
      if: ${{ steps.current.outputs.needs_publish == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        requirements="source/Distribution/tools/requirements-launch.txt"
        test -s "$requirements"
        python -m pip install --disable-pip-version-check --no-input -r "$requirements"
        deps_sha="$(sha256sum "$requirements" | awk '{print $1}')"
        [[ "$deps_sha" =~ ^[0-9a-f]{64}$ ]]
        echo "KYRON_PANTRY_DEPENDENCIES_VERIFIED_SHA256=$deps_sha" >> "$GITHUB_ENV"
        python -c 'import cryptography,lz4'
        echo "[PANTRY-MIRROR][PYTHON][OK] requirements=$deps_sha"
    - name: Verify prepared delivery producer
      if: ${{ steps.current.outputs.needs_publish == 'true' }}
      id: producer
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DELIVERY_RUN_ID: ${{ inputs.delivery_run_id }}
        DELIVERY_RUN_ATTEMPT: ${{ inputs.delivery_run_attempt }}
      run: |
        set -euo pipefail
        [[ "$DELIVERY_RUN_ID" =~ ^[1-9][0-9]{0,19}$ && "$DELIVERY_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]] || { echo '::error::Encrypted prepared delivery producer is required'; exit 1; }
        producer="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DELIVERY_RUN_ID")"
        jq -e --arg repo "$GITHUB_REPOSITORY" --argjson attempt "$DELIVERY_RUN_ATTEMPT" '
          .repository.full_name == $repo and .head_repository.full_name == $repo and .head_branch == "main"
          and .run_attempt == $attempt
          and (.event | IN("push","workflow_dispatch","repository_dispatch","schedule"))
          and (.path | IN(".github/workflows/patisserie.yml",".github/workflows/launcher-publish.yml",".github/workflows/project-workspace.yml"))
        ' <<<"$producer" >/dev/null || { echo '::error::Prepared delivery producer context rejected'; exit 1; }
        gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DELIVERY_RUN_ID/attempts/$DELIVERY_RUN_ATTEMPT/jobs?per_page=100" --jq '
          [.jobs[] | select(.conclusion == "success") | .steps[] | select(.name == "Upload encrypted prepared delivery" and .conclusion == "success")] | length > 0
        ' | grep -Fxq true
        echo '[PANTRY-MIRROR][PRODUCER][OK] canonical main workflow and completed prepared artifact upload'
    - name: Download encrypted prepared delivery
      if: ${{ steps.current.outputs.needs_publish == 'true' }}
      uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: ${{ inputs.delivery_run_id }}
        name: kyron-workspace-delivery-${{ inputs.delivery_run_id }}-${{ inputs.delivery_run_attempt }}
        path: prepared
    - name: Restore only authenticated generated delivery outputs
      if: ${{ steps.current.outputs.needs_publish == 'true' }}
      shell: bash
      env:
        KYRON_HANDOFF_SECRET: ${{ secrets[vars.MIX_KEY_NAME] }}
        SOURCE_SHA: ${{ needs.detect.outputs.pantry_sha }}
      run: |
        set -euo pipefail
        mapfile -t packages < <(find prepared -type f -name '*.bin')
        [[ "${#packages[@]}" == 1 ]] || { echo '::error::Prepared delivery package count rejected'; exit 1; }
        python recipe/.github/scripts/restore_prepared_delivery.py --input "${packages[0]}" --source source --source-sha "$SOURCE_SHA"
    - name: Verify pinned Pantry and full source roots
      if: ${{ steps.current.outputs.needs_publish == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        actual="$(git -C source/Distribution rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
        test "$actual" = "${{ needs.detect.outputs.pantry_sha }}"
        for root in lua assest Font img lib client auth tools tests; do
          test -d "source/Distribution/$root" || { echo "::error::Pantry source root missing: $root"; exit 1; }
        done
        test -s source/Distribution/lib/libkyron.so
        test -s source/Distribution/lib/libkyron64.so
        test -s source/Distribution/client/Bootstrap.exe
        test -s source/Distribution/client/Launcher.exe
        grep -F 'AUTO_ROUTE_BEGIN="; pantry-auto-content-routes:begin"' source/Distribution/tools/rotate_runtime_routes.py >/dev/null
        grep -F 'GENERIC_ROUTE_ROOTS=(' source/Distribution/tools/rotate_runtime_routes.py >/dev/null
        grep -F 'CLIENT_SOURCE="client/launch-plane-only.marker"' source/Distribution/tools/rotate_runtime_routes.py >/dev/null
        grep -F '"client_record":addressed("policy","launcher-disabled"' source/Distribution/tools/rotate_runtime_routes.py >/dev/null
        echo "[PANTRY-MIRROR][ROUTES][OK] generic children and client marker are content-addressed"
        lua_count="$(find source/Distribution/lua -type f | wc -l)"
        asset_count="$(find source/Distribution/assest -type f | wc -l)"
        native_count="$(find source/Distribution/lib -type f | wc -l)"
        echo "[PANTRY-MIRROR][INPUTS][OK] source=$actual lua=$lua_count assets=$asset_count native=$native_count"
    - name: Install Lua 5.3 compiler
      if: ${{ steps.current.outputs.needs_publish == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends lua5.3
        luac5.3 -v 2>&1 | grep -F 'Lua 5.3.6'
        echo "[PANTRY-MIRROR][LUA53][OK] compiler=$(command -v luac5.3)"
    - name: Install Java 17
      if: ${{ steps.current.outputs.needs_publish == 'true' }}
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Install Android command-line tools
      if: ${{ steps.current.outputs.needs_publish == 'true' }}
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
    - name: Ensure Pantry Android compile surface
      if: ${{ steps.current.outputs.needs_publish == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        android_home="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        sdkmanager="$android_home/cmdline-tools/latest/bin/sdkmanager"
        if [[ ! -x "$sdkmanager" ]]; then
          sdkmanager="$(find "$android_home/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n 1)"
        fi
        [[ -n "$sdkmanager" && -x "$sdkmanager" ]] || { echo "::error::sdkmanager not found under $android_home/cmdline-tools"; exit 1; }
        yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
        "$sdkmanager" "platforms;android-34" "build-tools;34.0.0"
        test -f "$android_home/platforms/android-34/android.jar"
        test -f "$android_home/build-tools/34.0.0/lib/d8.jar"
        echo "ANDROID_HOME=$android_home" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$android_home" >> "$GITHUB_ENV"
        echo "[PANTRY-MIRROR][ANDROID][OK] home=$android_home sdkmanager=$sdkmanager"
    - name: Materialize signer public keys
      if: ${{ steps.current.outputs.needs_publish == 'true' }}
      id: signer
      shell: bash
      env:
        ROOT_PUBLIC: ${{ secrets.KYRON_PANTRY_LOCAL_BOOTSTRAP_PUBLIC_PEM }}
        CONTENT_PUBLIC: ${{ secrets.KYRON_PANTRY_LOCAL_CONTENT_PUBLIC_PEM }}
      run: |
        set -euo pipefail
        python - <<'PY'
        import os
        from pathlib import Path
        root=Path(os.environ["RUNNER_TEMP"])/"pantry-bootstrap-public.pem"
        content=Path(os.environ["RUNNER_TEMP"])/"pantry-content-public.pem"
        for path,name in ((root,"ROOT_PUBLIC"),(content,"CONTENT_PUBLIC")):
            value=os.environ.get(name,"").strip()
            if "BEGIN PUBLIC KEY" not in value:
                raise SystemExit(f"{name} is missing or invalid")
            path.write_text(value+"\n",encoding="utf-8",newline="\n")
        with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
            print(f"root_public={root}",file=out)
            print(f"content_public={content}",file=out)
        PY
    - name: Reconstruct Bootstrap transport master without compiling Workspace
      if: ${{ steps.current.outputs.needs_publish == 'true' }}
      id: master
      shell: bash
      run: |
        set -euo pipefail
        master="$(python source/etc/publishing/prepare_pantry_core_legacy.py --workspace source --print-transport-master | tail -n 1 | tr -d '\r\n')"
        [[ "$master" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::transport master reconstruction failed"; exit 1; }
        echo "::add-mask::$master"
        echo "master=$master" >> "$GITHUB_OUTPUT"
        echo "[PANTRY-MIRROR][TRANSPORT][OK] Workspace read-only; no Workspace build"
    - name: Materialize frozen Bootstrap quartet provenance in the mirror snapshot
      if: ${{ steps.current.outputs.needs_publish == 'true' }}
      shell: bash
      env:
        SOURCE_SHA: ${{ needs.detect.outputs.pantry_sha }}
      run: |
        set -euo pipefail
        python - <<'PY'
        import hashlib,json,os,re
        from pathlib import Path
        root=Path("source/Distribution")
        exe=root/"client"/"Bootstrap.exe"
        report_path=root/"client"/"Bootstrap.release.json"
        marker=root/"release"/"bootstrap-v10.marker"
        provenance=root/"release"/"bootstrap-delivery-v1.json"
        source_sha=os.environ["SOURCE_SHA"].strip().lower()
        if not re.fullmatch(r"[0-9a-f]{40}",source_sha):
            raise SystemExit("[PANTRY-MIRROR][BOOTSTRAP][E] source SHA invalid")
        data=exe.read_bytes()
        report=json.loads(report_path.read_text(encoding="utf-8-sig"))
        digest=hashlib.sha256(data).hexdigest()
        cert=str(report.get("authenticode",{}).get("certificate_sha256","")).lower()
        size=len(data)
        if len(data)<2 or data[:2]!=b"MZ" or report.get("schema")!=1 or report.get("product")!="Bootstrap" or report.get("file")!="Bootstrap.exe":
            raise SystemExit("[PANTRY-MIRROR][BOOTSTRAP][E] frozen Bootstrap identity invalid")
        if str(report.get("sha256","")).lower()!=digest or report.get("signed_size")!=size or report.get("authenticode",{}).get("status")!="Valid" or not re.fullmatch(r"[0-9a-f]{64}",cert):
            raise SystemExit("[PANTRY-MIRROR][BOOTSTRAP][E] frozen Bootstrap signature/hash mismatch")
        marker.parent.mkdir(parents=True,exist_ok=True)
        marker.write_text(f"KYRON_BOOTSTRAP_V10=1\nsource=Bootstrap\nsha256={digest}\nsigned_size={size}\ncertificate_sha256={cert}\n",encoding="ascii",newline="\n")
        payload={"schema":1,"workspace_sha":source_sha,"exe_sha256":digest,"signed_size":size,"certificate_sha256":cert}
        provenance.write_text(json.dumps(payload,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8",newline="\n")
        print(f"[PANTRY-MIRROR][BOOTSTRAP][OK] source={source_sha} sha256={digest} bytes={size}")
        PY
    - name: Materialize pinned Windows ADB runtime and launch-plane marker
      if: ${{ steps.current.outputs.needs_publish == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/platform-tools_r37.0.1-win.zip"
        curl --fail --location --retry 3 --retry-delay 2 "https://dl.google.com/android/repository/platform-tools_r37.0.1-win.zip" -o "$archive"
        echo "45f4d63113e895ebde0c90f194099a4676b6ac653bd28d54314a9e022bbc1a99  $archive" | sha256sum --check -
        python - "$archive" <<'PY'
        import zipfile
        from pathlib import Path
        archive=Path(__import__("sys").argv[1])
        destination=Path("source/Distribution/client/tools/android")
        destination.mkdir(parents=True,exist_ok=True)
        names=("adb.exe","AdbWinApi.dll","AdbWinUsbApi.dll")
        with zipfile.ZipFile(archive) as z:
            for name in names:
                member="platform-tools/"+name
                data=z.read(member)
                if len(data)<2 or data[:2]!=b"MZ":
                    raise SystemExit(f"[PANTRY-MIRROR][ADB][E] invalid Windows PE: {member}")
                (destination/name).write_bytes(data)
        marker=Path("source/Distribution/client/launch-plane-only.marker")
        marker.parent.mkdir(parents=True,exist_ok=True)
        marker.touch(exist_ok=True)
        print("[PANTRY-MIRROR][ADB][OK] pinned Google Platform-Tools 37.0.1 Windows trio and empty launch-plane marker materialized")
        PY
    - name: Prepare and publish Pantry directly
      if: ${{ steps.current.outputs.needs_publish == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ secrets[vars.FILL_KEY_NAME] }}
        KYRON_PANTRY_SIGNER_PROFILE: local-machine-v1
        KYRON_RESOURCE_ROTATION_ENABLED: ${{ vars.KYRON_RESOURCE_ROTATION_ENABLED || '0' }}
        KYRON_RESOURCE_ROUTE_GENERATION: ${{ vars.KYRON_RESOURCE_ROUTE_GENERATION || '' }}
        KYRON_RESOURCE_ROUTE_HMAC_KEY_HEX: ${{ secrets.KYRON_RESOURCE_ROUTE_HMAC_KEY_HEX }}
        KYRON_BOOTSTRAP_ROOT_PRIVATE_PEM: ${{ secrets.KYRON_PANTRY_LOCAL_BOOTSTRAP_PRIVATE_PEM }}
        KYRON_CONTENT_PRIVATE_PEM: ${{ secrets.KYRON_PANTRY_LOCAL_CONTENT_PRIVATE_PEM }}
        KYRON_BOOTSTRAP_ROOT_PUBLIC_PEM: ${{ steps.signer.outputs.root_public }}
        KYRON_CONTENT_PUBLIC_PEM: ${{ steps.signer.outputs.content_public }}
        KYRON_LAUNCH_CAPSULE_MASTER_HEX: ${{ steps.master.outputs.master }}
        KYRON_ANDROID_PLATFORM: android-34
        KYRON_ANDROID_BUILD_TOOLS: 34.0.0
      run: |
        set -euo pipefail
        GH_TOKEN="${GH_TOKEN#"${GH_TOKEN%%[!$' \t\r\n']*}"}"
        GH_TOKEN="${GH_TOKEN#$'\ufeff'}"
        GH_TOKEN="${GH_TOKEN#"${GH_TOKEN%%[!$' \t\r\n']*}"}"
        GH_TOKEN="${GH_TOKEN%"${GH_TOKEN##*[!$' \t\r\n']}"}"
        [[ "$GH_TOKEN" =~ ^[!-~]+$ ]] || { echo '::error::Configured GitHub credential format rejected'; exit 1; }
        export GH_TOKEN
        python source/Distribution/tools/prepare_snapshot.py \
          --source source/Distribution \
          --cdn shelf \
          --source-sha "${{ needs.detect.outputs.pantry_sha }}" \
          --run-id "$(date -u +%s%3N)" \
          --run-attempt "$GITHUB_RUN_ATTEMPT" \
          --branch main
    - name: Verify published Pantry Core contract
      if: ${{ steps.current.outputs.needs_publish == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        git -C shelf fetch --quiet --force origin main
        remote="$(git -C shelf rev-parse refs/remotes/origin/main)"
        message="$(git -C shelf show -s --format=%B "$remote")"
        grep -Fxq "Pantry-Source: ${{ needs.detect.outputs.pantry_sha }}" <<<"$message"
        grep -Fxq "History-Mode: root-only" <<<"$message"
        git -C shelf cat-file -e "$remote:.github/workflows/patisserie.yml"
        test "$(git -C shelf rev-list --parents -n 1 "$remote" | wc -w | tr -d ' ')" -eq 1
        tracked="$(git -C shelf ls-tree -r --name-only "$remote" | wc -l | tr -d ' ')"
        refreshed="$(git -C shelf diff-tree --root --no-commit-id --name-only -r "$remote" | wc -l | tr -d ' ')"
        test "$tracked" -gt 0
        test "$refreshed" -eq "$tracked"
        grep -Fxq "Refreshed-Paths: $tracked" <<<"$message"
        unsupported="$(git -C shelf ls-tree -r "$remote" | awk '$1!="100644" || $2!="blob" {print $4}')"
        test -z "$unsupported" || { echo "::error::root snapshot contains unsupported modes: $unsupported"; exit 1; }
        bad="$(git -C shelf ls-tree -r --name-only "$remote" kyron | grep -Ev '^kyron/[0-9a-f]{2}/[0-9a-f]{2}/[0-9a-f]{28}\.bin$' || true)"
        test -z "$bad" || { echo "::error::non-opaque Kyron path: $bad"; exit 1; }
        records="$(git -C shelf ls-tree -r --name-only "$remote" kyron | grep -Ec '^kyron/[0-9a-f]{2}/[0-9a-f]{2}/[0-9a-f]{28}\.bin$' || true)"
        test "$records" -gt 0
        echo "[PANTRY-MIRROR][PUBLISHED][OK] source=${{ needs.detect.outputs.pantry_sha }} commit=$remote records=$records refreshed=$refreshed history=1"
    - name: Checkpoint private route state
      if: ${{ steps.current.outputs.needs_publish == 'true' }}
      uses: ./recipe/.github/actions/pantry-route-state
      with:
        source_root: source/Distribution
        source_sha: ${{ needs.detect.outputs.pantry_sha }}
    - name: Remove temporary signer public keys
      if: ${{ always() }}
      shell: bash
      run: |
        rm -f "$RUNNER_TEMP/pantry-bootstrap-public.pem" "$RUNNER_TEMP/pantry-content-public.pem"
