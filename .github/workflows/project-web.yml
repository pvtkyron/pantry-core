name: Project Web
'on':
  workflow_call:
    inputs:
      capsule:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      capsule:
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    name: Verify web project
    runs-on: ubuntu-24.04
    steps:
    - name: Open capsule helper
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        path: recipe
        fetch-depth: 1
        persist-credentials: false
        show-progress: false
        sparse-checkout: .github
        sparse-checkout-cone-mode: false
    - name: Open private web state
      id: state
      uses: ./recipe/.github/actions/private-capsule
      with:
        mode: open
        key: ${{ secrets[vars.MIX_KEY_NAME] }}
        capsule: ${{ inputs.capsule }}
        project: web
    - name: Open private web project
      uses: actions/checkout@v6
      with:
        repository: ${{ steps.state.outputs.repo }}
        token: ${{ secrets[vars.MIX_KEY_NAME] }}
        ref: ${{ steps.state.outputs.ref }}
        path: source
        fetch-depth: 1
        fetch-tags: false
        persist-credentials: false
        show-progress: false
        sparse-checkout: |
          kyron-suite
    - name: Set Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Verify web project quietly
      shell: pwsh
      run: |-
        $log=Join-Path $env:RUNNER_TEMP 'project-web.log'
        $source=Join-Path $PWD.Path 'source'
        $packages=@(Get-ChildItem -LiteralPath $source -Filter package.json -File -Recurse -ErrorAction Stop | Where-Object {
          try{
            $pkg=Get-Content -LiteralPath $_.FullName -Raw|ConvertFrom-Json
            $pkg.scripts -and ![string]::IsNullOrWhiteSpace([string]$pkg.scripts.build) -and ![string]::IsNullOrWhiteSpace([string]$pkg.scripts.test)
          }catch{$false}
        })
        if($packages.Count-ne1){throw "web project root rejected count=$($packages.Count)"}
        $dir=$packages[0].Directory.FullName
        try{
          Push-Location $dir
          & npm run build *>&1 | Set-Content -LiteralPath $log
          if($LASTEXITCODE){throw 'web build rejected'}
          & npm test *>&1 | Add-Content -LiteralPath $log
          if($LASTEXITCODE){throw 'web tests rejected'}
          $installed=$false
          for($attempt=1;$attempt-le3;$attempt++){
            & npm install --global wrangler@4.127.1 --fetch-retries=3 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=15000 *>&1 | Add-Content -LiteralPath $log
            if($LASTEXITCODE -eq 0){$installed=$true;break}
            if($attempt-lt3){Start-Sleep -Seconds (5*$attempt)}
          }
          if(!$installed){throw 'worker tool install rejected after bounded network retries'}
          & wrangler --version *>&1 | Add-Content -LiteralPath $log
          if($LASTEXITCODE){throw 'worker CLI verification rejected'}
          & wrangler deploy --config worker/wrangler.jsonc --dry-run *>&1 | Add-Content -LiteralPath $log
          if($LASTEXITCODE){throw 'worker dry-run rejected'}
          Write-Host '[PROJECT/WEB][OK]'
        }catch{
          Write-Host ("[PROJECT/WEB][FAIL] "+$_.Exception.Message)
          if(Test-Path $log){Get-Content -LiteralPath $log -Tail 200}
          exit 1
        }finally{
          Pop-Location -ErrorAction SilentlyContinue
          if(Test-Path $log){Remove-Item $log -Force -ErrorAction SilentlyContinue}
        }
    if: ${{ github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' }}
