name: KYRON Standalone Native Cpp Preflight
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cpp-source:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          Launcher/jni
          Launcher/build
          Shared
          common
        repository: ${{ secrets.MIX_REPO }}
        token: ${{ secrets[vars.MIX_KEY_NAME] }}
        ref: ${{ github.event.client_payload.workspace_sha || 'main' }}
    - name: Check ClientMode C++20 via hosted Windows MSVC
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $vswhere=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
        if(!(Test-Path -LiteralPath $vswhere)){throw 'MSVC discovery unavailable'}
        $vs=(& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
        if([string]::IsNullOrWhiteSpace($vs)){throw 'MSVC toolchain unavailable'}
        $dev=Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
        $bat=Join-Path $env:RUNNER_TEMP 'kyron-native-clientmode-preflight.cmd'
        $src=Join-Path $PWD.Path 'Launcher\jni\runtime\client\ClientMode.cpp'
        $root=Join-Path $PWD.Path 'Launcher\jni'
        $includes=@(
          $root,(Join-Path $root 'Shared\include'),(Join-Path $root 'security\include'),
          (Join-Path $root 'SharedCore\include'),(Join-Path $root 'include'),
          (Join-Path $root 'build'),(Join-Path $root 'vendor'),
          (Join-Path $root 'vendor\ImGui'),(Join-Path $PWD.Path 'Shared')
        ) | ForEach-Object { '/I"'+$_+'"' }
        $line='cl.exe /nologo /Zs /std:c++20 /EHsc /GR- /permissive- /utf-8 /W1 /DWIN32_LEAN_AND_MEAN /DNOMINMAX /DUNICODE /D_UNICODE /DHYPER_BUILD_REVISION=26081006 '+($includes -join ' ')+' "'+$src+'"'
        $text=(@('@echo off',('call "'+$dev+'" -arch=amd64 -host_arch=amd64 >nul'),'if errorlevel 1 exit /b %errorlevel%',$line,'exit /b %errorlevel%') -join [Environment]::NewLine)+[Environment]::NewLine
        [IO.File]::WriteAllText($bat,$text,[Text.Encoding]::ASCII)
        & cmd.exe /d /c ('"'+$bat+'"')
        if($LASTEXITCODE -ne 0){throw 'Native ClientMode C++ syntax/type preflight failed'}
        Write-Host '[KYRON][STANDALONE][NATIVE-CPP-SOURCE][OK]'
    if: ${{ github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' }}
