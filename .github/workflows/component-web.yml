name: Component · Web

on:
  workflow_dispatch:
  repository_dispatch:
    types: [component-web]

permissions:
  contents: read

concurrency:
  group: component-web
  cancel-in-progress: true

jobs:
  sources:
    name: Pin source batch
    uses: ./.github/workflows/source-pin-component.yml
    secrets: inherit

  web:
    name: Web only
    needs: sources
    if: ${{ needs.sources.result == 'success' }}
    uses: ./.github/workflows/project-web.yml
    with:
      capsule: ${{ needs.sources.outputs.capsule }}
    secrets: inherit