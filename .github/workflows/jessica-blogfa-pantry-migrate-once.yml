name: Jessica • Blogfa pantry-core migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/jessica-blogfa-pantry-migrate-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Point Blogfa runtime to pantry-core main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files=[
            'assets/blogfa-bootstrap.js',
            'assets/blogfa-supervisor.js',
            'assets/blogfa-widget.js',
            'assets/blogfa-widget-v2.js',
            'assets/blogfa-widget-v3.js',
            'assets/blogfa-live2d-addon.js',
            'assets/blogfa-responsive.js',
          ]
          for name in files:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=s.replace("REPO='Live2dOnWebv1.0.0'","REPO='pantry-core'")
              s=s.replace('@master/','@main/')
              s=s.replace('?ref=master','?ref=main')
              s=s.replace('/commits/master','/commits/main')
              s=s.replace("jd('master'","jd('main'")
              s=s.replace("sha||'master'","sha||'main'")
              s=s.replace("'master fallback'","'main fallback'")
              s=s.replace("{name:'master'","{name:'main'")
              s=s.replace("'jsdelivr-master'","'jsdelivr-main'")
              s=s.replace("jd('master',p)","jd('main',p)")
              s=s.replace("jd('master','')","jd('main','')")
              s=s.replace('/Live2dOnWebv1.0.0/','/pantry-core/')
              s=s.replace('Live2dOnWebv1\\.0\\.0@','pantry-core@')
              p.write_text(s,encoding='utf-8')
          bad=[]
          for name in files:
              s=Path(name).read_text(encoding='utf-8')
              if 'Live2dOnWebv1.0.0' in s or '@master/' in s or '?ref=master' in s or '/commits/master' in s:
                  bad.append(name)
          if bad:
              raise SystemExit('stale refs remain: '+', '.join(bad))
          PY
          git diff --check
          git config user.name 'Jessica'
          git config user.email 'jessica@pantry-core.invalid'
          git add assets/blogfa-bootstrap.js assets/blogfa-supervisor.js assets/blogfa-widget.js assets/blogfa-widget-v2.js assets/blogfa-widget-v3.js assets/blogfa-live2d-addon.js assets/blogfa-responsive.js
          git diff --cached --quiet && exit 0
          git commit -m 'Jessica: point Blogfa runtime to pantry-core main'
          git push origin HEAD:main
