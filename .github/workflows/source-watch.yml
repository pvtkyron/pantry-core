name: Workspace Component Source Router
'on':
  workflow_dispatch:
    inputs:
      watch:
        description: Run the private source watcher after credential readiness succeeds
        type: boolean
        default: false
  push:
    branches:
    - main
    paths:
    - .github/workflows/source-watch.yml
    - .github/scripts/classify_workspace_change.sh
    - .github/workflows/pantry-watch.yml
    - .github/tests/test_source_watch_routing.py
    - .github/tests/test_router_large_change_lists.py
    - .github/scripts/Invoke-HostedReleaseStep.ps1
    - .github/tests/test_hosted_supersession.py
  schedule:
  - cron: 23 */6 * * *
permissions:
  contents: write
concurrency:
  group: component-source-router
  cancel-in-progress: true
jobs:
  routing-tests:
    if: ${{ github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' && (github.event_name == 'push'
      || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    name: Verify source-to-component routing
    runs-on: ubuntu-24.04
    steps:
    - name: Open router and fixtures
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false
        show-progress: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Run route fixtures
      shell: bash
      run: |
        python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
        python3 .github/tests/test_automation_requests.py
        python3 .github/tests/test_source_watch_routing.py
        python3 .github/tests/test_router_large_change_lists.py
        python3 .github/tests/test_pantry_delta_routing.py
        python3 .github/actions/pantry-route-state/test_checkpoint.py
        python3 .github/tests/test_hosted_supersession.py -v
    - name: Verify authenticated handoff rejection and round trips
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --disable-pip-version-check --no-input 'cryptography==46.0.4'
        python3 .github/tests/test_workspace_handoff.py -v
  readiness:
    if: ${{ github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' && (inputs.watch || github.event_name
      == 'schedule' || github.event_name == 'push') }}
    uses: ./.github/workflows/ci-readiness.yml
    secrets: inherit
  watch:
    needs:
    - routing-tests
    - readiness
    if: ${{ github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' && ((inputs.watch || github.event_name
      == 'schedule' || github.event_name == 'push') && needs.readiness.result == 'success') }}
    name: Route Workspace component changes
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      POLL_SECONDS: '60'
    steps:
    - name: Open Pantry Core automation recipe
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        path: recipe
        fetch-depth: 1
        persist-credentials: false
        show-progress: false
        sparse-checkout: .github
        sparse-checkout-cone-mode: false
    - name: Open pinned Workspace and integrated distribution
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ secrets.MIX_REPO }}
        token: ${{ secrets[vars.MIX_KEY_NAME] }}
        ref: ${{ 'main' }}
        path: workspace
        fetch-depth: 1
        fetch-tags: false
        persist-credentials: true
        show-progress: false
        sparse-checkout: |
          etc/config/kyron/private-projects.json
          .kyron/control/request.json
          /Distribution/SrcVersion.ini
        sparse-checkout-cone-mode: false
    - name: Read private project registry
      id: registry
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $path=Join-Path $PWD.Path 'workspace/etc/config/kyron/private-projects.json'
        if(!(Test-Path -LiteralPath $path -PathType Leaf)){throw 'private project registry unavailable'}
        $r=Get-Content -LiteralPath $path -Raw|ConvertFrom-Json
        if([int]$r.schema-ne1){throw 'private project registry schema rejected'}
        $sdk=([string]$r.projects.sdk).Trim();$web=([string]$r.projects.web).Trim()
        foreach($value in @($sdk,$web)){
          if($value-notmatch'^[^/\s]+/[^/\s]+$'){throw 'private project registry entry rejected'}
          Write-Host "::add-mask::$value"
        }
        "sdk_repo=$sdk" >> $env:GITHUB_OUTPUT
        "web_repo=$web" >> $env:GITHUB_OUTPUT
        Write-Host '[SOURCE-ROUTER][REGISTRY][OK]'
    - name: Open SDK tracker
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ steps.registry.outputs.sdk_repo }}
        token: ${{ secrets[vars.MIX_KEY_NAME] }}
        ref: main
        path: sdk
        fetch-depth: 1
        fetch-tags: false
        persist-credentials: true
        show-progress: false
        sparse-checkout: |
          sdk/ANO_SDK.hpp
        sparse-checkout-cone-mode: false
    - name: Open Web tracker
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ steps.registry.outputs.web_repo }}
        token: ${{ secrets[vars.MIX_KEY_NAME] }}
        ref: main
        path: web
        fetch-depth: 1
        fetch-tags: false
        persist-credentials: true
        show-progress: false
        sparse-checkout: |
          kyron-suite/v11.5.0/package.json
        sparse-checkout-cone-mode: false
    - name: Route component changes
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        dispatch_api='repos/pvtkyron/pantry-core/dispatches'

        source_head() {
          local root="$1" sha attempt
          for attempt in 1 2 3 4 5; do
            if git -C "$root" fetch --quiet --no-tags --prune origin '+refs/heads/main:refs/remotes/origin/main'; then
              sha="$(git -C "$root" rev-parse refs/remotes/origin/main 2>/dev/null | tr '[:upper:]' '[:lower:]')"
              if [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
                printf '%s\n' "$sha"
                return 0
              fi
            fi
            sleep $((attempt * 2))
          done
          echo "::error title=Component source router::unable to resolve ${root}/main" >&2
          return 1
        }

        workspace_changes() {
          local before="$1" after="$2" changed
          if changed="$(git -C workspace diff --name-only "$before" "$after" --)"; then
            printf '%s\n' "$changed"
            return 0
          fi
          echo '[SOURCE-ROUTER][WORKSPACE/REFRESH] comparison unavailable; refreshing both exact revisions' >&2
          if ! git -C workspace fetch --quiet --no-tags origin "$before" "$after" 1>/dev/null; then
            echo '::error title=Component source router::exact Workspace revision refresh failed; source cursor retained' >&2
            return 1
          fi
          if ! changed="$(git -C workspace diff --name-only "$before" "$after" --)"; then
            echo '::error title=Component source router::Workspace comparison still failed; refusing partial routing and cursor advancement' >&2
            return 1
          fi
          printf '%s\n' "$changed"
        }

        dispatch_component() {
          local event="$1" native_scope="${2:-}" workspace_sha="${3:-}"
          jq -n --arg event "$event" --arg native_scope "$native_scope" --arg workspace_sha "$workspace_sha" '
            {event_type:$event,client_payload:({source_router:true}
              + (if $native_scope == "" then {} else {native_scope:$native_scope} end)
              + (if $workspace_sha == "" then {} else {workspace_sha:$workspace_sha} end))}
          ' | gh api --method POST "$dispatch_api" --input - >/dev/null
          echo "[SOURCE-ROUTER][DISPATCH] $event native_scope=${native_scope:-default}"
        }

        workspace_seen="$(source_head workspace)"
        sdk_seen="$(source_head sdk)"
        web_seen="$(source_head web)"
        pantry_seen="$workspace_seen"
        echo "[SOURCE-ROUTER][READY] poll_seconds=${POLL_SECONDS}"

        deadline=$((SECONDS + 20700))
        while (( SECONDS < deadline )); do
          sleep "$POLL_SECONDS"

          workspace_next="$(source_head workspace)"
          sdk_next="$(source_head sdk)"
          web_next="$(source_head web)"
          pantry_next="$workspace_next"

          if [[ "$workspace_next" != "$workspace_seen" ]]; then
            changed="$(workspace_changes "$workspace_seen" "$workspace_next")"
            echo "[SOURCE-ROUTER][WORKSPACE] from=$workspace_seen to=$workspace_next"
            awk 'NF && ++shown <= 80' <<<"$changed"

            control=false
            grep -Fxq '.kyron/control/request.json' <<<"$changed" && control=true || true
            route="$(printf '%s\n' "$changed" | bash recipe/.github/scripts/classify_workspace_change.sh)"
            echo "[SOURCE-ROUTER][WORKSPACE/ROUTE] $route"
            # Validate the whole route before emitting any dispatch.
            [[ -n "$route" ]] || { echo '::error::empty Workspace route' >&2; exit 1; }
            for component in $route; do
              case "$component" in
                component-kyronlink|component-launcher|component-lib|workspace-release|none) ;;
                *) echo "::error::unknown Workspace route: $component" >&2; exit 1 ;;
              esac
            done
            for component in $route; do
              case "$component" in
                component-kyronlink) dispatch_component component-kyronlink '' "$workspace_next" ;;
                component-launcher) dispatch_component component-launcher '' "$workspace_next" ;;
                component-lib) dispatch_component component-lib '' "$workspace_next" ;;
                workspace-release) dispatch_component workspace-release '' "$workspace_next" ;;
                none) ;;
              esac
            done
            [[ "$control" == true ]] && dispatch_component kyron-laptop-control

            workspace_seen="$workspace_next"
          fi

          if [[ "$sdk_next" != "$sdk_seen" ]]; then
            echo "[SOURCE-ROUTER][SDK] from=$sdk_seen to=$sdk_next"
            dispatch_component component-sdk
            sdk_seen="$sdk_next"
          fi

          if [[ "$web_next" != "$web_seen" ]]; then
            echo "[SOURCE-ROUTER][WEB] from=$web_seen to=$web_next"
            dispatch_component component-web
            web_seen="$web_next"
          fi

          if [[ "$pantry_next" != "$pantry_seen" ]]; then
            echo "[SOURCE-ROUTER][PANTRY] from=$pantry_seen to=$pantry_next"
            if pantry_changed="$(git -C workspace diff --relative=Distribution --name-only "$pantry_seen" "$pantry_next" --)"; then
              pantry_file_count="$(printf '%s\n' "$pantry_changed" | sed '/^$/d' | wc -l)"
              # Conserve build jobs: unrelated Pantry changes do not trigger Lua.
              if (( pantry_file_count >= 300 )) || grep -Eq '^(lua/|img/|tools/)' <<<"$pantry_changed"; then
                dispatch_component component-lua
              fi
            else
              echo "::warning title=Pantry source router::tree comparison unavailable; conservatively checking Lua component" >&2
              dispatch_component component-lua
            fi
            pantry_seen="$pantry_next"
          fi

        done

        echo '[SOURCE-ROUTER][ROTATE] router window complete'
