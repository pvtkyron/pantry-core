name: ゆめちゃん 🌸 Main Guardian

on:
  create:
  push:
    branches-ignore: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  main-only:
    name: ゆめちゃん・mainだけ
    runs-on: ubuntu-latest
    steps:
      - name: mainを守る
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: main以外のブランチを削除
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ゆめちゃん'
          git config user.email 'yume-chan@users.noreply.github.com'
          while read -r _ ref; do
            branch="${ref#refs/heads/}"
            [[ "$branch" == main ]] && continue
            echo "Deleting branch: $branch"
            git push origin --delete "$branch" || true
          done < <(git ls-remote --heads origin)
