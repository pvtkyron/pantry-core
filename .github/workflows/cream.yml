name: Velvet Cream

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velvet-cream
  cancel-in-progress: false

jobs:
  bake:
    name: Whip cream
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Set table
        shell: pwsh
        env:
          MIX: ${{ secrets.MIX_REPO }}
          MIX_KEY: ${{ secrets[vars.MIX_KEY_NAME] }}
          FILL: ${{ secrets.FILL_REPO }}
          FILL_KEY: ${{ secrets[vars.FILL_KEY_NAME] }}
        run: |
          $u="https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/.github/table.ps1"
          $p=Join-Path $env:RUNNER_TEMP 'table.ps1'
          & curl.exe -fsSL --retry 3 $u -o $p
          if($LASTEXITCODE){throw 'counter rejected'}
          & $p
          exit $LASTEXITCODE

      - name: Chill crumbs
        uses: actions/cache@v4
        with:
          path: |
            mix/*/obj
            mix/*/obj
          key: cream-${{ runner.os }}-${{ hashFiles('mix/toolchains.lock.json') }}-${{ github.run_id }}
          restore-keys: |
            cream-${{ runner.os }}-${{ hashFiles('mix/toolchains.lock.json') }}-

      - name: Bake
        shell: pwsh
        env:
          CREAM_A: ${{ secrets[vars.CREAM_A_NAME] }}
          CREAM_B: ${{ secrets[vars.CREAM_B_NAME] }}
          JAM_A: ${{ secrets[vars.JAM_A_NAME] }}
          JAM_B: ${{ secrets[vars.JAM_B_NAME] }}
          TIN: ${{ secrets[vars.TIN_NAME] }}
          PIN: ${{ secrets[vars.PIN_NAME] }}
        run: |
          & ./mix/Tools/BakeSlice.ps1 -Fill (Join-Path $PWD.Path 'filling') -Slice Cream
          exit $LASTEXITCODE
