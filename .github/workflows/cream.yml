name: Velvet Cream

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velvet-cream
  cancel-in-progress: false

jobs:
  bake:
    name: Whip cream
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Dust counter
        shell: pwsh
        run: |
          Write-Host "::add-mask::$env:GITHUB_REPOSITORY"
          $crumb=$env:GITHUB_REPOSITORY -split '/',2
          foreach($x in $crumb){if($x){Write-Host "::add-mask::$x"}}
      - name: Open recipe
        uses: actions/checkout@v6
        with:
          ref: main
          path: recipe
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          sparse-checkout: .github/actions/table
      - name: Set table
        uses: ./recipe/.github/actions/table
        with:
          mix: ${{ secrets.MIX_REPO }}
          mix-key: ${{ secrets[vars.MIX_KEY_NAME] }}
          fill: ${{ secrets.FILL_REPO }}
          fill-key: ${{ secrets[vars.FILL_KEY_NAME] }}
      - name: Chill crumbs
        uses: actions/cache@v6.1.0
        with:
          path: |
            mix/*/obj
            mix/*/obj
          key: cream-${{ runner.os }}-${{ hashFiles('mix/toolchains.lock.json') }}-${{ github.run_id }}
          restore-keys: |
            cream-${{ runner.os }}-${{ hashFiles('mix/toolchains.lock.json') }}-

      - name: Bake
        shell: pwsh
        env:
          CREAM_A: ${{ secrets[vars.CREAM_A_NAME] }}
          CREAM_B: ${{ secrets[vars.CREAM_B_NAME] }}
          JAM_A: ${{ secrets[vars.JAM_A_NAME] }}
          JAM_B: ${{ secrets[vars.JAM_B_NAME] }}
          TIN: ${{ secrets[vars.TIN_NAME] }}
          PIN: ${{ secrets[vars.PIN_NAME] }}
        run: |
          & ./mix/Tools/BakeSlice.ps1 -Fill (Join-Path $PWD.Path 'filling') -Slice Cream
          exit $LASTEXITCODE
