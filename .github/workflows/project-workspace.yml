name: Project Workspace
'on':
  workflow_call:
    inputs:
      capsule:
        required: true
        type: string
      runtime_channel:
        required: false
        default: both
        type: string
      include_launcher:
        required: false
        default: false
        type: boolean
    outputs:
      superseded:
        description: This source was superseded and must not be published
        value: ${{ jobs.exe.outputs.superseded == 'true' || jobs.lib.outputs.superseded == 'true' || jobs.prepare.outputs.superseded == 'true' }}
      delivery_capsule:
        description: Encrypted private delivery state
        value: ${{ jobs.prepare.outputs.delivery_capsule }}
  workflow_dispatch:
    inputs:
      capsule:
        required: true
        type: string
      runtime_channel:
        required: false
        default: both
        type: string
      include_launcher:
        required: false
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  java:
    name: Java · compile + D8
    uses: ./.github/workflows/workspace-java.yml
    with:
      capsule: ${{ inputs.capsule }}
      include_launcher: ${{ inputs.include_launcher }}
    secrets: inherit
    if: ${{ github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' }}
  lib:
    permissions:
      contents: read
      actions: write
    name: Lib · VeraInternal Android native
    uses: ./.github/workflows/workspace-lib.yml
    with:
      capsule: ${{ inputs.capsule }}
      include_nativebridge: false
    secrets: inherit
    if: ${{ github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' }}
  exe:
    permissions:
      contents: read
      actions: write
    name: EXE · signed Windows launcher
    if: ${{ github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' && (inputs.include_launcher) }}
    uses: ./.github/workflows/workspace-exe.yml
    with:
      capsule: ${{ inputs.capsule }}
    secrets: inherit
  prepare:
    name: Prepare · verify handoffs + Pantry
    needs:
    - java
    - lib
    - exe
    if: ${{ github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' && (always() && needs.java.result
      == 'success' && needs.lib.result == 'success' && (needs.exe.result == 'success' || (inputs.include_launcher == false
      && needs.exe.result == 'skipped'))) && needs.exe.outputs.superseded != 'true' && needs.lib.outputs.superseded != 'true' }}
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/workspace-prepare.yml
    with:
      capsule: ${{ inputs.capsule }}
      runtime_channel: ${{ inputs.runtime_channel }}
      include_launcher: ${{ inputs.include_launcher }}
    secrets: inherit
