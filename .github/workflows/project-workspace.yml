name: Project Workspace

on:
  workflow_call:
    inputs:
      capsule:
        required: true
        type: string
      runtime_channel:
        required: false
        default: both
        type: string
      include_launcher:
        required: false
        default: false
        type: boolean
    outputs:
      delivery_capsule:
        description: Encrypted private delivery state
        value: ${{ jobs.build.outputs.delivery_capsule }}

permissions:
  contents: read

jobs:
  build:
    name: Build Workspace source graph
    runs-on: windows-2025
    timeout-minutes: 360
    outputs:
      delivery_capsule: ${{ steps.advance.outputs.capsule }}
    env:
      KYRON_SERIAL_BUILD: '1'
      KYRON_BUILD_JOBS: '2'
      KYRON_MSBUILD_TIMEOUT_SECONDS: '1200'
      KYRON_SLICE_TIMEOUT_SECONDS: '3600'
      KYRON_HEARTBEAT_SECONDS: '30'
    steps:
      - name: Open capsule helper
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: recipe
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          sparse-checkout: .github/actions/private-capsule

      - name: Open private Workspace state
        id: state
        uses: ./recipe/.github/actions/private-capsule
        with:
          mode: open
          key: ${{ secrets[vars.MIX_KEY_NAME] }}
          capsule: ${{ inputs.capsule }}
          project: workspace

      - name: Open private Workspace
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.state.outputs.workspace_repo }}
          token: ${{ secrets[vars.MIX_KEY_NAME] }}
          ref: ${{ steps.state.outputs.workspace_ref }}
          path: source
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: true
          show-progress: false

      - name: Open pinned Pantry
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.state.outputs.pantry_repo }}
          token: ${{ secrets[vars.FILL_KEY_NAME] }}
          ref: ${{ steps.state.outputs.pantry_ref }}
          path: filling
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: true
          show-progress: false

      - name: Open Pantry Core publish base
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: shelf
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Bind canonical release branches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($repo in @('source','filling','shelf')){
            & git -C $repo checkout -q -B main HEAD
            if($LASTEXITCODE){throw "release main binding rejected: $repo"}
          }

      - name: Materialize canonical code signer
        if: ${{ inputs.include_launcher == true }}
        shell: pwsh
        env:
          KYRON_CODESIGN_PFX_BASE64: ${{ secrets[vars.TIN_NAME] }}
          KYRON_CODESIGN_PASSWORD_SECRET: ${{ secrets[vars.PIN_NAME] }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:KYRON_CODESIGN_PFX_BASE64)){throw 'canonical signing secret unavailable: KYRON_CODESIGN_PFX_BASE64'}
          if([string]::IsNullOrWhiteSpace($env:KYRON_CODESIGN_PASSWORD_SECRET)){throw 'canonical signing secret unavailable: KYRON_CODESIGN_PASSWORD'}
          Write-Host "::add-mask::$($env:KYRON_CODESIGN_PFX_BASE64)"
          Write-Host "::add-mask::$($env:KYRON_CODESIGN_PASSWORD_SECRET)"
          $pfx=Join-Path $env:RUNNER_TEMP 'kyron-canonical.pfx'
          try{$raw=[Convert]::FromBase64String($env:KYRON_CODESIGN_PFX_BASE64)}catch{throw 'canonical signing PFX base64 is invalid'}
          [IO.File]::WriteAllBytes($pfx,$raw)
          $meta=Get-Content -LiteralPath './source/security/signing/canonical-signer.json' -Raw|ConvertFrom-Json
          $flags=[Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          try{$cert=[Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx,$env:KYRON_CODESIGN_PASSWORD_SECRET,$flags)}catch{throw 'canonical signing PFX could not be opened'}
          try{
            if(!$cert.HasPrivateKey){throw 'canonical signing PFX has no private key'}
            $sha=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($cert.RawData)).ToLowerInvariant()
            if($sha-ne([string]$meta.certificate_sha256).ToLowerInvariant()){throw 'canonical signing certificate SHA-256 mismatch'}
            if(($cert.Thumbprint-replace'\s','').ToLowerInvariant()-ne([string]$meta.thumbprint_sha1).ToLowerInvariant()){throw 'canonical signing certificate SHA-1 mismatch'}
            $rsa=[Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPublicKey($cert)
            if($null-eq$rsa-or$rsa.KeySize-ne2048){throw 'canonical signing certificate RSA key mismatch'}
            $mod=$rsa.ExportParameters($false).Modulus
            $modSha=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($mod)).ToLowerInvariant()
            if($modSha-ne([string]$meta.public_modulus_sha256).ToLowerInvariant()){throw 'canonical signing public modulus mismatch'}
            Write-Host "[SIGNING/CANONICAL][OK] certificate_sha256=$sha"
          }finally{
            if($null-ne$rsa){$rsa.Dispose()}
            $cert.Dispose()
            [Security.Cryptography.CryptographicOperations]::ZeroMemory($raw)
          }

      - name: Chill toolchains
        uses: actions/cache@v6.1.0
        with:
          path: |
            *-sdk/Android
            *-sdk/Java
            *-sdk/Smali
          key: workspace-toolchains-v6-${{ runner.os }}

      - name: Build and stage Pantry quietly
        shell: pwsh
        env:
          KYRON_CODESIGN_PFX: ${{ runner.temp }}\kyron-canonical.pfx
          KYRON_CODESIGN_PASSWORD: ${{ secrets[vars.PIN_NAME] }}
          KYRON_PANTRY_SIGNER_PROFILE: repository-v1
          KYRON_BOOTSTRAP_ROOT_PRIVATE_PEM: ${{ secrets[vars.CREAM_A_NAME] }}
          KYRON_CONTENT_PRIVATE_PEM: ${{ secrets[vars.JAM_A_NAME] }}
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'workspace-release.log'
          try{
            $recipe=Join-Path $PWD.Path 'source\PantryPublisher\Run-PantryRelease.ps1'
            $recipeSha=(Get-FileHash -LiteralPath $recipe -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "[PANTRY][RECIPE] owner=Run-PantryRelease.ps1 mode=prepare-only sha256=$recipeSha"
            $releaseArgs=@('-PantryPath',(Join-Path $PWD.Path 'filling'),'-PantryCorePath',(Join-Path $PWD.Path 'shelf'),'-RunId',[string][long]'${{ github.run_id }}','-RunAttempt',[string][int]'${{ github.run_attempt }}','-RuntimeChannel','${{ inputs.runtime_channel }}','-PrepareOnly')
            if('${{ inputs.include_launcher }}'-eq'true'){$releaseArgs+='-IncludeLauncher'}
            & $recipe @releaseArgs *>&1 | Set-Content -LiteralPath $log
            if($LASTEXITCODE){throw 'Canonical Workspace/Pantry release runner rejected prepare-only mode'}
            Write-Host '[PROJECT/WORKSPACE][OK]'
          }catch{
            $phase='canonical-runner'
            Write-Host "[PROJECT/WORKSPACE][FAIL] phase=$phase"
            exit 1
          }finally{
            if(Test-Path $log){Remove-Item $log -Force -ErrorAction SilentlyContinue}
          }

      - name: Remove ephemeral canonical signer
        if: ${{ always() }}
        shell: pwsh
        run: |
          $pfx=Join-Path $env:RUNNER_TEMP 'kyron-canonical.pfx'
          if(Test-Path -LiteralPath $pfx -PathType Leaf){
            [IO.File]::WriteAllBytes($pfx,(New-Object byte[] ((Get-Item -LiteralPath $pfx).Length)))
            Remove-Item -LiteralPath $pfx -Force
          }

      - name: Pin private Pantry delivery
        id: delivery
        shell: pwsh
        run: |
          & git -C filling fetch --quiet --prune origin main 1>$null 2>$null
          if($LASTEXITCODE){throw 'Pantry delivery refresh rejected'}
          $sha=(& git -C filling rev-parse refs/remotes/origin/main 2>$null).Trim().ToLowerInvariant()
          if($LASTEXITCODE-ne0-or$sha-notmatch'^[0-9a-f]{40}$'){throw 'Pantry delivery pin rejected'}
          Write-Host "::add-mask::$sha"
          "ref=$sha" >> $env:GITHUB_OUTPUT
          Write-Host '[PROJECT/WORKSPACE][DELIVERY][OK]'

      - name: Advance encrypted delivery state
        id: advance
        uses: ./recipe/.github/actions/private-capsule
        with:
          mode: advance
          key: ${{ secrets[vars.MIX_KEY_NAME] }}
          capsule: ${{ inputs.capsule }}
          pantry-ref: ${{ steps.delivery.outputs.ref }}
