name: Component · SDK
'on':
  workflow_dispatch: null
  repository_dispatch:
    types:
    - component-sdk
permissions:
  contents: read
concurrency:
  group: component-sdk${{ github.event_name == 'repository_dispatch' && (github.event.client_payload.source_router == true || github.event.client_payload.pantry_router == true || github.event.client_payload.pantry_delta == true) && '-deferred' || '' }}
  cancel-in-progress: false
jobs:
  sources:
    name: Pin source batch
    uses: ./.github/workflows/source-pin-component.yml
    secrets: inherit
    if: ${{ (github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main') && (github.event_name != 'repository_dispatch' || (github.event.client_payload.source_router != true && github.event.client_payload.pantry_router != true && github.event.client_payload.pantry_delta != true)) }}
  sdk:
    name: SDK only
    needs: sources
    if: ${{ (github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' && (needs.sources.result == 'success')) && (github.event_name != 'repository_dispatch' || (github.event.client_payload.source_router != true && github.event.client_payload.pantry_router != true && github.event.client_payload.pantry_delta != true)) }}
    uses: ./.github/workflows/project-sdk.yml
    with:
      capsule: ${{ needs.sources.outputs.capsule }}
    secrets: inherit
