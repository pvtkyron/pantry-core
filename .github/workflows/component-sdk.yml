name: Component · SDK

on:
  workflow_dispatch:
  repository_dispatch:
    types: [component-sdk]

permissions:
  contents: read

concurrency:
  group: component-sdk
  cancel-in-progress: true

jobs:
  sources:
    name: Pin source batch
    uses: ./.github/workflows/source-pin-component.yml
    secrets: inherit

  sdk:
    name: SDK only
    needs: sources
    if: ${{ needs.sources.result == 'success' }}
    uses: ./.github/workflows/project-sdk.yml
    with:
      capsule: ${{ needs.sources.outputs.capsule }}
    secrets: inherit