name: Component · Launcher
'on':
  workflow_dispatch: null
  repository_dispatch:
    types:
    - component-launcher
  push:
    branches:
    - main
    paths:
    - .github/workflows/launcher-publish.yml
    - .github/workflows/workspace-exe.yml
    - .github/launcher-publish.trigger
permissions:
  contents: read
concurrency:
  group: component-launcher-sparse-v1
  cancel-in-progress: true
jobs:
  sources:
    if: ${{ github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' && (github.event_name != 'push'
      || !contains(github.event.head_commit.message, '[full-release]')) }}
    name: Pin source batch
    uses: ./.github/workflows/source-pin-component.yml
    secrets: inherit
  launcher:
    permissions:
      contents: read
      actions: write
    name: Launcher · signed Windows executable only
    needs: sources
    if: ${{ github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' && (needs.sources.result == 'success')
      }}
    uses: ./.github/workflows/workspace-exe.yml
    with:
      capsule: ${{ needs.sources.outputs.capsule }}
      direct_publish: true
    secrets: inherit
