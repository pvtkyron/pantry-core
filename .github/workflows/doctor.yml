name: Pantry Source Validation
'on':
  workflow_call:
    inputs:
      capsule:
        required: true
        type: string
      platform:
        type: string
        required: false
        default: Both
  workflow_dispatch:
    inputs:
      capsule:
        required: true
        type: string
      platform:
        description: Validation platform; reuse already-passed checks on the other platform
        type: choice
        options:
        - Both
        - Portable
        - Windows
        default: Both
permissions:
  contents: read
jobs:
  portable:
    name: Portable checks
    runs-on: ubuntu-24.04
    steps:
    - name: Provision software EGL renderer and test font
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libgles2 fonts-dejavu-core
        test -r /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
    - name: Open capsule helper
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        path: recipe
        fetch-depth: 1
        persist-credentials: false
        show-progress: false
        sparse-checkout: .github
        sparse-checkout-cone-mode: false
    - name: Open private Workspace state
      id: state
      uses: ./recipe/.github/actions/private-capsule
      with:
        mode: open
        key: ${{ secrets[vars.MIX_KEY_NAME] }}
        capsule: ${{ inputs.capsule }}
        project: workspace
    - name: Open pinned Workspace and integrated distribution
      uses: actions/checkout@v6
      with:
        repository: ${{ secrets.MIX_REPO }}
        token: ${{ secrets[vars.MIX_KEY_NAME] }}
        ref: ${{ steps.state.outputs.workspace_ref }}
        path: source
        fetch-depth: 1
        persist-credentials: false
        show-progress: false
        sparse-checkout: |
          /*
        sparse-checkout-cone-mode: false
    - name: Verify native UI restart phase invariants
      shell: bash
      run: |
        set -euo pipefail
        test_file=source/Launcher/jni/tests/UiRestartPhaseTests.cpp
        c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic "$test_file" -o "$RUNNER_TEMP/kyron-ui-restart-phase"
        "$RUNNER_TEMP/kyron-ui-restart-phase"
    - name: Taste quietly
      shell: pwsh
      run: |
        $log=Join-Path $env:RUNNER_TEMP 'doctor-portable.log'
        try{
          & ./source/etc/devtools/BakeDoctor.ps1 -Mode Portable -Fill (Join-Path $PWD.Path 'source/Distribution') *>&1 | Set-Content -LiteralPath $log
          if($LASTEXITCODE){throw 'portable rejected'}
          Write-Host '[DOCTOR/PORTABLE][OK]'
        }catch{
          $phase='unknown'
          if(Test-Path $log){$m=[regex]::Match((Get-Content -LiteralPath $log -Raw),'(?m)^DOCTOR_SAFE_PHASE=([a-z0-9-]{1,48})\r?$');if($m.Success){$phase=$m.Groups[1].Value}}
          Write-Host "[DOCTOR/PORTABLE][FAIL] phase=$phase"
          if($phase-eq'overlay-gles2-gles3-runtime' -and (Test-Path -LiteralPath $log)){
            $raw=Get-Content -LiteralPath $log -Raw
            $reasons=[ordered]@{
              'font-missing'='a test TTF font is required'
              'egl-library-missing'='cannot find -l:libEGL.so.1|libEGL.so.1: cannot open shared object file'
              'native-compile-failed'='fatal error:|returned non-zero exit status'
              'egl-context-unavailable'='Mesa surfaceless EGL unavailable|EGL GLES API unavailable|RGBA pbuffer unavailable|host context unavailable|overlay context unavailable'
              'gl-dispatch-unavailable'='GL dispatch unavailable|GL pixel/texture queries unavailable'
              'gl-runtime-regression'='GLES version parsed incorrectly|wrong GLES profile|shader/font initialization failed|ImGui pixels were not rendered|unsupported GL call in render/font path|overlay teardown destroyed the host EGL display|host texture lost during overlay teardown'
            }
            foreach($reason in $reasons.Keys){if($raw-match$reasons[$reason]){Write-Host "[DOCTOR/PORTABLE][SAFE_REASON] $reason"}}
          }
          exit 1
        }finally{
          if(Test-Path $log){Remove-Item $log -Force -ErrorAction SilentlyContinue}
        }
    if: ${{ (github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main') && inputs.platform != 'Windows'
      }}
  windows:
    name: Windows checks
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
    - name: Enable Git long paths before checkout
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        & git config --global core.longpaths true
        if($LASTEXITCODE-ne0){throw 'Git long-path setup failed'}
    - name: Open capsule helper
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        path: recipe
        fetch-depth: 1
        persist-credentials: false
        show-progress: false
        sparse-checkout: .github
        sparse-checkout-cone-mode: false
    - name: Open private Workspace state
      id: state
      uses: ./recipe/.github/actions/private-capsule
      with:
        mode: open
        key: ${{ secrets[vars.MIX_KEY_NAME] }}
        capsule: ${{ inputs.capsule }}
        project: workspace
    - name: Open pinned Workspace and integrated distribution
      uses: actions/checkout@v6
      with:
        repository: ${{ secrets.MIX_REPO }}
        token: ${{ secrets[vars.MIX_KEY_NAME] }}
        ref: ${{ steps.state.outputs.workspace_ref }}
        path: source
        fetch-depth: 1
        persist-credentials: false
        show-progress: false
        sparse-checkout: |
          /*
        sparse-checkout-cone-mode: false
    - name: Import canonical doctor signer
      shell: pwsh
      env:
        KYRON_CODESIGN_PFX_BASE64: ${{ secrets.KYRON_CODESIGN_PFX_B64 }}
        KYRON_CODESIGN_PASSWORD_SECRET: ${{ secrets.KYRON_CODESIGN_PASSWORD }}
      run: |
        $ErrorActionPreference='Stop'
        if([string]::IsNullOrWhiteSpace($env:KYRON_CODESIGN_PFX_BASE64)-or[string]::IsNullOrWhiteSpace($env:KYRON_CODESIGN_PASSWORD_SECRET)){throw 'Canonical doctor signing secrets unavailable'}
        $raw=[Convert]::FromBase64String($env:KYRON_CODESIGN_PFX_BASE64)
        $flags=[Security.Cryptography.X509Certificates.X509KeyStorageFlags]::UserKeySet -bor [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::PersistKeySet
        $cert=$null;$rsa=$null;$store=$null
        try{
          $password=$env:KYRON_CODESIGN_PASSWORD_SECRET.TrimEnd([char[]]@(13,10))
          $cert=[Security.Cryptography.X509Certificates.X509Certificate2]::new($raw,$password,$flags)
          $meta=Get-Content -LiteralPath './source/etc/security/signing/canonical-signer.json' -Raw|ConvertFrom-Json
          $thumb=([string]$meta.thumbprint_sha1 -replace '[^0-9A-Fa-f]','').ToUpperInvariant()
          $sha=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($cert.RawData)).ToLowerInvariant()
          if(!$cert.HasPrivateKey -or $sha-ne([string]$meta.certificate_sha256).ToLowerInvariant() -or $cert.Thumbprint-ne$thumb){throw 'Canonical doctor certificate identity mismatch'}
          $rsa=[Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPublicKey($cert)
          if($null-eq$rsa){throw 'Canonical doctor certificate is not RSA'}
          $mod=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($rsa.ExportParameters($false).Modulus)).ToLowerInvariant()
          if($mod-ne([string]$meta.public_modulus_sha256).ToLowerInvariant()){throw 'Canonical doctor public modulus mismatch'}
          $store=[Security.Cryptography.X509Certificates.X509Store]::new('My',[Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser)
          $store.Open([Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
          if(@($store.Certificates|Where-Object {$_.Thumbprint-eq$thumb}).Count-ne0){throw 'Canonical doctor certificate already present'}
          $store.Add($cert)
          "KYRON_DOCTOR_CERT_THUMB=$thumb" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host '[DOCTOR/SIGNER][OK] exact canonical certificate imported into CurrentUser/My'
        }finally{
          if($null-ne$store){$store.Close();$store.Dispose()}
          if($null-ne$rsa){$rsa.Dispose()}
          if($null-ne$cert){$cert.Dispose()}
          [Security.Cryptography.CryptographicOperations]::ZeroMemory($raw)
        }
    - name: Verify signed AgentHub source and isolated shared-state semantics
      shell: powershell
      run: |
        $ErrorActionPreference='Stop'
        & ./source/etc/devtools/Verify-AgentHub-Canonical.ps1 -Smoke
        if($LASTEXITCODE){throw 'AgentHub canonical source regression rejected'}
    - name: Keep guarded V1 ownership regression on the canonical host
      shell: powershell
      run: |
        if((Test-Path -LiteralPath 'D:\kyron\.git') -and (Test-Path -LiteralPath 'D:\kyron\Distribution\SrcVersion.ini')){
          & ./source/etc/devtools/Test-AgentHub.ps1
          if($LASTEXITCODE){throw 'AgentHub guarded ownership regression rejected'}
        }else{
          Write-Host 'V1_OWNER_LEASE_REGRESSION=CANONICAL_KYRON_ONLY'
        }
    - name: Taste quietly
      shell: pwsh
      run: |
        $log=Join-Path $env:RUNNER_TEMP 'doctor-windows.log'
        try{
          & ./source/etc/devtools/BakeDoctor.ps1 -Mode Windows -Fill (Join-Path $PWD.Path 'source/Distribution') *>&1 | Set-Content -LiteralPath $log
          if($LASTEXITCODE){throw 'windows rejected'}
          Write-Host '[DOCTOR/WINDOWS][OK]'
        }catch{
          $phase='unknown'
          if(Test-Path $log){$m=[regex]::Match((Get-Content -LiteralPath $log -Raw),'(?m)^DOCTOR_SAFE_PHASE=([a-z0-9-]{1,48})\r?$');if($m.Success){$phase=$m.Groups[1].Value}}
          Write-Host "[DOCTOR/WINDOWS][FAIL] phase=$phase"
          if($phase -in @('powershell-regressions','powershell-safety') -and (Test-Path $log)){
            $safe=@(Get-Content -LiteralPath $log | Where-Object {
              $_ -like '*invariant missing*' -or $_ -like '*regression contract is missing*' -or
              $_ -like '*must*' -or $_ -like '*drifted*' -or $_ -like '*reappeared*' -or
              $_ -like '*reserved variable*' -or $_ -like '*parse error:*' -or $_ -like '*PowerShell safety preflight failed*'
            })
            if($safe.Count){
              $notice=[string]$safe[-1]
              $notice=$notice -replace '[^A-Za-z0-9 .:_,-]',' '
              if($notice.Length -gt 150){$notice=$notice.Substring(0,150)}
              Write-Host "[DOCTOR/WINDOWS][SAFE_REASON] $notice"
            }
          }
          exit 1
        }finally{
          if(Test-Path $log){Remove-Item $log -Force -ErrorAction SilentlyContinue}
        }
    - name: Remove canonical doctor signer
      if: ${{ always() }}
      shell: pwsh
      run: |
        if($env:KYRON_DOCTOR_CERT_THUMB -match '^[0-9A-F]{40}$'){
          $cert=Get-Item -LiteralPath "Cert:\CurrentUser\My\$env:KYRON_DOCTOR_CERT_THUMB" -ErrorAction SilentlyContinue
          if($cert){Remove-Item -LiteralPath $cert.PSPath -Force}
        }
    if: ${{ (github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main') && inputs.platform != 'Portable'
      }}
