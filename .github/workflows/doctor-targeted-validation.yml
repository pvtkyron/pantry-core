name: KYRON Targeted Doctor Validation
'on':
  workflow_dispatch:
    inputs:
      platform:
        description: Validation platform; reuse already-passed checks on the other platform
        type: choice
        options:
        - Both
        - Portable
        - Windows
        default: Both
  push:
    branches:
    - main
    paths:
    - .github/workflows/doctor-targeted-validation.yml
    - .github/workflows/doctor.yml
permissions:
  contents: read
concurrency:
  group: kyron-targeted-doctor
  cancel-in-progress: false
jobs:
  sources:
    name: Pin private sources for Doctor
    uses: ./.github/workflows/source-pin-component.yml
    secrets: inherit
    if: ${{ github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' }}
  doctor:
    name: Validate portable and Windows contracts
    needs: sources
    if: ${{ github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' && (needs.sources.result == 'success')
      }}
    uses: ./.github/workflows/doctor.yml
    with:
      capsule: ${{ needs.sources.outputs.capsule }}
      platform: ${{ inputs.platform }}
    secrets: inherit
