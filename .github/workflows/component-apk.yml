name: Component · RevTranslator
'on':
  workflow_dispatch: null
  repository_dispatch:
    types:
    - component-apk
permissions:
  contents: read
concurrency:
  group: component-apk
  cancel-in-progress: true
jobs:
  sources:
    name: Pin source batch
    uses: ./.github/workflows/source-pin-component.yml
    secrets: inherit
    if: ${{ github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' }}
  apk:
    name: ABI · RevTranslator native matrix
    needs: sources
    if: ${{ github.repository == 'pvtkyron/pantry-core' && github.ref == 'refs/heads/main' && (needs.sources.result == 'success')
      }}
    uses: ./.github/workflows/workspace-apk.yml
    with:
      capsule: ${{ needs.sources.outputs.capsule }}
      component_mode: true
    secrets: inherit
