name: ゆめちゃん 🌸 Rewrite Bot Author Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/yume-rewrite-bot-author-once.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full main history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Rewrite only github-actions bot identity
        shell: bash
        run: |
          set -euo pipefail
          export FILTER_BRANCH_SQUELCH_WARNING=1
          git filter-branch -f --env-filter '
            if [ "$GIT_AUTHOR_NAME" = "github-actions[bot]" ] || [ "$GIT_AUTHOR_EMAIL" = "41898282+github-actions[bot]@users.noreply.github.com" ]; then
              export GIT_AUTHOR_NAME="ゆめちゃん"
              export GIT_AUTHOR_EMAIL="yume-chan@users.noreply.github.com"
            fi
            if [ "$GIT_COMMITTER_NAME" = "github-actions[bot]" ] || [ "$GIT_COMMITTER_EMAIL" = "41898282+github-actions[bot]@users.noreply.github.com" ]; then
              export GIT_COMMITTER_NAME="ゆめちゃん"
              export GIT_COMMITTER_EMAIL="yume-chan@users.noreply.github.com"
            fi
          ' -- main

          if git log main --format='%an <%ae>|%cn <%ce>' | grep -F 'github-actions[bot]'; then
            echo 'github-actions[bot] still exists in main history' >&2
            exit 1
          fi
          git log main --format='%an <%ae>' | grep -F 'ゆめちゃん <yume-chan@users.noreply.github.com>' >/dev/null
          git push --force origin main
