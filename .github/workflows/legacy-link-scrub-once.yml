name: Jessica legacy-link scrub once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/legacy-link-scrub-once.yml

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Replace deleted repository identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files='''404.html
          about.html
          faq.html
          index.html
          journal.html
          posts/buyer-guide.html
          posts/github-first.html
          posts/project-rev-standard.html
          posts/pubg-player-market-guide.html
          products/rev-bundle.html
          products/rev-core.html
          products/rev-priority.html
          products/rev-studio.html
          products/rev-toolkit.html
          products/rev-vault.html
          robots.txt
          scripts/validate-static-site.js
          shop.html
          sitemap.html
          sitemap.xml'''.splitlines()
          old='Live2dOnWeb'+'v1.0.0'
          old_re='Live2dOnWeb'+'v1\\.0\\.0'
          changed=[]
          for name in files:
              p=Path(name.strip())
              s=p.read_text(encoding='utf-8')
              n=s.replace(old,'pantry-core').replace(old_re,'pantry-core')
              n=n.replace('pvtkyron/pantry-core@master','pvtkyron/pantry-core@main')
              if n!=s:
                  p.write_text(n,encoding='utf-8')
                  changed.append(str(p))
          print('changed:', *changed, sep='\n- ')
          PY

      - name: Verify identity and static routes
        run: |
          node scripts/check-delivery.js
          node scripts/validate-static-site.js

      - name: Commit scrubbed links
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Jessica'
          git config user.email 'jessica@pantry-core.invalid'
          git add 404.html about.html faq.html index.html journal.html posts products robots.txt scripts/validate-static-site.js shop.html sitemap.html sitemap.xml
          if git diff --cached --quiet; then
            echo 'No legacy links left to change.'
            exit 0
          fi
          git commit -m 'Jessica: fully migrate deleted Live2D repo links to pantry-core'
          git push origin HEAD:main
