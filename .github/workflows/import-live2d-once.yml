name: Import Live2D once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-live2d-once.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pantry-core
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Clone Live2D source
        run: git clone --depth 1 --branch master https://github.com/pvtkyron/Live2dOnWebv1.0.0.git /tmp/live2d

      - name: Import without touching kura or workflows
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude='.git' --exclude='kura' --exclude='.github/workflows' /tmp/live2d/ "$GITHUB_WORKSPACE/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to import.'
            exit 0
          fi
          git commit -m 'Import Live2dOnWebv1.0.0 into pantry-core'
          git push origin HEAD:main
