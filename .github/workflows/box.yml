name: Night Box

on:
  workflow_call:
    inputs:
      fold:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      fold:
        description: Fold fresh cream
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: night-box
  cancel-in-progress: false

jobs:
  pack:
    name: Pack box
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Set table
        shell: pwsh
        env:
          SHELF: ${{ github.repository }}
          SHELF_KEY: ${{ github.token }}
          MIX: ${{ secrets.MIX_REPO }}
          MIX_KEY: ${{ secrets[vars.MIX_KEY_NAME] }}
          FILL: ${{ secrets.FILL_REPO }}
          FILL_KEY: ${{ secrets[vars.FILL_KEY_NAME] }}
        run: |
          $u="https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/.github/table.ps1"
          $p=Join-Path $env:RUNNER_TEMP 'table.ps1'
          & curl.exe -fsSL --retry 3 $u -o $p
          if($LASTEXITCODE){throw 'counter rejected'}
          & $p -Shelf
          exit $LASTEXITCODE

      - name: Chill flour
        uses: actions/cache@v4
        with:
          path: '*-sdk/Python'
          key: flour-${{ runner.os }}-${{ hashFiles('mix/toolchains.lock.json') }}

      - name: Pack
        shell: pwsh
        env:
          CREAM_A: ${{ secrets[vars.CREAM_A_NAME] }}
          CREAM_B: ${{ secrets[vars.CREAM_B_NAME] }}
          JAM_A: ${{ secrets[vars.JAM_A_NAME] }}
          JAM_B: ${{ secrets[vars.JAM_B_NAME] }}
          TIN: ${{ secrets[vars.TIN_NAME] }}
          PIN: ${{ secrets[vars.PIN_NAME] }}
        run: |
          $a=@{
            Fill=(Join-Path $PWD.Path 'filling')
            Shelf=(Join-Path $PWD.Path 'shelf')
            Slice='Box'
            Batch=[long]'${{ github.run_id }}'
            Try=[int]'${{ github.run_attempt }}'
          }
          if('${{ inputs.fold }}'-eq'true'){$a.Fold=$true}
          & ./mix/Tools/BakeSlice.ps1 @a
          exit $LASTEXITCODE
