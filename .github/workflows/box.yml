name: Pantry Prepare + Publish

on:
  workflow_call:
    inputs:
      capsule:
        required: true
        type: string
      runtime_channel:
        required: false
        default: both
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Prepare and publish Pantry Core
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Open capsule helper
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: recipe
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          sparse-checkout: .github/actions/private-capsule

      - name: Open private Workspace state
        id: state
        uses: ./recipe/.github/actions/private-capsule
        with:
          mode: open
          key: ${{ secrets[vars.MIX_KEY_NAME] }}
          capsule: ${{ inputs.capsule }}
          project: workspace

      - name: Open private Workspace
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.state.outputs.workspace_repo }}
          token: ${{ secrets[vars.MIX_KEY_NAME] }}
          ref: ${{ steps.state.outputs.workspace_ref }}
          path: source
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: true
          show-progress: false

      - name: Open private Pantry delivery
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.state.outputs.pantry_repo }}
          token: ${{ secrets[vars.FILL_KEY_NAME] }}
          ref: ${{ steps.state.outputs.pantry_ref }}
          path: filling
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: true
          show-progress: false

      - name: Open Pantry Core publish target
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: shelf
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Bind canonical release branches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($repo in @('source','filling','shelf')){
            & git -C $repo checkout -q -B main HEAD
            if($LASTEXITCODE){throw "release main binding rejected: $repo"}
          }

      - name: Chill Workspace toolchains
        uses: actions/cache@v6.1.0
        with:
          path: |
            *-sdk/Android
            *-sdk/Java
            *-sdk/Smali
          key: workspace-toolchains-v6-${{ runner.os }}

      - name: Chill publisher Python
        uses: actions/cache@v6.1.0
        with:
          path: '*-sdk/Python'
          key: pantry-publisher-python-v3-${{ runner.os }}-${{ hashFiles('source/toolchains.lock.json') }}

      - name: Prepare and publish quietly
        shell: pwsh
        env:
          KYRON_PANTRY_SIGNER_PROFILE: repository-v1
          KYRON_BOOTSTRAP_ROOT_PRIVATE_PEM: ${{ secrets[vars.CREAM_A_NAME] }}
          KYRON_CONTENT_PRIVATE_PEM: ${{ secrets[vars.JAM_A_NAME] }}
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'pantry-publish.log'
          try{
            $recipe=Join-Path $PWD.Path 'source\PantryPublisher\Run-PantryRelease.ps1'
            $recipeSha=(Get-FileHash -LiteralPath $recipe -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "[PANTRY][RECIPE] owner=Run-PantryRelease.ps1 mode=publish sha256=$recipeSha"
            & $recipe -PantryPath (Join-Path $PWD.Path 'filling') -PantryCorePath (Join-Path $PWD.Path 'shelf') -RunId ([long]'${{ github.run_id }}') -RunAttempt ([int]'${{ github.run_attempt }}') -RuntimeChannel '${{ inputs.runtime_channel }}' -ArtifactPlan both -IncludeLauncher -SkipArtifactPromotion *>&1 | Set-Content -LiteralPath $log
            if($LASTEXITCODE){throw 'Canonical Workspace/Pantry release runner rejected publish mode'}
            Write-Host '[PANTRY/PUBLISH][OK] private Pantry prepared and public Core published'
          }catch{
            $phase='canonical-runner'
            Write-Host "[PANTRY/PUBLISH][FAIL] phase=$phase"
            exit 1
          }finally{
            if(Test-Path $log){Remove-Item $log -Force -ErrorAction SilentlyContinue}
          }
