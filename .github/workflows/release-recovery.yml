name: Kyron Full Release automatic recovery
'on':
  workflow_run:
    workflows:
    - Kyron Full Release · 6h
    types:
    - completed
    branches:
    - main
permissions:
  contents: read
  actions: read
concurrency:
  group: kyron-release-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  recover:
    name: Diagnose and retry one transport-only failure
    if: ${{ github.repository == 'pvtkyron/pantry-core' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
    - name: Open maintained recovery controller
      uses: actions/checkout@v6
      with:
        ref: main
        persist-credentials: false
        fetch-depth: 1
        sparse-checkout: .github/scripts
        sparse-checkout-cone-mode: false
    - name: Inspect original run and recover only permitted failures
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 .github/scripts/release_recovery.py
