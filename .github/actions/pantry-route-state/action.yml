name: Checkpoint Pantry route state
description: Preserve verified publication routes without racing the private source main branch
inputs:
  source_root:
    description: Integrated Workspace Distribution folder used by the verified publisher
    required: true
  source_sha:
    description: Exact source commit used by the verified publisher
    required: true
runs:
  using: composite
  steps:
    - name: Checkpoint verified route state
      shell: bash
      env:
        PANTRY_ROUTE_SOURCE_ROOT: ${{ inputs.source_root }}
        PANTRY_ROUTE_SOURCE_SHA: ${{ inputs.source_sha }}
      run: bash "$GITHUB_ACTION_PATH/checkpoint.sh"
